<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>phase — test</title>
  <style>
    html, body { margin: 0; background: #0a0e12; color: #6f8aa0;
                 font: 13px/1.6 ui-monospace, monospace; }
    #out { padding: 28px; white-space: pre; }
    .pass { color: #62f0c0; } .fail { color: #ff6b6b; }
    #sum { padding: 0 28px 28px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="out"></div>
  <div id="sum"></div>
  <script type="module">
    import { wrap1, phase, createMaster } from './phase.js';

    const out = document.querySelector('#out');
    const sum = document.querySelector('#sum');
    let pass = 0, fail = 0;
    const EPS = 1e-12;
    /** @param {string} name @param {boolean} ok */
    function check(name, ok) {
      out.innerHTML += `<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}</span>  ${name}\n`;
      ok ? pass++ : fail++;
    }
    /** @param {string} name @param {number} got @param {number} want */
    const near = (name, got, want) => check(`${name}  (${got} ≈ ${want})`, Math.abs(got - want) < EPS);

    // wrap1 — into [0,1)
    near('wrap1(1.25)', wrap1(1.25), 0.25);
    near('wrap1(-0.25)', wrap1(-0.25), 0.75);
    near('wrap1(2)', wrap1(2), 0);
    near('wrap1(0)', wrap1(0), 0);

    // phase = (m·ratio + offset) mod 1
    near('phase(0.25, 2)', phase(0.25, 2), 0.5);
    near('phase(0.5, 2)', phase(0.5, 2), 0);          // 2 cycles per master → back to 0 at half
    near('phase(0.5, 1, 0.15)', phase(0.5, 1, 0.15), 0.65);
    near('phase wraps offset', phase(0.9, 1, 0.2), 0.1);

    // pendulum: integer ratio n returns to start phase at every master wrap
    near('pendulum n=3 at M=0', phase(0, 3), 0);
    near('pendulum n=3 at M→1', phase(wrap1(1), 3), 0);

    // determinism: same M ⇒ same phase
    check('deterministic', phase(0.37, Math.PI) === phase(0.37, Math.PI));

    // master advance: period 2, dt 1 → M = 0.5
    const a = createMaster(2);
    near('advance(1) @period2', a.advance(1), 0.5);
    near('advance(1) wraps', a.advance(1), 0);

    // speed-change immunity: changing period does not move current M
    const b = createMaster(1);
    b.advance(0.5);
    const before = b.M;
    b.period = 10;                                     // speed change mid-run
    check('period change leaves M', b.M === before);
    near('future advance uses new period', b.advance(0.5), 0.55);

    // external driver: set M directly
    const c = createMaster();
    near('set(1.3) wraps', c.set(1.3), 0.3);

    // save / recall is exact
    const d = createMaster(3, 0.42);
    const snap = d.save();
    d.advance(1.7); d.set(0.9);                        // perturb
    d.load(snap);
    check('save/load restores M', Math.abs(d.M - 0.42) < EPS);
    check('save/load restores period', d.period === 3);

    sum.className = fail === 0 ? 'pass' : 'fail';
    sum.textContent = `${pass} passed, ${fail} failed`;
  </script>
</body>
</html>
