<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kit</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0a0e12;
                 color: #6f8aa0; font: 13px/1.5 ui-monospace, monospace; }
    #gallery { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 30px; padding: 32px; }
    .sec { display: flex; flex-direction: column; gap: 14px; min-width: 340px; }
    .sech { color: #cfe6f5; letter-spacing: 0.08em; border-bottom: 1px solid #1c2630;
            padding-bottom: 7px; text-transform: uppercase; font-size: 12px; }
    .sec .row { display: flex; align-items: center; gap: 14px; }
    .sec .tag { color: #4a5a68; width: 150px; text-align: right; flex: 0 0 auto; }
    .sec .arrow { color: #2a3a48; }
    .blk { width: 26px; height: 26px; background: #16202b; border: 1px solid #2a3a48; border-radius: 4px; }
    .kcanvas { background: #05080d; border: 1px solid #1c2630; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="gallery"></div>
  <script type="module" src="./main.js"></script>
  <!-- dev live-reload: poll this project's source files; reload on change. Inert
       off localhost, so a copy taken out of the lattice never polls. -->
  <script>
    (function () {
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
      var files = ['main.js', 'scrub.js', 'button.js', 'toggle.js', 'selector.js',
                   'pad.js', 'field.js', 'readout.js', 'meter.js', 'disclosure.js',
                   'layout.js', 'binding.js'];
      var seen = {};
      setInterval(function () {
        files.forEach(function (f) {
          fetch('./' + f, { method: 'HEAD', cache: 'no-store' })
            .then(function (r) {
              var tag = r.headers.get('Last-Modified') || r.headers.get('ETag') || '';
              if (seen[f] === undefined) { seen[f] = tag; return; }
              if (tag !== seen[f]) location.reload();
            })
            .catch(function () {});
        });
      }, 1000);
    })();
  </script>
</body>
</html>
