<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kit — workbench</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0e12; overflow: hidden;
                 color: #9fc4dc; font: 13px/1.4 ui-monospace, monospace; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #main { display: flex; flex: 1; min-height: 0; }

    /* toolbar — kept thin for short windows */
    #toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
               padding: 6px 12px; border-bottom: 1px solid #1c2630; background: #0c1218; }
    #toolbar .tmode { display: flex; gap: 4px; }
    .tbtn { font: 12px ui-monospace, monospace; color: #6f8aa0; background: #11161d;
            border: 1px solid #1c2630; border-radius: 6px; padding: 5px 13px; cursor: pointer; }
    .tbtn:hover { color: #9fc4dc; border-color: #2a3a48; }
    .tbtn.on { color: #02040a; background: #4fb8e8; border-color: #4fb8e8; }
    #toolbar .tsep { flex: 1; }
    #toolbar .thint { color: #4a5a68; font-size: 11px; }

    /* parts palette */
    #palette { width: 104px; flex: 0 0 auto; border-right: 1px solid #1c2630;
               display: flex; flex-direction: column; gap: 5px; padding: 10px 9px; overflow-y: auto; }
    #palette .ph { color: #4a5a68; letter-spacing: 0.07em; text-transform: uppercase; font-size: 10px; margin-bottom: 3px; }
    .pitem { font: 12px ui-monospace, monospace; color: #9fc4dc; background: #11161d;
             border: 1px solid #1c2630; border-radius: 5px; padding: 6px 9px; cursor: pointer; text-align: left; }
    .pitem:hover { color: #cfe6f5; border-color: #2a3a48; background: #16202b; }
    .pitem.lay { color: #6f8aa0; border-style: dashed; }   /* layout containers */

    /* the instrument: left pool · center canvas · right pool */
    #canvas { flex: 1; position: relative; display: flex; gap: 1px; background: #161e26; min-width: 0; }
    .zone { display: flex; flex-direction: column; background: #080b0f; min-width: 0; }
    .zone.left, .zone.right { flex: 1; }
    .zone.center { flex: 2; background: #06080c; }
    .zhead { padding: 5px 10px; font-size: 10px; color: #4a5a68; text-transform: uppercase;
             letter-spacing: 0.07em; border-bottom: 1px solid #11161d; cursor: pointer; flex: 0 0 auto; }
    .zone.selected { outline: 1px solid #4fb8e8; outline-offset: -1px; }
    .zbody { flex: 1; padding: 10px; overflow: auto; align-content: flex-start; }
    .active-drop { box-shadow: inset 0 0 0 1px #233f52; }     /* where new parts land */

    /* a placed part */
    .node { display: inline-flex; border: 1px solid transparent; border-radius: 5px; padding: 2px; cursor: grab; }
    .node:hover { border-color: #233040; }
    .node.selected { border-color: #4fb8e8; outline: 1px solid #4fb8e8; }
    .node.dragging { opacity: 0.6; }
    .ninner { pointer-events: none; }                         /* leaf parts inert while designing */
    .node.isCont > .ninner { pointer-events: auto; }          /* containers stay live: grip + children + nesting */
    body.mode-interact .node { cursor: default; }
    body.mode-interact .ninner { pointer-events: auto; }      /* live in interact */
    body.mode-interact .node { border-color: transparent !important; outline: none !important; }

    /* layout containers */
    .cont { position: relative; display: flex; flex-direction: column; border: 1px dashed #1c2630; border-radius: 6px; min-width: 40px; min-height: 26px; }
    .cont .cbody { padding: 8px; flex: 1; }
    .chandle { position: absolute; right: 1px; bottom: 1px; width: 13px; height: 13px; cursor: nwse-resize; z-index: 4;
               background: linear-gradient(135deg, transparent 45%, #2a3a48 45%, #2a3a48 75%, transparent 75%); border-radius: 0 0 5px 0; }
    .chandle:hover { background: linear-gradient(135deg, transparent 45%, #4fb8e8 45%, #4fb8e8 75%, transparent 75%); }
    body.mode-interact .chandle { display: none; }
    .chead { display: flex; align-items: center; gap: 6px; padding: 5px 9px; color: #6f8aa0;
             font-size: 11px; cursor: pointer; border-bottom: 1px solid #11161d; }
    .ccaret { transition: transform .12s; color: #4a5a68; }
    .cont.closed .ccaret { transform: rotate(-90deg); }
    .cont.closed .cbody { display: none !important; }

    /* inspector */
    #inspector { width: 196px; flex: 0 0 auto; border-left: 1px solid #1c2630; padding: 12px 12px;
                 display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .ihint { color: #4a5a68; }
    .ititle { color: #cfe6f5; letter-spacing: 0.06em; text-transform: uppercase; font-size: 11px;
              border-bottom: 1px solid #1c2630; padding-bottom: 6px; }
    .irow { display: flex; align-items: center; }
    .idelete { margin-top: 4px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar"></div>
    <div id="main">
      <div id="palette"><div class="ph">parts</div></div>
      <div id="canvas"></div>
      <div id="inspector"></div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
  <!-- dev live-reload: poll source files; reload on change. Inert off localhost. -->
  <script>
    (function () {
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
      var files = ['main.js', 'workbench.js', 'scrub.js', 'button.js', 'toggle.js', 'selector.js',
                   'pad.js', 'field.js', 'readout.js', 'meter.js', 'scope.js', 'binding.js'];
      var seen = {};
      setInterval(function () {
        files.forEach(function (f) {
          fetch('./' + f, { method: 'HEAD', cache: 'no-store' })
            .then(function (r) {
              var tag = r.headers.get('Last-Modified') || r.headers.get('ETag') || '';
              if (seen[f] === undefined) { seen[f] = tag; return; }
              if (tag !== seen[f]) location.reload();
            })
            .catch(function () {});
        });
      }, 1000);
    })();
  </script>
</body>
</html>
