<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kit</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0a0e12;
                 color: #6f8aa0; font: 13px/1.5 ui-monospace, monospace; }
    #gallery { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 22px; padding: 32px; }
    #gallery .note { color: #4a5a68; letter-spacing: 0.04em; }
    .panel { background: #0c1218; border: 1px solid #1c2630; border-radius: 8px; min-width: 260px; }
    .phead { padding: 8px 12px; color: #6f8aa0; border-bottom: 1px solid #1c2630;
             cursor: move; user-select: none; letter-spacing: 0.03em; background: #11161d;
             border-radius: 8px 8px 0 0; touch-action: none; }
    .pbody { padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 14px; }
    .out { color: #62f0c0; min-width: 70px; }
    .big { color: #cfe6f5; font-size: 18px; min-width: 140px; letter-spacing: 0.02em; }
  </style>
</head>
<body>
  <div id="gallery"></div>
  <script type="module" src="./main.js"></script>
  <!-- dev live-reload: poll this project's source files; reload on change. Inert
       off localhost, so a copy taken out of the lattice never polls. -->
  <script>
    (function () {
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
      var files = ['main.js', 'scrub.js'];
      var seen = {};
      setInterval(function () {
        files.forEach(function (f) {
          fetch('./' + f, { method: 'HEAD', cache: 'no-store' })
            .then(function (r) {
              var tag = r.headers.get('Last-Modified') || r.headers.get('ETag') || '';
              if (seen[f] === undefined) { seen[f] = tag; return; }
              if (tag !== seen[f]) location.reload();
            })
            .catch(function () {});
        });
      }, 1000);
    })();
  </script>
</body>
</html>
