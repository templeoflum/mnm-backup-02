<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TS — U0 clock</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0e12; overflow: hidden;
                 color: #6f8aa0; font: 13px/1.5 ui-monospace, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #msg { position: fixed; top: 20px; left: 0; right: 0; text-align: center;
           pointer-events: none; white-space: pre; letter-spacing: 0.03em; }
    #controls { position: fixed; bottom: 26px; left: 0; right: 0;
                display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #read { color: #9fc4dc; font-size: 14px; letter-spacing: 0.04em;
            white-space: pre; pointer-events: none; }
    #controls label { font-size: 12px; letter-spacing: 0.04em; }
    #period { width: min(62vw, 440px); accent-color: #4fb8e8; cursor: pointer; }
  </style>
</head>
<body>
  <canvas></canvas>
  <div id="msg">U0 &mdash; the clock</div>
  <div id="controls">
    <div id="read">phase 0.000   ·   angle   0.0&deg;   ·   cycle 0</div>
    <label>speed <span id="pval">0.50 Hz</span></label>
    <input id="period" type="range" min="0" max="1" step="0.001" value="0.283" />
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
