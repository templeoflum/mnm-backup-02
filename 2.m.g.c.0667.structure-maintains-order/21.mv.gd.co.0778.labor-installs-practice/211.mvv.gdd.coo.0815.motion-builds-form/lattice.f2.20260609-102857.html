let debugOpen = false;
let _renderCount = 0;
const _debugLog = [];

function toggleDebug() {
  debugOpen = !debugOpen;
  document.getElementById('debug-overlay').classList.toggle('open', debugOpen);
  document.getElementById('debug-toggle').classList.toggle('on', debugOpen);
  if (debugOpen) renderDebugState();
}

function debugEntry(type, msg) {
  const ts = new Date().toISOString().slice(11, 23);
  _debugLog.unshift({ type, msg, ts });
  if (_debugLog.length > 200) _debugLog.length = 200;
  if (debugOpen) renderDebugLog();
}

function renderDebugState() {
  const el = document.getElementById('debug-state');
  const depth = currentAddr.length;
  const openKeys = Object.keys(v0Open).filter(k => v0Open[k]).join(' ');
  el.innerHTML = `
    <div class="debug-section-title">state</div>
    <div class="debug-state-grid">
      <span class="l">addr</span><span class="v">${currentAddr} (depth ${depth})</span>
      <span class="l">view</span><span class="v">${activeView} (${['spec','ops','config'][activeView]})</span>
      <span class="l">v0open</span><span class="v">${openKeys || 'none'}</span>
      <span class="l">v0col</span><span class="v">${v0Collapsed}</span>
      <span class="l">cache</span><span class="v">${Object.keys(_fileCache).length} loaded, ${Object.keys(_filePending).length} pending</span>
      <span class="l">renders</span><span class="v">${_renderCount}</span>
    </div>`;
}

function renderDebugLog() {
  const el = document.getElementById('debug-log');
  el.innerHTML = _debugLog.slice(0, 80).map(e =>
    `<div class="debug-entry"><span class="${e.type}">[${e.ts}] ${e.msg}</span></div>`
  ).join('');
}

function debugEval(expr) {
  try {
    const result = eval(expr);
    debugEntry('action', `eval: ${expr} → ${JSON.stringify(result)}`);
  } catch (err) {
    debugEntry('error', `eval: ${expr} → ${err.message}`);
  }
}

function consoleExec(input) {
  const raw = input.trim();
  if (!raw) return;
  const parts = raw.split(/\s+/);
  const cmd = parts[0].toLowerCase();

  // echo input
  debugEntry('key', `> ${raw}`);

  switch (cmd) {
    case 'help':
      debugEntry('action', 'commands:');
      debugEntry('action', '  list [addr]          — files at address (default: current)');
      debugEntry('action', '  read [file]          — read file at current address');
      debugEntry('action', '  read [addr] [file]   — read file at address');
      debugEntry('action', '  move [file] [from] [to] — move file between addresses');
      debugEntry('action', '  fold [file] [addr]   — create next fold');
      debugEntry('action', '  create [type] [scope] [addr] — new file');
      debugEntry('action', '  log [C|O|D] [what]   — append log entry');
      debugEntry('action', '  go [addr]            — navigate to address');
      debugEntry('action', '  eval [expr]          — raw JS eval');
      debugEntry('action', '  clear                — clear console log');
      break;

    case 'list': {
      const addr = parts[1] || currentAddr;
      fetch(`/list/${addr}`, { cache: 'no-store' })
        .then(r => r.json())
        .then(data => {
          if (data.error) { debugEntry('error', data.error); return; }
          const files = data.files || [];
          debugEntry('action', `${addr}: ${files.length} file(s)`);
          files.forEach(f => debugEntry('action', `  ${f}`));
          const docs = data.documents || {};
          const dk = Object.keys(docs);
          if (dk.length) {
            debugEntry('action', `  ${dk.length} document group(s):`);
            dk.forEach(k => debugEntry('action', `    ${k} (${docs[k].length})`));
          }
        })
        .catch(e => debugEntry('error', e.message));
      break;
    }

    case 'read': {
      let addr, file;
      if (parts.length >= 3 && /^[012]{1,3}$/.test(parts[1])) {
        addr = parts[1]; file = parts.slice(2).join(' ');
      } else if (parts.length >= 2) {
        addr = currentAddr; file = parts.slice(1).join(' ');
      } else { debugEntry('error', 'usage: read [addr] <file>'); break; }
      fetch(`/read/${addr}/${encodeURIComponent(file)}`, { cache: 'no-store' })
        .then(r => r.json())
        .then(data => {
          if (data.error) { debugEntry('error', data.error); return; }
          const lines = (data.content || '').split('\n');
          const preview = lines.slice(0, 20);
          debugEntry('action', `${file} @ ${addr} (${lines.length} lines):`);
          preview.forEach(l => debugEntry('action', `  ${l}`));
          if (lines.length > 20) debugEntry('action', `  ... (${lines.length - 20} more)`);
        })
        .catch(e => debugEntry('error', e.message));
      break;
    }

    case 'move': {
      if (parts.length < 4) { debugEntry('error', 'usage: move <file> <from> <to>'); break; }
      const file = parts.slice(1, -2).join(' '), from = parts[parts.length - 2], to = parts[parts.length - 1];
      apiMove(file, from, to)
        .then(r => { if (!r.error) debugEntry('action', `moved ${file}: ${from} → ${to}`); })
        .catch(e => debugEntry('error', e.message));
      break;
    }

    case 'fold': {
      if (parts.length < 2) { debugEntry('error', 'usage: fold <file> [addr]'); break; }
      const addr = parts.length >= 3 ? parts[parts.length - 1] : currentAddr;
      const file = parts.length >= 3 ? parts.slice(1, -1).join(' ') : parts[1];
      apiFold(file, addr)
        .then(r => { if (!r.error) debugEntry('action', `folded → ${r.file}`); })
        .catch(e => debugEntry('error', e.message));
      break;
    }

    case 'create': {
      if (parts.length < 3) { debugEntry('error', 'usage: create <type> <scope> [addr]'); break; }
      const type = parts[1], scope = parts[2], addr = parts[3] || currentAddr;
      apiCreate(type, scope, addr)
        .then(r => { if (!r.error) debugEntry('action', `created ${r.file} at ${addr}`); })
        .catch(e => debugEntry('error', e.message));
      break;
    }

    case 'log': {
      if (parts.length < 3) { debugEntry('error', 'usage: log <C|O|D> <what>'); break; }
      const type = parts[1].toUpperCase(), what = parts.slice(2).join(' ');
      apiLog(type, what, currentAddr, '', '')
        .then(() => debugEntry('action', `logged ${type}: ${what}`))
        .catch(e => debugEntry('error', e.message));
      break;
    }

    case 'go': {
      if (parts.length < 2) { debugEntry('error', 'usage: go <addr>'); break; }
      const addr = parts[1];
      if (!/^[012]{1,3}$/.test(addr)) { debugEntry('error', `invalid address: ${addr}`); break; }
      currentAddr = addr;
      saveState(); render();
      debugEntry('action', `→ ${addr}`);
      break;
    }

    case 'clear':
      _debugLog.length = 0;
      renderDebugLog();
      break;

    case 'eval': {
      const expr = parts.slice(1).join(' ');
      debugEval(expr);
      break;
    }

    default:
      // try as eval fallback
      debugEval(raw);
  }
}

// catch errors
window.addEventListener('error', e => {
  debugEntry('error', `${e.message} @ ${e.filename}:${e.lineno}`);
});
window.addEventListener('unhandledrejection', e => {
  debugEntry('error', `promise: ${e.reason}`);
});

// patch render to count and update debug state
const _origRender = render;
render = function() {
  _renderCount++;
  _origRender();
  if (debugOpen) renderDebugState();
};

// ============================================================
// STICKY TRAY — 6 pin slots, ctrl+click to pin/unpin
// ============================================================

const TRAY_SIZE = 6;
let traySlots = new Array(TRAY_SIZE).fill(null); // {file, addr} or null

function trayPin(addr, file) {
  // check if already pinned
  for (let i = 0; i < TRAY_SIZE; i++) {
    if (traySlots[i] && traySlots[i].file === file && traySlots[i].addr === addr) {
      hudPulse('already pinned');
      return;
    }
  }
  // find first empty slot
  const idx = traySlots.indexOf(null);
  if (idx === -1) { hudPulse('tray full'); return; }
  traySlots[idx] = { file, addr };
  saveTray(); renderTray();
  hudPulse(`pinned → slot ${idx + 1}`);
}

function renderTray() {
  const el = document.getElementById('hud-tray');
  let h = '';
  let anyFilled = false;
  for (let i = 0; i < TRAY_SIZE; i++) {
    const s = traySlots[i];
    if (s) {
      anyFilled = true;
      const short = s.file.length > 12 ? s.file.slice(0, 11) + '\u2026' : s.file;
      h += `<div class="tray-slot filled" title="${s.file} @ ${s.addr} · ctrl+click unpin"`;
      h += ` onclick="if(event.ctrlKey){event.stopPropagation();trayClear(event,${i});return}trayOpen(${i})">`;
      h += `<span style="color:${bcolor(s.addr)}">${s.addr}</span>&nbsp;${short}</div>`;
    } else {
      h += `<div class="tray-slot"></div>`;
    }
  }
  if (anyFilled) h += `<button class="tray-clear" onclick="trayClearAll()" title="clear all">&times;</button>`;
  el.innerHTML = h;
}

function trayOpen(idx) {
  const s = traySlots[idx];
  if (!s) return;
  const ext = s.file.split('.').pop().toLowerCase();
  // html / images → new tab
  if (['html','htm','png','jpg','jpeg','gif','svg','webp'].includes(ext)) {
    const path = addrPath(s.addr) + '/' + s.file;
    window.open(path, '_blank');
    return;
  }
  // text/md → popup reader
  trayPopup(s.addr, s.file);
}

let _trayPopupAddr = null;
let _trayPopupFile = null;
let _trayPopupContent = null;
let _trayPopupEditing = false;

function trayPopup(addr, file) {
  _trayPopupAddr = addr;
  _trayPopupFile = file;
  _trayPopupContent = null;
  _trayPopupEditing = false;
  const el = document.getElementById('tray-popup');
  const canEdit = file.endsWith('.md') || file.endsWith('.txt');
  el.innerHTML = `<div class="tray-popup">
    <div class="tray-popup-bar">
      <span><span class="addr">${addr}</span> ${file}</span>
      ${canEdit ? '<span class="v0-reader-edit" id="tray-edit-btn" onclick="trayPopupEdit()">edit</span>' : ''}
      <span class="tray-popup-close" onclick="trayPopupClose()">&times;</span>
    </div>
    <div class="tray-popup-body">loading...</div>
  </div>`;
  fetch(`/read/${addr}/${encodeURIComponent(file)}`, { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      if (data.error) { el.querySelector('.tray-popup-body').textContent = data.error; return; }
      _trayPopupContent = data.content || '';
      trayPopupRender();
    })
    .catch(e => {
      const body = el.querySelector('.tray-popup-body');
      if (body) body.textContent = 'error: ' + e.message;
    });
}

function trayPopupRender() {
  const el = document.getElementById('tray-popup');
  if (!_trayPopupFile) return;
  const canEdit = _trayPopupFile.endsWith('.md') || _trayPopupFile.endsWith('.txt');
  const ext = _trayPopupFile.split('.').pop().toLowerCase();
  let barBtns = '';
  if (canEdit && _trayPopupEditing) {
    barBtns = '<span class="v0-reader-save" onclick="trayPopupSave()">save</span>'
            + '<span class="v0-reader-cancel" onclick="trayPopupCancelEdit()">cancel</span>';
  } else if (canEdit) {
    barBtns = '<span class="v0-reader-edit" onclick="trayPopupEdit()">edit</span>';
  }
  let bodyHtml;
  if (_trayPopupEditing) {
    const esc = (_trayPopupContent||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    bodyHtml = `<textarea class="tray-popup-editor" id="tray-editor">${esc}</textarea>`;
  } else if (['png','jpg','jpeg','gif','svg','webp'].includes(ext)) {
    bodyHtml = `<img class="tray-popup-img" src="${addrPath(_trayPopupAddr)}/${_trayPopupFile}">`;
  } else if (ext === 'md') {
    bodyHtml = renderMd(_trayPopupContent || '');
  } else {
    bodyHtml = `<pre style="margin:0">${(_trayPopupContent||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>`;
  }
  el.innerHTML = `<div class="tray-popup">
    <div class="tray-popup-bar">
      <span><span class="addr">${_trayPopupAddr}</span> ${_trayPopupFile}</span>
      ${barBtns}
      <span class="tray-popup-close" onclick="trayPopupClose()">&times;</span>
    </div>
    <div class="tray-popup-body">${bodyHtml}</div>
  </div>`;
  if (_trayPopupEditing) {
    const ta = document.getElementById('tray-editor');
    if (ta) { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }
  }
}

function trayPopupEdit() {
  _trayPopupEditing = true;
  trayPopupRender();
}

function trayPopupCancelEdit() {
  _trayPopupEditing = false;
  trayPopupRender();
}

function trayPopupSave() {
  const ta = document.getElementById('tray-editor');
  if (!ta) return;
  const content = ta.value;
  apiWrite(_trayPopupFile, _trayPopupAddr, content).then(r => {
    if (r.error) return;
    _trayPopupContent = content;
    _trayPopupEditing = false;
    trayPopupRender();
  });
}

function trayPopupClose() {
  document.getElementById('tray-popup').innerHTML = '';
}

function trayClear(e, idx) {
  e.preventDefault();
  traySlots[idx] = null;
  saveTray(); renderTray();
}

function trayClearAll() {
  traySlots = new Array(TRAY_SIZE).fill(null);
  saveTray(); renderTray();
  trayPopupClose();
}

function saveTray() {
  try { sessionStorage.setItem('lattice-tray', JSON.stringify(traySlots)); } catch (e) {}
}
function loadTray() {
  try {
    const s = sessionStorage.getItem('lattice-tray');
    if (s) traySlots = JSON.parse(s);
  } catch (e) {}
}

// ============================================================
// KEYBOARD — shared hotkey system
// ============================================================
// left alt + 0/1/2: set digit 0 (branch)
// space + 0/1/2: set digit 1 (leaf)
// right alt + 0/1/2: set digit 2 (cell)
// bare 0/1/2: set last digit
// backspace: shallow (remove last digit)
// V1 arrows: walking

// held-state tracking for left/right alt and space
let _heldAlt = null;   // 'left' | 'right' | null
let _spaceHeld = false;

document.addEventListener('keyup', e => {
  if (e.code === 'AltLeft' || e.code === 'AltRight') _heldAlt = null;
  if (e.code === 'Space') _spaceHeld = false;
});

function parseDigitKey(e) {
  // match top row and numpad digits, with or without modifiers
  const code = e.code;
  if (code.startsWith('Digit') && code.length === 6) return code[5];
  if (code.startsWith('Numpad') && code.length === 7) return code[6];
  // fallback: check e.key directly (numpad with numlock on)
  if (e.key === '0' || e.key === '1' || e.key === '2') return e.key;
  return null;
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  // track which alt key is held
  if (e.code === 'AltLeft') { _heldAlt = 'left'; e.preventDefault(); return; }
  if (e.code === 'AltRight') { _heldAlt = 'right'; e.preventDefault(); return; }

  // track space held (prevent scroll)
  if (e.code === 'Space' && !e.ctrlKey && !e.shiftKey && !e.altKey) {
    _spaceHeld = true;
    e.preventDefault(); return;
  }

  const key = e.key;
  const code = e.code;
  const depth = currentAddr.length;
  const mods = (e.ctrlKey?'C':'') + (e.shiftKey?'S':'') + (e.altKey?'A':'') + (_spaceHeld?'SP':'');
  const before = currentAddr;
  let action = null;

  // digit value keys
  const val = parseDigitKey(e);
  if (val !== null && (val === '0' || val === '1' || val === '2')) {
    if (_spaceHeld && !e.ctrlKey && !e.shiftKey) {
      // space + digit: set digit 1 (extend to depth 2 if needed)
      if (depth < 2) currentAddr = currentAddr[0] + val;
      else currentAddr = currentAddr[0] + val + currentAddr.slice(2);
      action = `space+${val} → set d1`;
    } else if (e.altKey && !e.ctrlKey && !e.shiftKey && _heldAlt === 'left') {
      // left alt + digit: set digit 0
      currentAddr = val + currentAddr.slice(1);
      action = `Lalt+${val} → set d0`;
    } else if (e.altKey && !e.ctrlKey && !e.shiftKey && _heldAlt === 'right') {
      // right alt + digit: set digit 2 (extend to depth 3 if needed)
      if (depth < 3) currentAddr = currentAddr.padEnd(2, '0').slice(0, 2) + val;
      else currentAddr = currentAddr.slice(0, 2) + val;
      action = `Ralt+${val} → set d2`;
    } else if (!e.ctrlKey && !e.shiftKey && !e.altKey && !_spaceHeld) {
      // bare digit: set last digit
      currentAddr = currentAddr.slice(0, -1) + val;
      action = `${val} → set last`;
    }
    if (action) {
      debugEntry('action', `${action} [${before}→${currentAddr}]`);
      e.preventDefault(); render(); saveState(); return;
    }
  }

  // backspace: shallow (remove last digit)
  if (key === 'Backspace' && !e.ctrlKey && !e.shiftKey && !e.altKey) {
    if (depth > 1) {
      currentAddr = currentAddr.slice(0, -1);
      debugEntry('action', `backspace → shallow [${before}→${currentAddr}]`);
      e.preventDefault(); render(); saveState(); return;
    }
    debugEntry('unhandled', `backspace at depth 1 — already shallowest`);
    e.preventDefault(); return;
  }

  // V0 + V1: arrows for walking
  if (activeView === 0 || activeView === 1) {
    if (key === 'ArrowUp')    { debugEntry('action', `↑ depth-`); navAddrDepth(-1); e.preventDefault(); return; }
    if (key === 'ArrowDown')  { debugEntry('action', `↓ depth+`); navAddrDepth(1);  e.preventDefault(); return; }
    if (key === 'ArrowRight') { debugEntry('action', `→ step+`);  navDigitStep(depth-1, 1); e.preventDefault(); return; }
    if (key === 'ArrowLeft')  { debugEntry('action', `← step-`);  navDigitStep(depth-1, -1); e.preventDefault(); return; }
  }

  // log unhandled keys (skip pure modifiers)
  if (!['Control','Shift','Alt','Meta'].includes(key)) {
    debugEntry('unhandled', `key=${key} code=${code} mods=${mods||'none'}`);
  }
});


// ============================================================
// VIEW 2: WAREHOUSE
// ============================================================

function renderV2() {
  renderV2Files();
  renderV2Dest();
  renderV2Intake();
  renderV2Trail();
  v2LoadScan();
  v2LoadHealth();
}

function v2LoadScan() {
  fetch('/scan', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      const prev = JSON.stringify(v2Scan);
      v2Scan = data.counts || {};
      if (JSON.stringify(v2Scan) !== prev) renderV2Dest();
    })
    .catch(() => {});
}

function v2SelectFile(file, addr) {
  if (v2Selected && v2Selected.file === file && v2Selected.addr === addr) {
    v2Selected = null;
  } else {
    v2Selected = { file, addr };
  }
  // persistent selection: sync to V0
  if (v2Selected) {
    const prefix = v2Selected.addr === currentAddr ? '' : v2Selected.addr + '/';
    v0LoadedFile = prefix + v2Selected.file;
    v0LoadedContent = null; // will load on switch to V0
  }
  renderV2Files();
  renderV2Dest();
}

function v2SetDest(digits) {
  v2Dest = v2Dest === digits ? null : digits;
  renderV2Dest();
}

function v2DoMove() {
  if (!v2Selected || !v2Dest) return;
  if (v2Selected.addr === v2Dest) return;
  apiMove(v2Selected.file, v2Selected.addr, v2Dest).then(r => {
    if (!r.error) {
      v2Selected = null;
      renderV2();  // includes v2LoadHealth()
    }
  });
}

function renderV2Files() {
  // V2 left column mirrors V0 sidebar — same file browser, V2 color accent
  const el = document.getElementById('v2-files');
  if (!currentAddr) { el.innerHTML = ''; return; }
  const d = currentAddr;

  loadFiles(d);
  const docs = docGroups(d);
  const entries = Object.entries(docs);
  const fc = fileCount(d);
  const docCount = entries.length;

  let h = `<div class="v0-sidebar-title">${d} &mdash; ${docCount} doc${docCount !== 1 ? 's' : ''}`;
  if (fc > docCount) h += ` <span style="color:var(--faint)">(${fc})</span>`;
  h += `</div>`;

  if (entries.length > 0) {
    h += `<ul class="v0-scope-filelist">`;
    for (const [base, versions] of entries) {
      const parsed = versions.map(v => {
        const m = v.match(/\.f(\d+)\./);
        return { file: v, fold: m ? parseInt(m[1]) : -1 };
      }).sort((a, b) => a.fold - b.fold);
      const latest = parsed[parsed.length - 1];
      const hasFolds = latest.fold >= 0;
      const expanded = hasFolds && versions.length > 1 && v0ExpandedDocs[base];

      const f = latest.file;
      const isLoadable = f.endsWith('.md') || f.endsWith('.txt');
      const isOpenable = f.endsWith('.html') || f.endsWith('.htm') || f.endsWith('.png') || f.endsWith('.jpg') || f.endsWith('.jpeg');
      const isSel = v2Selected && v2Selected.file === f && v2Selected.addr === d;
      const cls = isSel ? 'loaded' : (isLoadable || isOpenable) ? 'loadable' : '';
      const fe = f.replace(/'/g, "\\'");
      const pin = `if(event.ctrlKey){event.stopPropagation();trayPin('${d}','${fe}');return}`;
      const action = ` onclick="${pin}v2SelectFile('${fe}','${d}')"`;
      const displayName = hasFolds ? base : f;

      let badges = '';
      if (hasFolds) {
        const arrow = versions.length > 1 ? (expanded ? '\u25BE' : '\u25B8') : '';
        const clickExpand = versions.length > 1 ? ` onclick="event.stopPropagation();v0ToggleFolds('${base.replace(/'/g, "\\'")}')"` : '';
        badges += `<span class="v0-fold-badge"${clickExpand}>${arrow}f${latest.fold}</span>`;
      }

      h += `<li class="${cls}"${action} title="${f} · ctrl+click pin">${displayName}${badges}</li>`;

      if (expanded) {
        h += `<ul class="v0-fold-history">`;
        for (const p of parsed) {
          const isCur = p.file === latest.file;
          const isOldSel = v2Selected && v2Selected.file === p.file && v2Selected.addr === d;
          const oldCls = isOldSel ? 'loaded' : isCur ? 'current' : '';
          const oldAction = ` onclick="v2SelectFile('${p.file.replace(/'/g, "\\'")}','${d}')"`;
          const ts = p.file.match(/(\d{6,8}-\d{6})/);
          const label = p.fold >= 0 ? `f${p.fold}` : p.file;
          const timeHint = ts ? ` <span style="color:var(--faint)">${ts[1]}</span>` : '';
          h += `<li class="${oldCls}"${oldAction} title="${p.file}">${label}${timeHint}${isCur ? ' \u2190' : ''}</li>`;
        }
        h += `</ul>`;
      }
    }
    h += `</ul>`;
  } else {
    h += `<div style="padding:12px 14px;color:var(--faint);font-size:10px;font-style:italic">empty</div>`;
  }
  el.innerHTML = h;
}

function renderV2Intake() {
  // intake section + drop zone — renders in right column above manifest
  const el = document.getElementById('v2-intake');
  if (!el) return;
  let h = '';

  // drop zone
  h += '<div class="v2-dropzone" id="v2-dropzone">drop files here \u2192 200</div>';

  // intake files at 200
  loadFiles('200');
  const intakeFiles = fileList('200');
  if (intakeFiles.length > 0) {
    h += '<div class="v2-section">';
    h += '<div class="v2-section-title" style="color:var(--b2)">intake \u00b7 200</div>';
    for (const f of intakeFiles) {
      const sel = v2Selected && v2Selected.file === f && v2Selected.addr === '200';
      h += `<div class="v2-file-item${sel ? ' selected' : ''}" onclick="if(event.ctrlKey){event.stopPropagation();trayPin('200','${f.replace(/'/g,"\\'")}');return}v2SelectFile('${f.replace(/'/g,"\\'")}','200')" title="${f} · ctrl+click pin">${f}</div>`;
    }
    h += '</div>';
  }

  el.innerHTML = h;
}

function renderV2Dest() {
  const el = document.getElementById('v2-dest');
  let h = '';

  // compact top bar: selected file
  h += '<div class="v2-sel-display">';
  if (v2Selected) {
    h += `<span class="v2-sel-file">${v2Selected.file}</span>`;
    h += `<span class="v2-sel-arrow">\u2192</span>`;
    h += `<span class="v2-sel-from">from ${v2Selected.addr.split('').map(c => colorSpan(c,c)).join('')}</span>`;
  } else {
    h += '<span class="v2-sel-hint">select a file to move</span>';
  }
  h += '</div>';

  // 27-cell destination grid — fills the panel
  h += '<div class="v2-dest-grid-wrap">';
  for (let b = 0; b < 3; b++) {
    h += '<div class="v2-dest-branch">';
    h += `<div class="v2-dest-blabel" style="color:${BCOLORS[b]}">${BRANCHES[b].name}</div>`;
    h += '<div class="v2-dest-cells">';
    for (let l = 0; l < 3; l++) {
      for (let c = 0; c < 3; c++) {
        const cd = `${b}${l}${c}`;
        const t = tri(cd);
        const isSrc = v2Selected && v2Selected.addr === cd;
        const isDest = v2Dest === cd;
        const isCurrent = currentAddr === cd;
        const count = v2Scan[cd] || 0;
        const cls = isDest ? ' dest-sel' : isSrc ? ' dest-src' : isCurrent ? ' dest-cur' : '';
        h += `<div class="v2-dest-cell${cls}" onclick="v2SetDest('${cd}')" title="${cd}: ${t.n} \u00b7 ${t.v} \u00b7 ${t.m}${count ? ' ('+count+' files)' : ''}">`;
        h += `<span class="v2-dc-digits">${cd.split('').map(x => colorSpan(x,x)).join('')}</span>`;
        h += `<span class="v2-dc-verb" style="color:${lastcolor(cd)}">${t.v}</span>`;
        if (count > 0) h += `<span class="v2-dc-count">${count}</span>`;
        h += '</div>';
      }
    }
    h += '</div></div>';
  }
  h += '</div>';

  // footer: dest info + move button
  h += '<div class="v2-dest-footer">';
  if (v2Dest) {
    const dt = tri(v2Dest);
    h += `<span class="v2-dest-info">\u2192 ${v2Dest.split('').map(x => colorSpan(x,x)).join('')} <span style="color:${lastcolor(v2Dest)};font-weight:700">${dt.v}</span></span>`;
  }
  if (v2Selected && v2Dest && v2Selected.addr !== v2Dest) {
    h += `<button class="v2-move-btn" onclick="v2DoMove()">move \u2192 ${v2Dest}</button>`;
  } else if (v2Selected && v2Dest && v2Selected.addr === v2Dest) {
    h += '<span class="v2-move-hint">already there</span>';
  }
  h += '</div>';

  el.innerHTML = h;
}

function renderV2Trail() {
  const el = document.getElementById('v2-manifest');
  fetch('/manifest', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      v2Manifest = data.entries || [];
      let h = '<div class="v2-section-title">manifest</div>';
      if (v2Manifest.length === 0) {
        h += '<div class="v2-empty">no entries</div>';
      } else {
        h += '<div class="v2-manifest-list">';
        for (const e of v2Manifest.slice(0, 40)) {
          const opColor = e.op === 'move' ? 'var(--b2)' :
                          e.op === 'create' ? 'var(--b1)' :
                          e.op === 'fold' ? 'var(--b2)' :
                          e.op === 'delete' ? '#cc4444' : 'var(--dim)';
          h += '<div class="v2-manifest-entry">';
          h += `<span class="v2-me-op" style="color:${opColor}">${e.op}</span>`;
          h += `<span class="v2-me-file" title="${e.file}">${e.file}</span>`;
          if (e.from !== '-' || e.to !== '-') {
            h += `<span class="v2-me-route">${e.from}\u2192${e.to}</span>`;
          }
          h += `<span class="v2-me-ts">${e.ts.slice(-6)}</span>`;
          h += '</div>';
        }
        h += '</div>';
      }
      el.innerHTML = h;
    })
    .catch(() => {});
}

function v2LoadHealth() {
  fetch('/reconcile', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => { v2Health = data; renderV2Health(); })
    .catch(() => {});
}

function renderV2Health() {
  let el = document.getElementById('v2-health');
  if (!el) {
    // insert before manifest in the trail column
    const trail = document.querySelector('.v2-trail-col');
    if (!trail) return;
    el = document.createElement('div');
    el.id = 'v2-health';
    trail.insertBefore(el, trail.firstChild);
  }
  if (!v2Health) { el.innerHTML = ''; return; }
  const clean = v2Health.clean;
  const cls = clean ? 'clean' : 'drift';
  const expanded = v2HealthOpen ? ' expanded' : '';
  let h = `<div class="v2-health ${cls}${expanded}" onclick="v2HealthOpen=!v2HealthOpen;renderV2Health()">`;
  if (clean) {
    h += `<span class="v2-health-summary">\u2713 clean</span>`;
    h += `<span style="margin-left:8px;font-size:9px;color:var(--faint)">${v2Health.counts.scanned} files</span>`;
  } else {
    const parts = [];
    if (v2Health.counts.unregistered > 0) parts.push(v2Health.counts.unregistered + ' unregistered');
    if (v2Health.counts.missing > 0) parts.push(v2Health.counts.missing + ' missing');
    h += `<span class="v2-health-summary">\u26A0 ${parts.join(' \u00b7 ')}</span>`;
    h += `<span style="margin-left:8px;font-size:9px;color:var(--faint)">${v2Health.counts.scanned} scanned</span>`;
  }
  h += '<div class="v2-health-details">';
  if (v2Health.unregistered && v2Health.unregistered.length > 0) {
    for (const u of v2Health.unregistered.slice(0, 30)) {
      h += `<div class="v2-health-item"><span class="hi-type">unreg</span>${u.addr}/${u.file}</div>`;
    }
    if (v2Health.unregistered.length > 30) h += `<div class="v2-health-item" style="color:var(--faint)">...${v2Health.unregistered.length - 30} more</div>`;
  }
  if (v2Health.missing && v2Health.missing.length > 0) {
    for (const m of v2Health.missing) {
      h += `<div class="v2-health-item"><span class="hi-type">miss</span>${m.addr}/${m.file} (${m.op})</div>`;
    }
  }
  h += '</div></div>';
  el.innerHTML = h;
}

// drop zone — drag files onto View 2 intake area for receiving at 200
function v2InitDropZone() {
  const el = document.getElementById('v2-intake');
  if (!el) return;
  el.addEventListener('dragover', e => {
    e.preventDefault();
    const dz = document.getElementById('v2-dropzone');
    if (dz) dz.classList.add('dragover');
  });
  el.addEventListener('dragleave', e => {
    const dz = document.getElementById('v2-dropzone');
    if (dz && !el.contains(e.relatedTarget)) dz.classList.remove('dragover');
  });
  el.addEventListener('drop', e => {
    e.preventDefault();
    const dz = document.getElementById('v2-dropzone');
    if (dz) dz.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (!files || files.length === 0) return;
    let received = 0;
    for (const file of files) {
      if (!file.name.match(/\.(md|txt|html|css|js|json|py)$/i)) {
        logMsg(`skipped ${file.name} (text files only)`, 'fold');
        continue;
      }
      const reader = new FileReader();
      reader.onload = () => {
        apiReceive(file.name, reader.result, '200').then(r => {
          if (!r.error) {
            received++;
            logMsg(`received ${file.name} \u2192 200`, 'action');
            refreshFiles('200');
            renderV2Intake();
            v2LoadHealth();
          }
        });
      };
      reader.readAsText(file);
    }
  });
}


// ============================================================
// LOG
// ============================================================

function logMsg(msg, type) {
  const el = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = `log-entry ${type||''}`;
  const now = new Date();
  entry.textContent = `[${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}] ${msg}`;
  el.insertBefore(entry, el.firstChild);
  if (el.children.length > 80) el.removeChild(el.lastChild);
}


// ============================================================
// STATE PERSISTENCE
// ============================================================

function saveState() {
  try {
    sessionStorage.setItem('lattice', JSON.stringify({
      activeView, currentAddr, v0Open, v0Collapsed, v0Label,
      v0LoadedFile, v0ExpandedDocs, v2Selected
    }));
  } catch(e) {}
}

function restoreState() {
  try {
    const s = JSON.parse(sessionStorage.getItem('lattice'));
    if (!s) return;
    if (s.currentAddr) currentAddr = s.currentAddr;
    if (s.v0Label) v0Label = s.v0Label;
    if (typeof s.v0Collapsed === 'boolean') v0Collapsed = s.v0Collapsed;
    if (s.v0Open) Object.assign(v0Open, s.v0Open);
    if (s.v0LoadedFile) v0LoadedFile = s.v0LoadedFile;
    if (s.v0ExpandedDocs) Object.assign(v0ExpandedDocs, s.v0ExpandedDocs);
    if (s.v2Selected) v2Selected = s.v2Selected;
    if (typeof s.activeView === 'number') {
      activeView = s.activeView;
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + activeView).classList.add('active');
      document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.v === String(activeView)));
    }
  } catch(e) {}
}

// ============================================================
// INIT
// ============================================================

restoreState();
loadTray();
render();
// init drop zone after first render creates the DOM
setTimeout(() => v2InitDropZone(), 100);

// hot reload — poll for file changes
(function() {
  let lastMod = null;
  setInterval(() => {
    fetch(location.href, { method: 'HEAD', cache: 'no-store' })
      .then(r => {
        const mod = r.headers.get('Last-Modified');
        if (lastMod && mod !== lastMod) location.reload();
        lastMod = mod;
      })
      .catch(() => {});
  }, 1500);
})();

// data freshness — poll the floor, refresh cells whose held list differs from disk.
// _fileCache otherwise lives for the tab's lifetime; this keeps client matching server.
(function() {
  const SWEEP_MS = 2500;
  function sameList(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  function sorted(arr) { return (arr || []).slice().sort(); }
  function syncShort(d) {
    // 1/2-digit views aren't in /scan/files (cells only) — compare via their own /list
    fetch(`/list/${d}`, { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        if (!sameList(sorted(data.files), sorted(_fileCache[d]))) {
          _fileCache[d] = data.files || [];
          _docCache[d] = data.documents || {};
          render();
        }
      })
      .catch(() => {});
  }
  setInterval(() => {
    const el = document.activeElement;
    if (el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT')) return; // never disturb editing
    fetch('/scan/files', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        const onDisk = data.files || {};
        let changed = false;
        Object.keys(_fileCache).forEach(d => {
          if (d.length === 3) {
            // /scan/files lists cells recursively (subfolder freight as subpath/name);
            // /list (the cache source) is direct-only. Compare like-for-like, else the
            // mismatch fires render() every sweep and yanks the open reader to the top.
            const direct = (onDisk[d] || []).filter(n => !n.includes('/'));
            if (!sameList(sorted(direct), sorted(_fileCache[d]))) {
              refreshFiles(d);
              changed = true;
            }
          } else {
            syncShort(d);
          }
        });
        if (changed) v2LoadScan();
      })
      .catch(() => {});
  }, SWEEP_MS);
})();
