<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tsnew — trace</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0E12;color:#d0d4dc;font:13px/1.4 'Consolas','Monaco',monospace;overflow:hidden}
#wrap{display:flex;flex-direction:column;height:100vh}
canvas{flex:1;display:block;cursor:grab;min-height:200px}
canvas:active{cursor:grabbing}
#controls{
  display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 12px;
  background:#12171d;border-top:1px solid #1e2530;align-items:center;
}
#controls label{display:flex;align-items:center;gap:4px;font-size:11px;color:#8a93a3;white-space:nowrap}
#controls .val{color:#62f0c0;min-width:2.5em;text-align:right;font-size:11px}
#controls select{background:#1a2030;color:#d0d4dc;border:1px solid #2a3040;border-radius:3px;padding:1px 4px;font:11px monospace}
#controls input[type="range"]{width:72px;height:14px;accent-color:#62f0c0}
#controls input[type="checkbox"]{accent-color:#62f0c0}
#controls .sep{width:1px;height:18px;background:#2a3040;flex-shrink:0}
#controls button{background:#1a2030;color:#8a93a3;border:1px solid #2a3040;border-radius:3px;padding:2px 8px;font:11px monospace;cursor:pointer}
#controls button:hover{background:#2a3040;color:#d0d4dc}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="controls">
  <label>depth <input type="range" id="depthR" min="1" max="19" value="6" step="1"><span class="val" id="depthV">6</span></label>
  <div class="sep"></div>
  <label>k <input type="range" id="kR" min="0.5" max="10" value="2" step="0.05"><span class="val" id="kV">2.00</span></label>
  <div class="sep"></div>
  <label>ratio <select id="ratioS">
    <optgroup label="irrational">
      <option value="1.6180339887498949">&#966;</option>
      <option value="2.6180339887498949">&#966;&#178;</option>
      <option value="1.4142135623730951">&#8730;2</option>
      <option value="1.7320508075688772">&#8730;3</option>
      <option value="3.141592653589793" selected>&#960;</option>
      <option value="2.718281828459045">e</option>
    </optgroup>
    <optgroup label="just">
      <option value="1.5">2:3</option>
      <option value="1.3333333333333333">3:4</option>
      <option value="1.6666666666666667">3:5</option>
      <option value="1.25">4:5</option>
      <option value="1.6">5:8</option>
      <option value="2">1:2</option>
    </optgroup>
  </select></label>
  <div class="sep"></div>
  <label>schedule <select id="schedS">
    <option value="4d">4D</option>
    <option value="3d">3D</option>
  </select></label>
  <div class="sep"></div>
  <label>speed <input type="range" id="speedR" min="0.1" max="5" value="1" step="0.1"><span class="val" id="speedV">1.0</span></label>
  <div class="sep"></div>
  <label>trail <select id="trailS">
    <option value="off" selected>off</option>
    <option value="short">short</option>
    <option value="long">long</option>
  </select></label>
  <div class="sep"></div>
  <label><input type="checkbox" id="oscChk"> osc</label>
  <label>blend <input type="range" id="oscBlendR" min="0" max="1" value="1" step="0.05"><span class="val" id="oscBlendV">1.00</span></label>
  <label>amp <input type="range" id="oscAmpR" min="0" max="6.28" value="3.14" step="0.1"><span class="val" id="oscAmpV">3.14</span></label>
  <div class="sep"></div>
  <label><input type="checkbox" id="legacyChk"> legacy</label>
  <div class="sep"></div>
  <button id="clearBtn">clear</button>
</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// tsnew-trace — composition + cascade + proportion
// the root toy. one dot, one canvas, one engine.
// ═══════════════════════════════════════════════════════════════════════

const TAU = Math.PI * 2;

// ─── schedules ─────────────────────────────────────────────────────────
// 4D: all 6 rotation planes of 4-space (XY YZ ZW XW XZ YW)
// 3D: the 3 rotation planes confined to xyz (XY YZ XZ)
const SCHED_4D = [[0,1],[1,2],[2,3],[0,3],[0,2],[1,3]];
const SCHED_3D = [[0,1],[1,2],[0,2]];

// ─── state ─────────────────────────────────────────────────────────────
const MAXDEPTH = 40;
const ph = new Float64Array(MAXDEPTH);   // phase per depth level
let depth    = 6;
let k        = 2.0;           // proportion parameter
let ratio    = Math.PI;       // cascade ratio (rate decay base)
let speed    = 1.0;
const D      = 80;            // base radius (seed distance from origin)
let sched    = SCHED_4D;
let selfScale = true;         // proportional (true) or legacy (false) displacement
let oscOn    = false;
let oscBlend = 1.0;
let oscAmp   = Math.PI;
let trailMode = 'off';        // 'off' | 'short' | 'long'

// ─── camera ────────────────────────────────────────────────────────────
let yaw = 0.5, pitch = 0.4;
let zoom = 1.0;
const FOCAL = 480;

// ─── auto-fit ──────────────────────────────────────────────────────────
let rmax = D;
let fitScale = 1.0;
let com = [0, 0, 0];  // running center of mass for display centering

// ─── canvas ────────────────────────────────────────────────────────────
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 800, H = 500, dpr = 1;

function resize() {
  W = cv.clientWidth  || 800;
  H = cv.clientHeight || 500;
  dpr = Math.min(devicePixelRatio || 1,
                 Math.min(4096 / Math.max(1, W), 4096 / Math.max(1, H)));
  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hardClear();
}

// Initial radius estimate (form extent from COM, not from origin).
// Actual tracking in the frame loop refines this within a few frames.
function estimateRmax() {
  return D * 2;
}

function hardClear() {
  ctx.fillStyle = '#0A0E12';
  ctx.fillRect(0, 0, W + 2, H + 2);
  rmax = estimateRmax();
  fitScale = Math.min(H, W) * 0.35 / Math.max(0.1, rmax);
  com = [0, 0, 0];
}

addEventListener('resize', resize);

// ─── rate cascade ──────────────────────────────────────────────────────
// Rate at depth level L = (1/ratio)^L
// Deeper levels rotate slower, producing finer nested structure.
function rateFor(level) {
  return Math.pow(1 / ratio, level);
}

// ─── core engine: 5×5 SE(4) matrix composition ────────────────────────
// One 5×5 homogeneous matrix carries both rotation (upper-left 4×4) and
// translation (5th column). Left-multiplication: each rotation lifts the
// accumulated figure. Translation at cycle boundaries opens the form.
function buildRaw() {
  // M = identity 5×5 row-major
  const M = new Float64Array(25);
  M[0] = 1; M[6] = 1; M[12] = 1; M[18] = 1; M[24] = 1;

  for (let r = 0; r < depth; r++) {
    const cyc = (r >> 1);         // Math.floor(r / 2)
    const idx = r & 1;            // r % 2

    // Translation at cycle boundary (every 2 rotations, starting cycle 1)
    if (idx === 0 && cyc >= 1) {
      let d;
      if (selfScale) {
        // Proportional: d = k × (k+1)^(C-1) × D
        // Holds the hole a constant fraction (k-1)/(k+1) at every cycle.
        d = k * Math.pow(k + 1, cyc - 1) * D;
      } else {
        // Legacy: fixed-ratio decay (d shrinks each cycle)
        d = 1.5 * D * Math.pow(0.5, cyc - 1);
      }
      M[4] += d;  // translate along axis 0 (X)
    }

    // Rotation in the scheduled plane
    const plane = sched[r % sched.length];
    let theta = ph[r];
    if (oscOn && oscBlend > 0) {
      // Blend orbit with pendulum: 0=pure orbit, 1=pure pendulum
      theta = (1 - oscBlend) * ph[r] + oscBlend * oscAmp * Math.sin(ph[r]);
    }

    const i = plane[0], j = plane[1];
    const c = Math.cos(theta), s = Math.sin(theta);

    // Left-multiply: mix rows i and j of M
    for (let col = 0; col < 5; col++) {
      const ri = M[i * 5 + col], rj = M[j * 5 + col];
      M[i * 5 + col] = c * ri - s * rj;
      M[j * 5 + col] = s * ri + c * rj;
    }
  }

  // Point = M × seed, seed = [D, 0, 0, 0, 1]
  // Only columns 0 and 4 contribute (seed y=z=w=0)
  return [
    M[0]  * D + M[4],     // x
    M[5]  * D + M[9],     // y
    M[10] * D + M[14]     // z  (w dropped — orthographic 4D→3D)
  ];
}

// ─── camera ────────────────────────────────────────────────────────────
// Yaw (Y-axis) then pitch (X-axis) rotation for orbit camera
function rot(a, b, c) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x1 = a * cy - c * sy,  z1 = a * sy + c * cy;
  const y1 = b * cp - z1 * sp, z2 = b * sp + z1 * cp;
  return [x1, y1, z2];
}

// Project 3D → 2D with auto-fit scaling, COM centering, and perspective
function proj(px, py, pz) {
  const s = fitScale;
  const [a, b, c] = rot((px - com[0]) * s, (py - com[1]) * s, (pz - com[2]) * s);
  const f = FOCAL / (FOCAL + c) * zoom;
  return [W / 2 + a * f, H / 2 + b * f];
}

// ─── draw faint axes ───────────────────────────────────────────────────
function drawAxes() {
  const len = rmax * 0.15;
  ctx.lineWidth = 0.5;
  ctx.globalAlpha = 0.4;
  const ox = proj(0, 0, 0);
  const cols = ['#445', '#454', '#449'];
  const tips = [[len,0,0],[0,len,0],[0,0,len]];
  for (let i = 0; i < 3; i++) {
    const e = proj(tips[i][0], tips[i][1], tips[i][2]);
    ctx.strokeStyle = cols[i];
    ctx.beginPath();
    ctx.moveTo(ox[0], ox[1]);
    ctx.lineTo(e[0], e[1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ─── animation loop ────────────────────────────────────────────────────
function frame() {
  // Sampling rate: many points per frame to fill the curve
  const spd   = 140 * speed;
  const steps = Math.min(2000, Math.max(20, Math.round(20 + spd * 6)));
  const dt    = 0.0006 * spd;

  // Clear / fade
  if (trailMode === 'off') {
    ctx.fillStyle = '#0A0E12';
    ctx.fillRect(0, 0, W + 2, H + 2);
  } else if (trailMode === 'short') {
    ctx.fillStyle = 'rgba(10,14,18,0.45)';
    ctx.fillRect(0, 0, W + 2, H + 2);
  } else {
    ctx.fillStyle = 'rgba(10,14,18,0.015)';
    ctx.fillRect(0, 0, W + 2, H + 2);
  }

  drawAxes();

  // Track extent from COM and update COM for auto-fit + centering
  let batchMaxFromCom = 0;
  let batchCom = [0, 0, 0];

  // Advance phases and plot points
  ctx.fillStyle = 'rgba(98,240,192,0.55)';
  for (let s = 0; s < steps; s++) {
    for (let r = 0; r < depth; r++) {
      ph[r] = (ph[r] + dt * rateFor(r)) % TAU;
    }

    const p = buildRaw();
    batchCom[0] += p[0]; batchCom[1] += p[1]; batchCom[2] += p[2];

    // Distance from current COM estimate (not from origin)
    const dx = p[0] - com[0], dy = p[1] - com[1], dz = p[2] - com[2];
    const distFromCom = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (distFromCom > batchMaxFromCom) batchMaxFromCom = distFromCom;

    const sc = proj(p[0], p[1], p[2]);
    ctx.fillRect(sc[0] - 1, sc[1] - 1, 2, 2);
  }

  // Update center of mass (fast convergence)
  batchCom[0] /= steps; batchCom[1] /= steps; batchCom[2] /= steps;
  com[0] += (batchCom[0] - com[0]) * 0.12;
  com[1] += (batchCom[1] - com[1]) * 0.12;
  com[2] += (batchCom[2] - com[2]) * 0.12;

  // Auto-fit: track form radius from COM
  if (batchMaxFromCom > rmax) rmax = batchMaxFromCom;
  else rmax += (batchMaxFromCom - rmax) * 0.008;
  const target = Math.min(H, W) * 0.35 / Math.max(0.1, rmax);
  fitScale += (target - fitScale) * 0.05;

  requestAnimationFrame(frame);
}

// ─── mouse: orbit camera ──────────────────────────────────────────────
let dragging = false, lastMX = 0, lastMY = 0;

cv.addEventListener('mousedown', e => {
  dragging = true; lastMX = e.clientX; lastMY = e.clientY;
});
addEventListener('mousemove', e => {
  if (!dragging) return;
  yaw   += (e.clientX - lastMX) * 0.005;
  pitch += (e.clientY - lastMY) * 0.005;
  lastMX = e.clientX; lastMY = e.clientY;
});
addEventListener('mouseup', () => { dragging = false; });

cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.05, Math.min(50, zoom * Math.exp(-e.deltaY * 0.002)));
}, { passive: false });

// ─── touch: orbit + pinch zoom ────────────────────────────────────────
const _ptrs = new Map();
let _pinchD = 0;

cv.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches)
    _ptrs.set(t.identifier, { x: t.clientX, y: t.clientY });
  if (_ptrs.size === 2) {
    const p = [..._ptrs.values()];
    _pinchD = Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y);
  }
}, { passive: false });

cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if (_ptrs.size === 1) {
    const t = e.changedTouches[0], prev = _ptrs.get(t.identifier);
    if (prev) {
      yaw   += (t.clientX - prev.x) * 0.005;
      pitch += (t.clientY - prev.y) * 0.005;
    }
    _ptrs.set(t.identifier, { x: t.clientX, y: t.clientY });
  } else if (_ptrs.size === 2) {
    for (const t of e.changedTouches)
      _ptrs.set(t.identifier, { x: t.clientX, y: t.clientY });
    const p = [..._ptrs.values()];
    const d = Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y);
    if (_pinchD > 0 && d > 0)
      zoom = Math.max(0.05, Math.min(50, zoom * (d / _pinchD)));
    _pinchD = d;
  }
}, { passive: false });

cv.addEventListener('touchend', e => {
  for (const t of e.changedTouches) _ptrs.delete(t.identifier);
  _pinchD = 0;
});

// ─── control wiring ────────────────────────────────────────────────────
function bind(id, fn) { document.getElementById(id).addEventListener('input', fn); }

bind('depthR', e => {
  depth = +e.target.value;
  document.getElementById('depthV').textContent = depth;
  hardClear();
});
bind('kR', e => {
  k = +e.target.value;
  document.getElementById('kV').textContent = k.toFixed(2);
  hardClear();
});
bind('ratioS', e => {
  ratio = +e.target.value;
  hardClear();
});
bind('schedS', e => {
  sched = e.target.value === '3d' ? SCHED_3D : SCHED_4D;
  hardClear();
});
bind('speedR', e => {
  speed = +e.target.value;
  document.getElementById('speedV').textContent = speed.toFixed(1);
});
bind('trailS', e => { trailMode = e.target.value; });
bind('oscChk', e => { oscOn = e.target.checked; });
bind('oscBlendR', e => {
  oscBlend = +e.target.value;
  document.getElementById('oscBlendV').textContent = oscBlend.toFixed(2);
});
bind('oscAmpR', e => {
  oscAmp = +e.target.value;
  document.getElementById('oscAmpV').textContent = oscAmp.toFixed(2);
});
bind('legacyChk', e => {
  selfScale = !e.target.checked;
  hardClear();
});

document.getElementById('clearBtn').addEventListener('click', hardClear);

// ─── init ──────────────────────────────────────────────────────────────
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
