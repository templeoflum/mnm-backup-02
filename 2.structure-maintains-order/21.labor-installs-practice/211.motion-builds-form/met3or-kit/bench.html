<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MET∃OR · workbench</title>
<!-- The consolidated met3or workbench (operator 153842: fold it all into one).
     Faithful raster render (from the phosphor study) + controls built on the
     reusable UI KIT atoms (../kit/src) instead of hand-rolled - stops reinventing
     the kit (operator 153138). FOUNDATION step: render + kit-atom panel proven.
     Still to fold in: reticule/axes/grid, the theta grammar-weave, wavelength
     bins, presets, a 7-seg readout. -->
<style>
  :root{ --font-mono:"SF Mono",ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080c;color:#9fc4dc;font:13px/1.4 var(--font-mono);overflow:hidden}
  #app{height:100%;display:flex;min-height:0}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;padding:22px;min-width:0}
  canvas{width:min(96%,760px);display:block;border-radius:14px;background:#05080c;box-shadow:0 0 60px rgba(0,0,0,.6)}
  #panel{width:320px;flex:none;background:#080c12;border-left:1px solid #16202c;overflow-y:auto;padding:12px 12px 40px;display:flex;flex-direction:column;gap:10px}
  #panel h1{font-size:12px;letter-spacing:.14em;color:#cfe6f5;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid #16202c}
  .grp-body{display:flex;flex-direction:column;gap:8px;padding:6px 2px 2px}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="panel"><h1>met3or · workbench</h1></div>
</div>
<script type="module">
import { createScrub } from '../kit/src/scrub.js';
import { createToggle } from '../kit/src/toggle.js';
import { createSelector } from '../kit/src/selector.js';
import { createDisclosure } from '../kit/src/disclosure.js';

// ============================================================
// the faithful render (raster CRT / vector oscilloscope), from the phosphor study
// ============================================================
const CW=760,CH=528,S=2.0,SEAM=280;
const cv=document.getElementById('c');cv.width=CW;cv.height=CH;
const ctx=cv.getContext('2d');
const img=ctx.createImageData(CW,CH),data=img.data;
const acc=new Float32Array(CW*CH*3);       // top phosphor charge (per-channel, linear)
const refl=new Float32Array(CW*CH*3);      // the reflection's own phosphor

const AM=[240,169,74],BL=[90,167,232],GR=[74,222,128];
function circle(cx,cy,r,n){const q=[];for(let i=0;i<=n;i++){const a=-Math.PI/2+i/n*2*Math.PI;q.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return q;}
const LET=[
{col:AM,segs:[[[52,136],[52,80],[70,112],[88,80],[88,136]]]},
{col:BL,segs:[[[134,80],[100,80],[100,136],[134,136]],[[100,108],[126,108]]]},
{col:GR,segs:[[[148,80],[184,80]],[[166,80],[166,136]]]},
{col:GR,segs:[[[198,80],[232,80],[232,136],[198,136]],[[232,108],[206,108]]]},
{col:BL,segs:[circle(262,108,24,44)]},
{col:AM,segs:[[[296,136],[296,80],[318,80],[328.5,83.5],[332,94],[328.5,104.5],[318,108],[296,108]],[[310,108],[332,136]]]}
];
const PATH=[];
LET.forEach(L=>L.segs.forEach(seg=>{for(let i=0;i<seg.length-1;i++){const a=seg[i],b=seg[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(d*S/1.2));for(let k=0;k<n;k++){const t=k/n;PATH.push({x:(a[0]+(b[0]-a[0])*t)*S,y:(a[1]+(b[1]-a[1])*t)*S,col:L.col});}}}));
const NP=PATH.length;
function depositTo(buf,cx,cy,col,amp,rad){
  const x0=Math.max(0,cx-rad|0),x1=Math.min(CW-1,cx+rad|0),y0=Math.max(0,cy-rad|0),y1=Math.min(CH-1,cy+rad|0),s2=2*(rad*0.5)*(rad*0.5);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dx=x-cx,dy=y-cy,w=Math.exp(-(dx*dx+dy*dy)/s2)*amp;if(w<0.002)continue;const i=(y*CW+x)*3;buf[i]+=col[0]/255*w;buf[i+1]+=col[1]/255*w;buf[i+2]+=col[2]/255*w;}
}
const signal=new Float32Array(CW*CH*3);
for(let pi=0;pi<NP;pi++){const q=PATH[pi];depositTo(signal,q.x,q.y,q.col,0.9,1.6);}

// ============================================================
// CFG — the parameter map (kit controls write here, the render reads here)
// ============================================================
const CFG={mode:'raster',interlace:true,scanDir:'h',beam:2.2,raster:4.0,tauR:0.14,tauG:0.06,tauB:0.028,
           bloom:1.0,lines:262,exposure:1.5,reflect:0.85,reflPersist:0.05};

// ============================================================
// the control panel — built on the KIT atoms (no hand-rolled controls)
// ============================================================
const panel=document.getElementById('panel');
function group(title,open,build){const d=createDisclosure({title,open});d.body.classList.add('grp-body');build(d.body);panel.appendChild(d.el);}
function scrub(parent,label,k,min,max,step){const s=createScrub({label,min,max,step,value:CFG[k],onInput:v=>{CFG[k]=v;}});parent.appendChild(s.el);}
function toggle(parent,label,k,truthy,falsy){const t=createToggle({label,value:CFG[k]===(truthy??true),onChange:v=>{CFG[k]=v?(truthy??true):(falsy??false);}});parent.appendChild(t.el);}
function selector(parent,options,k,map){const s=createSelector({options,value:map?map.inv(CFG[k]):CFG[k],onChange:v=>{CFG[k]=map?map.fwd(v):v;}});parent.appendChild(s.el);}

group('beam',true,b=>{
  selector(b,['raster','vector'],'mode');
  toggle(b,'interlace',CFG.interlace?'interlace on':'interlace',true,false);
  selector(b,['horizontal','vertical'],'scanDir',{fwd:v=>v==='horizontal'?'h':'v',inv:v=>v==='h'?'horizontal':'vertical'});
  scrub(b,'raster sweeps/s','raster',.3,14,.1);
  scrub(b,'vector beam speed','beam',.4,6,.1);
});
group('phosphor',true,b=>{
  scrub(b,'red persistence (s)','tauR',.02,.4,.01);
  scrub(b,'green persistence (s)','tauG',.02,.4,.01);
  scrub(b,'blue persistence (s)','tauB',.02,.4,.01);
  scrub(b,'beam bloom','bloom',.2,3,.05);
  scrub(b,'exposure','exposure',.4,4,.05);
});
group('scanlines',false,b=>{ scrub(b,'scanlines','lines',120,400,2); });
group('reflection',false,b=>{
  scrub(b,'reflection brightness','reflect',0,1.5,.02);
  scrub(b,'reflection settle (low=solid)','reflPersist',.01,.5,.01);
});

// ============================================================
// the loop
// ============================================================
let last=0,beamF=0,scanY=0,field=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=last?Math.min(0.05,(ts-last)/1000):0.016;last=ts;
  const dR=Math.exp(-dt/CFG.tauR),dG=Math.exp(-dt/CFG.tauG),dB=Math.exp(-dt/CFG.tauB);
  for(let i=0;i<acc.length;i+=3){acc[i]*=dR;acc[i+1]*=dG;acc[i+2]*=dB;}
  if(CFG.mode==='vector'){
    const adv=CFG.beam*NP*dt,head=Math.min(NP,Math.ceil(adv));
    for(let s=0;s<head;s++){beamF+=adv/head;const idx=((beamF|0)%NP+NP)%NP,q=PATH[idx],isHead=(s===head-1),amp=isHead?1.6:0.5,rad=1.5+CFG.bloom*(isHead?2.2:1.1);depositTo(acc,q.x,q.y,q.col,amp,rad);}
  } else {
    const a2=1.3*CFG.bloom;
    if(CFG.scanDir==='h'){
      const ny=scanY+CFG.raster*SEAM*dt;
      for(let yy=Math.floor(scanY);yy<Math.floor(ny);yy++){const yr=((yy%SEAM)+SEAM)%SEAM;if(CFG.interlace&&(yr&1)!==field)continue;const base=yr*CW*3;for(let x=0;x<CW;x++){const si=base+x*3;if(signal[si]+signal[si+1]+signal[si+2]<0.01)continue;acc[si]+=signal[si]*a2;acc[si+1]+=signal[si+1]*a2;acc[si+2]+=signal[si+2]*a2;}}
      scanY=ny;if(scanY>=SEAM){scanY-=SEAM;if(CFG.interlace)field^=1;}
    } else {
      const nx=scanY+CFG.raster*CW*dt;
      for(let xx=Math.floor(scanY);xx<Math.floor(nx);xx++){const xr=((xx%CW)+CW)%CW;if(CFG.interlace&&(xr&1)!==field)continue;for(let yv=0;yv<SEAM;yv++){const si=(yv*CW+xr)*3;if(signal[si]+signal[si+1]+signal[si+2]<0.01)continue;acc[si]+=signal[si]*a2;acc[si+1]+=signal[si+1]*a2;acc[si+2]+=signal[si+2]*a2;}}
      scanY=nx;if(scanY>=CW){scanY-=CW;if(CFG.interlace)field^=1;}
    }
  }
  const k=CFG.reflPersist;
  for(let y=SEAM;y<CH;y++){const my=2*SEAM-y;if(my<0||my>=SEAM)continue;const d0=y*CW*3,s0=my*CW*3;for(let x=0;x<CW;x++){const d3=d0+x*3,s3=s0+x*3;refl[d3]+=(acc[s3]-refl[d3])*k;refl[d3+1]+=(acc[s3+1]-refl[d3+1])*k;refl[d3+2]+=(acc[s3+2]-refl[d3+2])*k;}}
  const exp=CFG.exposure,lines=CFG.lines,rb=CFG.reflect,horiz=(CFG.scanDir==='h'),raster=(CFG.mode==='raster');
  const profY=new Float32Array(CH);for(let yy2=0;yy2<CH;yy2++){const fy=((yy2/CH)*lines)%1;profY[yy2]=0.35+0.65*Math.pow(Math.sin(Math.PI*fy),1.4);}
  let profX=null;if(!horiz){profX=new Float32Array(CW);for(let xx2=0;xx2<CW;xx2++){const fx=((xx2/CW)*lines)%1;profX[xx2]=0.35+0.65*Math.pow(Math.sin(Math.PI*fx),1.4);}}
  for(let y=0;y<CH;y++){const bottom=(y>=SEAM),py=profY[y];
    for(let x=0;x<CW;x++){const idx=(y*CW+x)*3,di=(y*CW+x)*4,prof=raster?(horiz?py:profX[x]):1;let r,g,b;
      if(bottom){r=refl[idx]*rb;g=refl[idx+1]*rb;b=refl[idx+2]*rb;}else{r=acc[idx];g=acc[idx+1];b=acc[idx+2];}
      data[di]=255*(1-Math.exp(-r*exp))*prof;data[di+1]=255*(1-Math.exp(-g*exp))*prof;data[di+2]=255*(1-Math.exp(-b*exp))*prof;data[di+3]=255;}}
  ctx.putImageData(img,0,0);
  ctx.globalAlpha=0.5;ctx.strokeStyle='#66707f';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,SEAM+.5);ctx.lineTo(CW,SEAM+.5);ctx.stroke();ctx.globalAlpha=1;
}
requestAnimationFrame(frame);
</script>
</body>
</html>
