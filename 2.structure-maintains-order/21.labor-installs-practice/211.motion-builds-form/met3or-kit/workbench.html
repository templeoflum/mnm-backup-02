<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MET∃OR · brand workbench</title>
<!-- met3or brand workbench (proposal.met3or-workbench.f0, signed 20260705-123027).
     The Living Wordmark Engine with its constants pulled into a live CFG object
     you turn by hand. Seeded from met3or/engine (archive stays untouched at the
     dock). Slice 2: expose the settings + save them. Defaults carry the operator's
     first wants (asymmetric axis emphasized, mirror more transparent + reflection
     stronger, editable REV, scanline dials, stepped/fps-capped slider). -->
<style>
  :root{ --font-mono:"SF Mono",ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
         --amber:#f0a94a; --blue:#5aa7e8; --green:#4ade80; --mut:#66707f; --ink:#e6edf3; --bg:#05080c; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);font-family:var(--font-mono);color:var(--ink);overflow:hidden}
  #app{height:100%;display:flex;min-height:0}
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:22px;min-width:0}
  canvas{width:min(92%,760px);display:block;border-radius:14px;background:#0a0f16;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .ctl{width:min(92%,760px);display:flex;align-items:center;gap:12px}
  .lbl{color:var(--mut);font-size:13px}
  .row{width:min(92%,760px);display:flex;align-items:center;justify-content:space-between}
  input[type=range]{flex:1;accent-color:var(--green);height:3px}
  button{background:none;border:1px solid var(--green);color:var(--green);border-radius:9px;padding:6px 14px;font-family:var(--font-mono);font-size:13px;cursor:pointer;transition:.15s}
  button.alt{border-color:var(--blue);color:var(--blue)}
  button.mut{border-color:var(--mut);color:var(--mut)}
  .foot{color:var(--mut);font-size:11px;text-align:center;opacity:.8}
  /* the dial panel */
  #panel{width:340px;flex:none;background:#080c12;border-left:1px solid #16202c;overflow-y:auto;padding:0 0 40px}
  #panel h1{font-size:12px;letter-spacing:.14em;color:var(--ink);padding:14px 16px;border-bottom:1px solid #16202c;position:sticky;top:0;background:#080c12;z-index:2;text-transform:uppercase}
  .save{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid #16202c;align-items:center}
  .save input[type=text]{flex:1;min-width:90px;background:#0a0f16;border:1px solid #23303f;color:var(--ink);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;outline:none}
  .save select{background:#0a0f16;border:1px solid #23303f;color:var(--ink);border-radius:6px;padding:5px 6px;font:inherit;font-size:12px}
  .save button{padding:5px 10px;font-size:11px}
  details{border-bottom:1px solid #121a24}
  summary{cursor:pointer;padding:9px 16px;color:var(--ink);font-size:12px;letter-spacing:.06em;list-style:none;user-select:none;text-transform:uppercase}
  summary::before{content:'▸ ';color:var(--mut)}
  details[open] summary::before{content:'▾ '}
  summary:hover{color:var(--green)}
  .dial{display:flex;flex-direction:column;gap:3px;padding:7px 16px}
  .dial .top{display:flex;justify-content:space-between;align-items:baseline}
  .dial .name{font-size:11px;color:var(--mut)}
  .dial .val{font-size:11px;color:var(--green);font-variant-numeric:tabular-nums}
  .dial input[type=range]{width:100%}
  .dial.rowish{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .dial input[type=text]{background:#0a0f16;border:1px solid #23303f;color:var(--ink);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px;outline:none;width:120px}
  .dial input[type=color]{width:34px;height:24px;border:1px solid #23303f;border-radius:5px;background:none;cursor:pointer}
  .wlrow{display:flex;gap:6px}
  .wl{width:24px;height:20px;border-radius:5px;cursor:pointer;border:2px solid transparent;opacity:.45;transition:.12s}
  .wl:hover{opacity:.8}
  .wl.on{opacity:1;border-color:var(--ink)}
  .dial label.chk{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="engC" aria-label="MET3OR living wordmark engine"></canvas>
    <div class="ctl"><span class="lbl">−30°</span><input id="s" type="range" min="0" max="1" step="0.004" value="0"><span class="lbl">+30°</span></div>
    <div class="row">
      <span id="out" class="lbl">θ = −30° · the grammar · document</span>
      <div style="display:flex;gap:8px">
        <button id="drift" class="alt">drift</button>
        <button id="snd">sound</button>
      </div>
    </div>
    <div class="foot">flying-spot render · ink-only interlace · the grammar, turned by hand</div>
  </div>
  <div id="panel">
    <h1>workbench · dials</h1>
    <div class="save">
      <input type="text" id="preset-name" placeholder="preset name…">
      <button id="preset-save">save</button>
      <select id="preset-load"><option value="">load…</option></select>
      <button id="preset-export" class="mut">export</button>
      <button id="preset-import" class="mut">import</button>
      <button id="preset-reset" class="mut">reset</button>
      <input type="file" id="preset-file" accept="application/json" style="display:none">
    </div>
    <div id="dials"></div>
  </div>
</div>
<script>
(function(){
'use strict';
// ---------------- CFG: every dial writes here; the render reads here ----------------
var DEFAULTS={
  axisAsymA:0.9, axisAsymW:0.65, axisSymA:0.14, axisSymW:0.6,   // asym emphasized; weights from the operator's preset
  cAxisAsym:'#5aa7e8', cAxisSym:'#f0a94a',                       // axes are wavelengths only (blue/amber) - read apart from the green digit (operator 132417/135439)
  mirrorAxisOpacity:1.5, mirrorStrength:0.08,                    // the operator's dialed mirror: strong datum line, minimal reflection (this clears the residue)
  rev:'1.2.1', showTitle:true,                                   // his want 3: editable rev
  scanlineIntensity:1.0, scanlineSpacing:3.4, flicker:1.0,
  driftSpeed:1.0, seam:280,
  sliderSteps:0, fpsCap:60,                                      // his want: mechanical / capped
  cAmber:'#f0a94a', cBlue:'#5aa7e8', cGreen:'#4ade80', cBg:'#0a0f16'
};
var CFG=Object.assign({},DEFAULTS);

// ---------------- dial definitions (grouped, labeled — a workbench, not a catalog) ----
var GROUPS=[
 {name:'axes', open:true, dials:[
   {k:'cAxisAsym', label:'asymmetric axis · wavelength', type:'wavelength'},
   {k:'axisAsymA', label:'asymmetric axis · opacity', min:0,max:1,step:.01},
   {k:'axisAsymW', label:'asymmetric axis · weight', min:.1,max:2,step:.05},
   {k:'cAxisSym', label:'symmetric axis · wavelength', type:'wavelength'},
   {k:'axisSymA', label:'symmetric axis · opacity', min:0,max:1,step:.01},
   {k:'axisSymW', label:'symmetric axis · weight', min:.1,max:2,step:.05},
 ]},
 {name:'mirror', open:true, dials:[
   {k:'mirrorAxisOpacity', label:'mirror axis (datum) · opacity', min:0,max:1.5,step:.01},
   {k:'mirrorStrength', label:'reflection strength', min:0,max:3,step:.02},
   {k:'seam', label:'seam position', min:210,max:340,step:1},
 ]},
 {name:'scanlines · grain', open:false, dials:[
   {k:'scanlineIntensity', label:'scanline intensity', min:0,max:4,step:.05},
   {k:'scanlineSpacing', label:'scanline spacing', min:1.6,max:8,step:.1},
   {k:'flicker', label:'flicker', min:0,max:3,step:.05},
 ]},
 {name:'motion', open:false, dials:[
   {k:'driftSpeed', label:'drift speed', min:.2,max:4,step:.05},
   {k:'sliderSteps', label:'slider detents (0 = smooth)', min:0,max:60,step:1},
   {k:'fpsCap', label:'frame-rate cap', min:8,max:60,step:1},
 ]},
 {name:'title block', open:false, dials:[
   {k:'rev', label:'REV text', type:'text'},
   {k:'showTitle', label:'show title block', type:'check'},
 ]},
];

// ---------------- canvas + engine (render preserved from the engine; constants -> CFG) --
var CW=760,CH=528,DP=Math.min(window.devicePixelRatio||1,2),S=2.0;
var cv=document.getElementById('engC'),c=cv.getContext('2d');
cv.width=CW*DP;cv.height=CH*DP;c.scale(DP,DP);

var icA=mk(),ic=icA[0],ictx=icA[1];
var ncA=mk(),nc=ncA[0],nctx=ncA[1];
var MUT='#66707f',INK='#e6edf3';
function circle(cx,cy,r,n){var q=[];for(var i=0;i<=n;i++){var a=-Math.PI/2+i/n*2*Math.PI;q.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return q;}
var LET=[
{h:36,cx:70,cy:108,sh:0,isR:false,segs:[[[52,136],[52,80],[70,112],[88,80],[88,136]]]},
{h:210,cx:117,cy:108,sh:1,isR:false,segs:[[[134,80],[100,80],[100,136],[134,136]],[[100,108],[126,108]]]},
{h:140,cx:166,cy:108,sh:2,isR:false,segs:[[[148,80],[184,80]],[[166,80],[166,136]]]},
{h:140,cx:215,cy:108,sh:2,isR:false,segs:[[[198,80],[232,80],[232,136],[198,136]],[[232,108],[206,108]]]},
{h:210,cx:262,cy:124,sh:1,isR:false,segs:[circle(262,124,24,40)]},
{h:36,cx:314,cy:108,sh:0,isR:true,segs:[[[296,136],[296,80],[318,80],[328.5,83.5],[332,94],[328.5,104.5],[318,108],[296,108]],[[310,108],[332,136]]]}
];
var SAT=[84,72,66,66,72,84],LIT=[62,63,58,58,63,62];
var PATH=[];
LET.forEach(function(L,li){L.segs.forEach(function(seg){
PATH.push({x:seg[0][0],y:seg[0][1],li:li,pen:false});
for(var i=0;i<seg.length-1;i++){var a=seg[i],b=seg[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(d/1.7));
for(var k=1;k<=n;k++)PATH.push({x:a[0]+(b[0]-a[0])*k/n,y:a[1]+(b[1]-a[1])*k/n,li:li,pen:true});}
});});
var NP=PATH.length;

// static engineering document layer — now a function so axis/rev/palette dials redraw it live
function drawDoc(){var d=dctx,SEAM=CFG.seam,AMBER=CFG.cAmber,BLUE=CFG.cBlue,GREEN=CFG.cGreen;function X(v){return v*S;}
d.clearRect(0,0,CW,CH);
function ln(p1,p2,col,w,a){d.strokeStyle=col;d.globalAlpha=a==null?1:a;d.lineWidth=Math.max(.5,w*S);d.beginPath();d.moveTo(X(p1[0]),X(p1[1]));d.lineTo(X(p2[0]),X(p2[1]));d.stroke();d.globalAlpha=1;}
function chain(p1,p2,col,w,a){var x1=p1[0],y1=p1[1],x2=p2[0],y2=p2[1],L=Math.hypot(x2-x1,y2-y1),t=0,pat=[[9,1],[2,0],[1.2,1],[2,0]],pi=0;
while(t<L){var seg=pat[pi%4][0],on=pat[pi%4][1];pi++;var t2=Math.min(L,t+seg);if(on)ln([x1+(x2-x1)*t/L,y1+(y2-y1)*t/L],[x1+(x2-x1)*t2/L,y1+(y2-y1)*t2/L],col,w,a);t=t2;}}
function arrow(x,y,dx,col,a){d.fillStyle=col;d.globalAlpha=a;d.beginPath();d.moveTo(X(x),X(y));d.lineTo(X(x+3.2*dx),X(y-1.1));d.lineTo(X(x+3.2*dx),X(y+1.1));d.fill();d.globalAlpha=1;}
function cross(x,y,r,col,a){ln([x-r,y],[x+r,y],col,.45,a);ln([x,y-r],[x,y+r],col,.45,a);}
function txt(x,y,s,col,px,al){d.fillStyle=col;d.globalAlpha=1;d.font=px*S+'px var(--font-mono)';d.textAlign=al||'center';d.textBaseline='middle';d.fillText(s,X(x),X(y));}
[[26,30],[354,30],[26,212],[354,212]].forEach(function(q){cross(q[0],q[1],4,MUT,.6);});
ln([166,28],[166,41],MUT,.45,.75);ln([190,28],[190,41],MUT,.45,.75);ln([166,34],[190,34],MUT,.45,.85);
arrow(166,34,1,MUT,.85);arrow(190,34,-1,MUT,.85);txt(203,34,'Δ24',MUT,9,'left');
chain([166,44],[166,206],CFG.cAxisAsym,CFG.axisAsymW,CFG.axisAsymA);txt(160,46,'σ',CFG.cAxisAsym,9,'right');   // asymmetric axis - own color, reads apart from the green digit
chain([190,44],[190,206],CFG.cAxisSym,CFG.axisSymW,CFG.axisSymA);                                              // symmetric (true-center) axis
[[70,'+',AMBER],[117,'−',BLUE],[166,'0',GREEN],[215,'0',GREEN],[262,'−',BLUE],[313,'+',AMBER]].forEach(function(t){txt(t[0],56,t[1],t[2],12);});
[[20,'0'],[133,'1'],[247,'2'],[360,'10']].forEach(function(t){ln([t[0],SEAM/S-6],[t[0],SEAM/S],MUT,.5,.85);txt(t[0],SEAM/S-9.5,t[1],MUT,7.5);});
[58,96,171,209,285,322].forEach(function(x){ln([x,SEAM/S-3],[x,SEAM/S],MUT,.45,.6);});
d.globalAlpha=.38;d.strokeStyle=BLUE;d.setLineDash([3,4]);d.lineWidth=.6*S;d.beginPath();d.arc(X(262),X(108),X(24),0,7);d.stroke();d.setLineDash([]);d.globalAlpha=1;
txt(176,220,'σᵥ σₕ σᵥ σₕ D₂',MUT,12);txt(238,220,'C₁',AMBER,12);txt(190,236,'w = h/φ · λ = 530 ± 60 nm',MUT,12);
if(CFG.showTitle){
ln([20,248],[360,248],MUT,.5,.78);ln([20,262],[360,262],MUT,.5,.78);ln([20,248],[20,262],MUT,.5,.78);ln([360,248],[360,262],MUT,.5,.78);
[128,214,300].forEach(function(xv){ln([xv,248],[xv,262],MUT,.45,.6);});
txt(74,255,'MET∃OR',MUT,7.5);txt(171,255,'THE GRAMMAR',MUT,7.5);txt(257,255,CFG.rev?('REV '+CFG.rev):'',MUT,7.5);txt(330,255,'f₀ 1.2 Hz',MUT,7.5);
}}
drawDoc();

// audio (unchanged)
var ctx=null,V=null,an=null,td=null,son=false,fr0=[231.1,290.1,257.2,257.2,290.1,231.1],pans=[-.85,-.5,-.15,.15,.5,.85],BASE=.055,lastCol=0;
function startAudio(){ctx=new (window.AudioContext||window.webkitAudioContext)();var m=ctx.createGain();an=ctx.createAnalyser();an.fftSize=512;td=new Uint8Array(an.fftSize);m.connect(an);an.connect(ctx.destination);V={a:[],b:[]};
function o(f,pn){var os=ctx.createOscillator(),g=ctx.createGain(),pnn=ctx.createStereoPanner();os.type='triangle';os.frequency.value=f;g.gain.value=0;os.connect(g);g.connect(pnn);pnn.connect(m);pnn.pan.value=pn;os.start();return{o:os,g:g,f:f};}
for(var i=0;i<6;i++){V.a.push(o(fr0[i],pans[i]));V.b.push(o(fr0[i]+1.2,-pans[i]));}}
function setMix(mm,col){if(!son||!V)return;var t=ctx.currentTime,f=1-.35*col,w=1-.025*col;for(var i=0;i<6;i++){V.a[i].g.gain.setTargetAtTime(BASE*(1-mm)*f,t,.04);V.b[i].g.gain.setTargetAtTime(BASE*mm*f,t,.04);if(col>0||lastCol>0){V.a[i].o.frequency.setTargetAtTime(V.a[i].f*w,t,.025);V.b[i].o.frequency.setTargetAtTime(V.b[i].f*w,t,.025);}}lastCol=col;}
function amp(T){if(son&&an){an.getByteTimeDomainData(td);var s=0;for(var i=0;i<td.length;i++){var v=(td[i]-128)/128;s+=v*v;}return Math.min(1,Math.sqrt(s/td.length)*4.5);}return Math.abs(Math.sin(Math.PI*1.2*T));}
var s=document.getElementById('s'),out=document.getElementById('out'),db=document.getElementById('drift'),sb=document.getElementById('snd');
var drifting=false,phase=-Math.PI/2;
s.addEventListener('input',function(){snapSlider();if(drifting)td2();});
function snapSlider(){var n=CFG.sliderSteps|0;if(n>0){var v=Math.round(parseFloat(s.value)*n)/n;s.value=v;}}
function td2(){drifting=!drifting;db.style.borderColor=drifting?INK:CFG.cBlue;db.style.color=drifting?INK:CFG.cBlue;}
db.addEventListener('click',td2);
sb.addEventListener('click',function(){if(!ctx)startAudio();if(ctx.state==='suspended')ctx.resume();son=!son;sb.style.borderColor=son?INK:CFG.cGreen;sb.style.color=son?INK:CFG.cGreen;if(son)setMix(parseFloat(s.value),0);else{var t=ctx.currentTime;for(var i=0;i<6;i++){V.a[i].g.gain.setTargetAtTime(0,t,.04);V.b[i].g.gain.setTargetAtTime(0,t,.04);}}});
var T=0,idx=0,HUE=0,VEL=0,scan=0,blinkQ=[],nb=3,REV=1.8,colT=-99,ncol=REV*8,cHold=.35,dwell=0,feral=0,lastF=0;
function ob(dd){if(dd>.2)return -2;if(dd>.12)return -1;if(dd>.06)return 0;if(dd>.03)return 1;return 2;}
function ease(u){return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;}
function ss(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u);}
function nz(i){var x=Math.sin(i*127.1+Math.floor(T*7)*311.7)*43758.5453;return x-Math.floor(x);}
function hsl(h,s2,l){h=(h%360+360)%360;s2/=100;l/=100;var a=s2*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));}return 'rgb('+[f(0),f(8),f(4)].map(function(v){return Math.round(v*255);}).join(',')+')';}
function tf(ts){
requestAnimationFrame(tf);
// his want: capped frame rate — a mechanical, stepped cadence
if(CFG.fpsCap<60){if(ts&&lastF&&ts-lastF<1000/CFG.fpsCap)return;lastF=ts||0;}
var SEAM=CFG.seam;
T+=1/60;
if(drifting){phase+=2*Math.PI/(40*60)*CFG.driftSpeed;s.value=0.5+0.5*Math.sin(phase);snapSlider();}
var mm=parseFloat(s.value);
if(Math.abs(mm-0.5)<0.01)dwell+=1/60;else dwell=0;
var fT=ss((dwell-2.5)/2.5);feral+=(fT-feral)*0.12;
var soft=4*mm*(1-mm),sharp=soft*soft;
var A=amp(T),Aeff=.15+.85*A,dd=Math.abs(mm-.5),n=ob(dd);
var hueG=Math.exp(-Math.pow((mm-.5)/.08,2));
var tv=3.2*Math.pow(2,n)*(.6+.8*A);VEL+=(tv-VEL)*.06;HUE=(HUE+VEL*hueG)%360;
var lumF=1.2*Math.pow(2,Math.min(Math.max(n,0),1)),strobe=.5+.5*Math.sin(2*Math.PI*lumF*T);
var col=0;
if(hueG>.6&&T>ncol){colT=T;cHold=.3+Math.random()*.25;ncol=T+REV*(6+Math.floor(Math.random()*8));}
var ct=T-colT,ctot=.15+cHold+.2;
if(ct>=0&&ct<ctot){if(ct<.15)col=ease(ct/.15);else if(ct<.15+cHold)col=1;else col=1-ease((ct-.15-cHold)/.2);}
var sweep=1-.91*col;
setMix(mm,col);
var spread=1+(.004+.045*soft)*Math.sin(Math.PI*1.2*T/2);
function xf(pt,L){var ph=L.sh*2.09,sy=1+(.004+.028*soft+.06*sharp)*Math.sin(2*Math.PI*1.2*T+ph),sx=1/Math.sqrt(sy),mx=190+(L.cx-190)*spread;return[(mx+(pt.x-L.cx)*sx)*S,(L.cy+(pt.y-L.cy)*sy)*S];}
p.globalCompositeOperation='destination-out';p.fillStyle='rgba(0,0,0,'+(.09-.07*col)+')';p.fillRect(0,0,CW,CH);p.globalCompositeOperation='source-over';
var steps=Math.max(1,Math.round(NP/1.6*sweep));var bx=0,by=0,pen=false;
var depA=(.6+.3*(sharp>.02?(.4+.6*strobe)*Aeff:.6))*(1-.15*col);
function hueFor(L){var lean=60*hueG*Math.sin(2*Math.PI*0.6*T+L.sh*2.094);return(L.h+lean*(1-feral)+HUE*hueG*feral)%360;}
for(var st=0;st<steps;st++){idx=(idx+1)%NP;var q=PATH[idx],L=LET[q.li];pen=q.pen;var xy=xf(q,L);bx=xy[0];by=xy[1];
if(pen){var hh=hueFor(L),sn=Math.min(100,SAT[q.li]*(1+(.3+1.2*feral)*hueG)),ll=LIT[q.li],rgb=hsl(hh,sn,ll);
p.globalAlpha=depA*(.14+.14*soft);p.fillStyle=rgb;p.beginPath();p.arc(bx,by,(4+2*soft)*S,0,7);p.fill();
p.globalAlpha=depA;p.beginPath();p.arc(bx,by,(2.7+1.2*sharp)*S,0,7);p.fill();
var my=(L.isR?(q.y+2*(SEAM/S-108)):(2*SEAM/S-q.y))*S;
p.globalAlpha=depA*(.26+.2*soft*Aeff)*CFG.mirrorStrength;p.beginPath();p.arc(bx,my,2.7*S,0,7);p.fill();p.globalAlpha=1;}}   // his want: reflection strength
ictx.clearRect(0,0,CW,CH);ictx.drawImage(pc,0,0,CW,CH);nctx.clearRect(0,0,CW,CH);nctx.drawImage(dc,0,0,CW,CH);
var SG=0.0;
for(var i=0;i<19;i++){var xi=i*20+10,di=Math.abs(xi-166)/214,oi=ss(mm*(1+SG)-di*SG),tp=oi*20;
if(tp>.05){var x0=Math.round(i*20*S),x1=Math.round((i*20+tp)*S);if(x1>x0){
[[ictx,pc],[nctx,dc]].forEach(function(pr){var g=pr[0],src=pr[1];g.clearRect(x0,0,x1-x0,CH);g.save();g.beginPath();g.rect(x0,0,x1-x0,CH);g.clip();g.translate(CW,0);g.scale(-1,1);g.drawImage(src,0,0,CW,CH);g.restore();});}}}
c.fillStyle=CFG.cBg;c.fillRect(0,0,CW,CH);
var dA=Math.max(.3,1-sharp*.7*(1-strobe*Aeff));
c.save();c.globalAlpha=dA;c.drawImage(nc,0,0,CW,CH);c.restore();
c.drawImage(ic,0,0,CW,CH);
// datum line (his want: mirror axis opacity)
var yS=Math.round(SEAM),wS=Math.max(1,Math.round((.5+.35*sharp)*S));c.globalAlpha=(.62+.28*soft*Aeff)*CFG.mirrorAxisOpacity;c.strokeStyle=MUT;c.lineWidth=wS;
c.beginPath();c.moveTo(20*S,yS);c.lineTo(360*S,yS);c.stroke();c.globalAlpha=1;
if(T>nb&&blinkQ.length===0){blinkQ.push(T);if(Math.random()<.18)blinkQ.push(T+.34);nb=T+2.2+Math.random()*3.8;}
var occl=false;for(var bi=blinkQ.length-1;bi>=0;bi--){var bt=T-blinkQ[bi];if(bt>.32){blinkQ.splice(bi,1);continue;}if(bt>=0&&bt<.2)occl=true;}
[[262,1-mm],[118,mm]].forEach(function(pr){var exl=pr[0],share=pr[1],av=ss(Math.min(1,share*2));if(av<.02)return;
var ex=exl*S,ew=18*S,eh=10*S;c.globalAlpha=av;c.fillStyle='rgba(90,167,232,'+(.30+.30*soft*Aeff)+')';
c.beginPath();c.moveTo(ex-ew,SEAM);for(var k=0;k<=24;k++)c.lineTo(ex-ew+2*ew*k/24,SEAM+eh*Math.sin(Math.PI*k/24));for(var k2=0;k2<=24;k2++)c.lineTo(ex+ew-2*ew*k2/24,SEAM-eh*Math.sin(Math.PI*k2/24));c.fill();
if(!occl){c.fillStyle=INK;c.beginPath();c.arc(ex,SEAM,5*S,0,7);c.fill();}c.globalAlpha=1;});
if(pen){var coreA=sharp*.18+col*.85;if(coreA>.03){c.fillStyle='rgba(255,255,255,'+(coreA*.26)+')';c.beginPath();c.arc(bx,by,5.5*S,0,7);c.fill();c.fillStyle='rgba(255,255,255,'+coreA+')';c.beginPath();c.arc(bx,by,1.9*S,0,7);c.fill();}}
// analog scanlines — PLACEHOLDER, guessed. To be REBUILT faithfully from the
// research (Signal Culture Cookbooks + video-synth history at the dock). We only
// do faithful emulation - no cheap tricks. The rolling luminance bar and the
// random full-frame flicker were removed (operator 20260705-132308: cheap
// imitation, permanent residue). Kept dial-able so it can go to zero.
scan=(scan+.12+.05*Math.sin(T*.23))%3.4;var sBase=.008+.045*soft+.06*sharp,sp=CFG.scanlineSpacing+.25*Math.sin(T*.31);
for(var y=-sp+scan;y<CH/S;y+=sp){var li3=Math.floor(y/sp),a3=sBase*(.55+.75*nz(li3))*CFG.scanlineIntensity;if(nz(li3+999)<.05)continue;c.fillStyle='rgba(0,0,0,'+a3.toFixed(3)+')';c.fillRect(0,y*S,CW,1*S);}
var deg=Math.round(mm*60-30),state=hueG>.35?'pure signal · full tilt':(mm<.3?'the grammar · document':(mm>.7?'the mirror grammar':'crossing'));
out.textContent='θ = '+(deg>0?'+':'')+deg+'° · '+state;
}

// ---------------- build the dial panel + wiring ----------------
var dialsEl=document.getElementById('dials'),valEls={};
function fmt(v){return (typeof v==='number')?(Math.abs(v)>=10?v.toFixed(0):v.toFixed(2)):v;}
GROUPS.forEach(function(G){
  var det=document.createElement('details');if(G.open)det.open=true;
  var sum=document.createElement('summary');sum.textContent=G.name;det.appendChild(sum);
  G.dials.forEach(function(D){
    var wrap=document.createElement('div');
    if(D.type==='color'||D.type==='text'||D.type==='check'||D.type==='wavelength'){
      wrap.className='dial rowish';
      var nm=document.createElement('span');nm.className='name';nm.textContent=D.label;
      var inp;
      if(D.type==='wavelength'){
        // only the three brand wavelengths are selectable (operator 135439: colors
        // are wavelengths; the full spectrum lives only in the 0/pure-signal state)
        inp=document.createElement('div');inp.className='wlrow';
        [['#f0a94a','+'],['#4ade80','0'],['#5aa7e8','−']].forEach(function(w){
          var sw=document.createElement('span');sw.className='wl'+(CFG[D.k]===w[0]?' on':'');
          sw.style.background=w[0];sw.title=w[1]+' · '+w[0];sw.dataset.k=D.k;sw.dataset.hex=w[0];
          sw.addEventListener('click',function(){CFG[D.k]=w[0];inp.querySelectorAll('.wl').forEach(function(x){x.classList.toggle('on',x===sw);});drawDoc();});
          inp.appendChild(sw);});
      }
      else if(D.type==='color'){inp=document.createElement('input');inp.type='color';inp.value=CFG[D.k];inp.addEventListener('input',function(){CFG[D.k]=inp.value;drawDoc();});}
      else if(D.type==='text'){inp=document.createElement('input');inp.type='text';inp.value=CFG[D.k];inp.addEventListener('input',function(){CFG[D.k]=inp.value;drawDoc();});}
      else{var lab=document.createElement('label');lab.className='chk';inp=document.createElement('input');inp.type='checkbox';inp.checked=!!CFG[D.k];inp.addEventListener('change',function(){CFG[D.k]=inp.checked;drawDoc();});lab.appendChild(inp);lab.appendChild(document.createTextNode(' '+(CFG[D.k]?'on':'off')));inp.addEventListener('change',function(){lab.lastChild.textContent=' '+(inp.checked?'on':'off');});}
      inp.dataset.k=D.k;wrap.appendChild(nm);wrap.appendChild(D.type==='check'?inp.parentNode:inp);
    } else {
      wrap.className='dial';
      var top=document.createElement('div');top.className='top';
      var nm2=document.createElement('span');nm2.className='name';nm2.textContent=D.label;
      var val=document.createElement('span');val.className='val';val.textContent=fmt(CFG[D.k]);valEls[D.k]=val;
      top.appendChild(nm2);top.appendChild(val);
      var r=document.createElement('input');r.type='range';r.min=D.min;r.max=D.max;r.step=D.step;r.value=CFG[D.k];r.dataset.k=D.k;
      r.addEventListener('input',function(){var v=parseFloat(r.value);CFG[D.k]=v;val.textContent=fmt(v);
        // doc-layer dials redraw the static sheet; render-loop dials are read live
        if(['axisAsymA','axisAsymW','axisSymA','axisSymW','seam'].indexOf(D.k)>=0)drawDoc();});
      wrap.appendChild(top);wrap.appendChild(r);
    }
    det.appendChild(wrap);
  });
  dialsEl.appendChild(det);
});

// ---------------- save / load (his want: save them) ----------------
var LSK='met3or_workbench_presets';
function presets(){try{return JSON.parse(localStorage.getItem(LSK)||'{}');}catch(e){return {};}}
function refreshLoad(){var sel=document.getElementById('preset-load');sel.innerHTML='<option value="">load…</option>';var P=presets();Object.keys(P).forEach(function(nme){var o=document.createElement('option');o.value=nme;o.textContent=nme;sel.appendChild(o);});}
function applyCFG(src){Object.keys(DEFAULTS).forEach(function(k){if(src[k]!==undefined)CFG[k]=src[k];});
  // reflect into every control
  document.querySelectorAll('#dials input').forEach(function(inp){var k=inp.dataset.k;if(!k)return;if(inp.type==='checkbox')inp.checked=!!CFG[k];else inp.value=CFG[k];if(valEls[k])valEls[k].textContent=fmt(CFG[k]);});
  document.querySelectorAll('#dials .wl').forEach(function(sw){sw.classList.toggle('on',CFG[sw.dataset.k]===sw.dataset.hex);});
  drawDoc();}
document.getElementById('preset-save').addEventListener('click',function(){var nme=(document.getElementById('preset-name').value||'').trim();if(!nme){alert('name the preset first');return;}var P=presets();P[nme]={};Object.keys(DEFAULTS).forEach(function(k){P[nme][k]=CFG[k];});localStorage.setItem(LSK,JSON.stringify(P));refreshLoad();document.getElementById('preset-load').value=nme;});
document.getElementById('preset-load').addEventListener('change',function(){var nme=this.value;if(!nme)return;var P=presets();if(P[nme])applyCFG(P[nme]);});
document.getElementById('preset-reset').addEventListener('click',function(){applyCFG(DEFAULTS);});
document.getElementById('preset-export').addEventListener('click',function(){var blob=new Blob([JSON.stringify(CFG,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='met3or-preset.json';a.click();});
document.getElementById('preset-import').addEventListener('click',function(){document.getElementById('preset-file').click();});
document.getElementById('preset-file').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{applyCFG(JSON.parse(rd.result));}catch(err){alert('not a valid preset');}};rd.readAsText(f);});
refreshLoad();
})();
</script>
