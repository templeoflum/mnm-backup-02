<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MET∃OR · brand workbench</title>
<!-- met3or brand workbench (proposal.met3or-workbench.f0, signed 20260705-123027).
     The Living Wordmark Engine with its constants pulled into a live CFG object
     you turn by hand. Seeded from met3or/engine (archive stays untouched at the
     dock). Slice 2: expose the settings + save them. Defaults carry the operator's
     first wants (asymmetric axis emphasized, mirror more transparent + reflection
     stronger, editable REV, scanline dials, stepped/fps-capped slider). -->
<style>
  :root{ --font-mono:"SF Mono",ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
         --amber:#f0a94a; --blue:#5aa7e8; --green:#4ade80; --mut:#66707f; --ink:#e6edf3; --bg:#05080c; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);font-family:var(--font-mono);color:var(--ink);overflow:hidden}
  #app{height:100%;display:flex;min-height:0}
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:22px;min-width:0}
  canvas{width:min(92%,760px);display:block;border-radius:14px;background:#0a0f16;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .ctl{width:min(92%,760px);display:flex;align-items:center;gap:12px}
  .lbl{color:var(--mut);font-size:13px}
  .row{width:min(92%,760px);display:flex;align-items:center;justify-content:space-between}
  input[type=range]{flex:1;accent-color:var(--green);height:3px}
  button{background:none;border:1px solid var(--green);color:var(--green);border-radius:9px;padding:6px 14px;font-family:var(--font-mono);font-size:13px;cursor:pointer;transition:.15s}
  button.alt{border-color:var(--blue);color:var(--blue)}
  button.mut{border-color:var(--mut);color:var(--mut)}
  .foot{color:var(--mut);font-size:11px;text-align:center;opacity:.8}
  /* the dial panel */
  #panel{width:340px;flex:none;background:#080c12;border-left:1px solid #16202c;overflow-y:auto;padding:0 0 40px}
  #panel h1{font-size:12px;letter-spacing:.14em;color:var(--ink);padding:14px 16px;border-bottom:1px solid #16202c;position:sticky;top:0;background:#080c12;z-index:2;text-transform:uppercase}
  .save{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid #16202c;align-items:center}
  .save input[type=text]{flex:1;min-width:90px;background:#0a0f16;border:1px solid #23303f;color:var(--ink);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;outline:none}
  .save select{background:#0a0f16;border:1px solid #23303f;color:var(--ink);border-radius:6px;padding:5px 6px;font:inherit;font-size:12px}
  .save button{padding:5px 10px;font-size:11px}
  details{border-bottom:1px solid #121a24}
  summary{cursor:pointer;padding:9px 16px;color:var(--ink);font-size:12px;letter-spacing:.06em;list-style:none;user-select:none;text-transform:uppercase}
  summary::before{content:'▸ ';color:var(--mut)}
  details[open] summary::before{content:'▾ '}
  summary:hover{color:var(--green)}
  .dial{display:flex;flex-direction:column;gap:3px;padding:7px 16px}
  .dial .top{display:flex;justify-content:space-between;align-items:baseline}
  .dial .name{font-size:11px;color:var(--mut)}
  .dial .val{font-size:11px;color:var(--green);font-variant-numeric:tabular-nums}
  .dial input[type=range]{width:100%}
  .dial.rowish{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .dial input[type=text]{background:#0a0f16;border:1px solid #23303f;color:var(--ink);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px;outline:none;width:120px}
  .dial input[type=color]{width:34px;height:24px;border:1px solid #23303f;border-radius:5px;background:none;cursor:pointer}
  .wlrow{display:flex;gap:6px}
  .wl{width:24px;height:20px;border-radius:5px;cursor:pointer;border:2px solid transparent;opacity:.45;transition:.12s}
  .wl:hover{opacity:.8}
  .wl.on{opacity:1;border-color:var(--ink)}
  .dial label.chk{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="engC" aria-label="MET3OR living wordmark engine"></canvas>
    <div class="ctl"><span class="lbl">−30°</span><input id="s" type="range" min="0" max="1" step="0.004" value="0"><span class="lbl">+30°</span></div>
    <div class="row">
      <span id="out" class="lbl">θ = −30° · the grammar · document</span>
      <div style="display:flex;gap:8px">
        <button id="drift" class="alt">drift</button>
        <button id="snd">sound</button>
      </div>
    </div>
    <div class="foot">flying-spot render · ink-only interlace · the grammar, turned by hand</div>
  </div>
  <div id="panel">
    <h1>workbench · dials</h1>
    <div class="save">
      <input type="text" id="preset-name" placeholder="preset name…">
      <button id="preset-save">save</button>
      <select id="preset-load"><option value="">load…</option></select>
      <button id="preset-export" class="mut">export</button>
      <button id="preset-import" class="mut">import</button>
      <button id="preset-reset" class="mut">reset</button>
      <input type="file" id="preset-file" accept="application/json" style="display:none">
    </div>
    <div id="dials"></div>
  </div>
</div>
<script>
(function(){
'use strict';
// ---------------- CFG: every dial writes here; the render reads here ----------------
var DEFAULTS={
  // render (the faithful raster CRT, folded from the study)
  mode:'raster', interlace:true, scanDir:'h', raster:4.0, beam:2.2,
  tauR:0.14, tauG:0.06, tauB:0.028, bloom:1.0, exposure:1.5, lines:262,
  lineWidth:1.6,           // wordmark stroke thickness (operator 165348)
  stripW:48,               // theta-weave strip width - the CLEAN interlace (document XOR mirror per strip)
  // reflection (a true reflection with its own persistence)
  reflect:0.85, reflPersist:0.05, seam:280, mirrorAxisOpacity:1.5,
  // reticule (axes/grid/title)
  axisAsymA:0.9, axisAsymW:0.65, axisSymA:0.14, axisSymW:0.6,
  cAxisAsym:'#4ade80', cAxisSym:'#e6edf3',
  rev:'1.2.1', showTitle:true,
  cAmber:'#f0a94a', cBlue:'#5aa7e8', cGreen:'#4ade80', cBg:'#0a0f16'
  // theta (the grammar weave) rides the top slider directly, 0..1
};
var CFG=Object.assign({},DEFAULTS);

// ---------------- dial definitions (grouped) ----
var GROUPS=[
 {name:'beam', open:true, dials:[
   {k:'mode', label:'beam mode', type:'select', options:['raster','vector']},
   {k:'interlace', label:'interlace', type:'check'},
   {k:'scanDir', label:'scanlines', type:'select', options:['horizontal','vertical'], map:{horizontal:'h',vertical:'v'}},
   {k:'raster', label:'raster sweeps/s', min:.3,max:14,step:.1},
   {k:'beam', label:'vector beam speed', min:.4,max:6,step:.1},
 ]},
 {name:'phosphor', open:true, dials:[
   {k:'lineWidth', label:'line thickness', min:.6,max:5,step:.1, rebuild:true},
   {k:'tauR', label:'red persistence (s)', min:.02,max:2,step:.01},
   {k:'tauG', label:'green persistence (s)', min:.02,max:2,step:.01},
   {k:'tauB', label:'blue persistence (s)', min:.02,max:2,step:.01},
   {k:'bloom', label:'beam bloom', min:.2,max:3,step:.05},
   {k:'exposure', label:'exposure', min:.4,max:4,step:.05},
 ]},
 {name:'grammar (θ weave)', open:false, dials:[
   {k:'stripW', label:'weave strip width', min:4,max:200,step:2},
 ]},
 {name:'reflection', open:false, dials:[
   {k:'reflect', label:'reflection brightness', min:0,max:1.5,step:.02},
   {k:'reflPersist', label:'reflection settle (low=solid)', min:.01,max:.5,step:.01},
   {k:'seam', label:'seam position', min:210,max:340,step:1},
   {k:'mirrorAxisOpacity', label:'datum opacity', min:0,max:1.5,step:.01},
 ]},
 {name:'reticule', open:false, dials:[
   {k:'cAxisAsym', label:'asymmetric axis', type:'wavelength'},
   {k:'axisAsymA', label:'asymmetric axis · opacity', min:0,max:1,step:.01},
   {k:'axisAsymW', label:'asymmetric axis · weight', min:.1,max:2,step:.05},
   {k:'cAxisSym', label:'symmetric axis', type:'wavelength'},
   {k:'axisSymA', label:'symmetric axis · opacity', min:0,max:1,step:.01},
   {k:'axisSymW', label:'symmetric axis · weight', min:.1,max:2,step:.05},
   {k:'lines', label:'scanline count', min:120,max:400,step:2},
 ]},
 {name:'title block', open:false, dials:[
   {k:'rev', label:'REV text', type:'text'},
   {k:'showTitle', label:'show title block', type:'check'},
 ]},
];

// ---------------- canvas + the faithful raster render (folded from the study) + the theta weave --
var CW=760,CH=528,S=2.0,MUT='#66707f',INK='#e6edf3';
var cv=document.getElementById('engC');cv.width=CW;cv.height=CH;
var c=cv.getContext('2d');
var img=c.createImageData(CW,CH),data=img.data;
var acc=new Float32Array(CW*CH*3),refl=new Float32Array(CW*CH*3);      // top phosphor + the reflection's phosphor
var dcv=document.createElement('canvas');dcv.width=CW;dcv.height=CH;var dctx=dcv.getContext('2d');   // reticule overlay
function circle(cx,cy,r,n){var q=[];for(var i=0;i<=n;i++){var a=-Math.PI/2+i/n*2*Math.PI;q.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return q;}
var AM=[240,169,74],BL=[90,167,232],GR=[74,222,128];
var LET=[
{col:AM,segs:[[[52,136],[52,80],[70,112],[88,80],[88,136]]]},
{col:BL,segs:[[[134,80],[100,80],[100,136],[134,136]],[[100,108],[126,108]]]},
{col:GR,segs:[[[148,80],[184,80]],[[166,80],[166,136]]]},
{col:GR,segs:[[[198,80],[232,80],[232,136],[198,136]],[[232,108],[206,108]]]},
{col:BL,segs:[circle(262,108,24,44)]},
{col:AM,segs:[[[296,136],[296,80],[318,80],[328.5,83.5],[332,94],[328.5,104.5],[318,108],[296,108]],[[310,108],[332,136]]]}
];
var PATH=[];
LET.forEach(function(L){L.segs.forEach(function(seg){for(var i=0;i<seg.length-1;i++){var a=seg[i],b=seg[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(d*S/1.2));for(var k=0;k<n;k++){var t=k/n;PATH.push({x:(a[0]+(b[0]-a[0])*t)*S,y:(a[1]+(b[1]-a[1])*t)*S,col:L.col});}}});});
var NP=PATH.length;
function depositTo(buf,cx,cy,col,amp,rad){var x0=Math.max(0,cx-rad|0),x1=Math.min(CW-1,cx+rad|0),y0=Math.max(0,cy-rad|0),y1=Math.min(CH-1,cy+rad|0),s2=2*(rad*0.5)*(rad*0.5);for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){var dx=x-cx,dy=y-cy,w=Math.exp(-(dx*dx+dy*dy)/s2)*amp;if(w<0.002)continue;var i=(y*CW+x)*3;buf[i]+=col[0]/255*w;buf[i+1]+=col[1]/255*w;buf[i+2]+=col[2]/255*w;}}
// signal = the wordmark (document grammar); signalM = its MIRROR grammar (flipped horizontally).
// the theta slider (0..1) WEAVES them across scanlines - the grammar-shift IS the interlace.
var signal=new Float32Array(CW*CH*3),signalM=new Float32Array(CW*CH*3);
function buildSignals(){signal.fill(0);signalM.fill(0);var rad=CFG.lineWidth;
  for(var pi=0;pi<NP;pi++){var q=PATH[pi];depositTo(signal,q.x,q.y,q.col,0.9,rad);}
  for(var yq=0;yq<CH;yq++)for(var xq=0;xq<CW;xq++){var i0=(yq*CW+xq)*3,j0=(yq*CW+(CW-1-xq))*3;signalM[i0]=signal[j0];signalM[i0+1]=signal[j0+1];signalM[i0+2]=signal[j0+2];}}
buildSignals();

// the reticule (axes/grid/title) — drawn to the overlay dc, composited over the render each frame.
function drawDoc(){var d=dctx,SEAM=CFG.seam,AMBER=CFG.cAmber,BLUE=CFG.cBlue,GREEN=CFG.cGreen;function X(v){return v*S;}
d.clearRect(0,0,CW,CH);
function ln(p1,p2,col,w,a){d.strokeStyle=col;d.globalAlpha=a==null?1:a;d.lineWidth=Math.max(.5,w*S);d.beginPath();d.moveTo(X(p1[0]),X(p1[1]));d.lineTo(X(p2[0]),X(p2[1]));d.stroke();d.globalAlpha=1;}
function chain(p1,p2,col,w,a){var x1=p1[0],y1=p1[1],x2=p2[0],y2=p2[1],L=Math.hypot(x2-x1,y2-y1),t=0,pat=[[9,1],[2,0],[1.2,1],[2,0]],pi=0;while(t<L){var seg=pat[pi%4][0],on=pat[pi%4][1];pi++;var t2=Math.min(L,t+seg);if(on)ln([x1+(x2-x1)*t/L,y1+(y2-y1)*t/L],[x1+(x2-x1)*t2/L,y1+(y2-y1)*t2/L],col,w,a);t=t2;}}
function arrow(x,y,dx,col,a){d.fillStyle=col;d.globalAlpha=a;d.beginPath();d.moveTo(X(x),X(y));d.lineTo(X(x+3.2*dx),X(y-1.1));d.lineTo(X(x+3.2*dx),X(y+1.1));d.fill();d.globalAlpha=1;}
function cross(x,y,r,col,a){ln([x-r,y],[x+r,y],col,.45,a);ln([x,y-r],[x,y+r],col,.45,a);}
function txt(x,y,s,col,px,al){d.fillStyle=col;d.globalAlpha=1;d.font=px*S+'px var(--font-mono)';d.textAlign=al||'center';d.textBaseline='middle';d.fillText(s,X(x),X(y));}
[[26,30],[354,30],[26,212],[354,212]].forEach(function(q){cross(q[0],q[1],4,MUT,.6);});
ln([166,28],[166,41],MUT,.45,.75);ln([190,28],[190,41],MUT,.45,.75);ln([166,34],[190,34],MUT,.45,.85);
arrow(166,34,1,MUT,.85);arrow(190,34,-1,MUT,.85);txt(203,34,'Δ24',MUT,9,'left');
chain([166,44],[166,206],CFG.cAxisAsym,CFG.axisAsymW,CFG.axisAsymA);txt(160,46,'σ',CFG.cAxisAsym,9,'right');
chain([190,44],[190,206],CFG.cAxisSym,CFG.axisSymW,CFG.axisSymA);
[[70,'+',AMBER],[117,'−',BLUE],[166,'0',GREEN],[215,'0',GREEN],[262,'−',BLUE],[313,'+',AMBER]].forEach(function(t){txt(t[0],56,t[1],t[2],12);});
[[20,'0'],[133,'1'],[247,'2'],[360,'10']].forEach(function(t){ln([t[0],SEAM/S-6],[t[0],SEAM/S],MUT,.5,.85);txt(t[0],SEAM/S-9.5,t[1],MUT,7.5);});
[58,96,171,209,285,322].forEach(function(x){ln([x,SEAM/S-3],[x,SEAM/S],MUT,.45,.6);});
d.globalAlpha=.38;d.strokeStyle=BLUE;d.setLineDash([3,4]);d.lineWidth=.6*S;d.beginPath();d.arc(X(262),X(108),X(24),0,7);d.stroke();d.setLineDash([]);d.globalAlpha=1;
txt(176,220,'σᵥ σₕ σᵥ σₕ D₂',MUT,12);txt(238,220,'C₁',AMBER,12);txt(190,236,'w = h/φ · λ = 530 ± 60 nm',MUT,12);
if(CFG.showTitle){ln([20,248],[360,248],MUT,.5,.78);ln([20,262],[360,262],MUT,.5,.78);ln([20,248],[20,262],MUT,.5,.78);ln([360,248],[360,262],MUT,.5,.78);[128,214,300].forEach(function(xv){ln([xv,248],[xv,262],MUT,.45,.6);});txt(74,255,'MET∃OR',MUT,7.5);txt(171,255,'THE GRAMMAR',MUT,7.5);txt(257,255,CFG.rev?('REV '+CFG.rev):'',MUT,7.5);txt(330,255,'f₀ 1.2 Hz',MUT,7.5);}}

// theta rides the top slider (0..1); drift auto-sweeps it. sound was tied to the old engine - hidden.
var s=document.getElementById('s'),out=document.getElementById('out'),db=document.getElementById('drift'),sb=document.getElementById('snd');
sb.style.display='none';
var drifting=false,phase=-Math.PI/2;
db.addEventListener('click',function(){drifting=!drifting;db.style.color=drifting?INK:CFG.cBlue;db.style.borderColor=drifting?INK:CFG.cBlue;});

var last=0,beamF=0,scanY=0,field=0;
function tf(ts){
requestAnimationFrame(tf);
var dt=last?Math.min(0.05,(ts-last)/1000):0.016;last=ts;
var SEAM=CFG.seam;
if(drifting){phase+=2*Math.PI/(40*60);s.value=0.5+0.5*Math.sin(phase);}
var th=parseFloat(s.value);                       // theta 0..1 = the weave balance (document <-> mirror)
var dR=Math.exp(-dt/CFG.tauR),dG=Math.exp(-dt/CFG.tauG),dB=Math.exp(-dt/CFG.tauB);
for(var i=0;i<acc.length;i+=3){acc[i]*=dR;acc[i+1]*=dG;acc[i+2]*=dB;}
if(CFG.mode==='vector'){
  var adv=CFG.beam*NP*dt,head=Math.min(NP,Math.ceil(adv));
  for(var st=0;st<head;st++){beamF+=adv/head;var idx=((beamF|0)%NP+NP)%NP,q=PATH[idx],isHead=(st===head-1),amp=isHead?1.6:0.5,rad=1.5+CFG.bloom*(isHead?2.2:1.1);depositTo(acc,q.x,q.y,q.col,amp,rad);}
} else {
  var a2=1.3*CFG.bloom;
  if(CFG.scanDir==='h'){
    var ny=scanY+CFG.raster*SEAM*dt;
    var SW=CFG.stripW;
    for(var yy=Math.floor(scanY);yy<Math.floor(ny);yy++){var yr=((yy%SEAM)+SEAM)%SEAM;if(CFG.interlace&&(yr&1)!==field)continue;
      var base=yr*CW*3;
      // CLEAN interlace: each vertical strip is document XOR mirror, never overlaid; theta = strip fill
      for(var x=0;x<CW;x++){var si=base+x*3;var sg=((x%SW)<th*SW)?signalM:signal;if(sg[si]+sg[si+1]+sg[si+2]<0.01)continue;acc[si]+=sg[si]*a2;acc[si+1]+=sg[si+1]*a2;acc[si+2]+=sg[si+2]*a2;}}
    scanY=ny;if(scanY>=SEAM){scanY-=SEAM;if(CFG.interlace)field^=1;}
  } else {
    var nx=scanY+CFG.raster*CW*dt,SW2=CFG.stripW;
    for(var xx=Math.floor(scanY);xx<Math.floor(nx);xx++){var xr=((xx%CW)+CW)%CW;if(CFG.interlace&&(xr&1)!==field)continue;
      var sig2=((xr%SW2)<th*SW2)?signalM:signal;   // clean per-column strip
      for(var yv=0;yv<SEAM;yv++){var si2=(yv*CW+xr)*3;if(sig2[si2]+sig2[si2+1]+sig2[si2+2]<0.01)continue;acc[si2]+=sig2[si2]*a2;acc[si2+1]+=sig2[si2+1]*a2;acc[si2+2]+=sig2[si2+2]*a2;}}
    scanY=nx;if(scanY>=CW){scanY-=CW;if(CFG.interlace)field^=1;}
  }
}
var kk=CFG.reflPersist;
for(var yb=SEAM;yb<CH;yb++){var my=2*SEAM-yb;if(my<0||my>=SEAM)continue;var d0=yb*CW*3,s0=my*CW*3;for(var xb=0;xb<CW;xb++){var d3=d0+xb*3,s3=s0+xb*3;refl[d3]+=(acc[s3]-refl[d3])*kk;refl[d3+1]+=(acc[s3+1]-refl[d3+1])*kk;refl[d3+2]+=(acc[s3+2]-refl[d3+2])*kk;}}
var exp=CFG.exposure,lines=CFG.lines,rb=CFG.reflect,horiz=(CFG.scanDir==='h'),raster=(CFG.mode==='raster');
var profY=new Float32Array(CH);for(var yy2=0;yy2<CH;yy2++){var fy=((yy2/CH)*lines)%1;profY[yy2]=0.35+0.65*Math.pow(Math.sin(Math.PI*fy),1.4);}
var profX=null;if(!horiz){profX=new Float32Array(CW);for(var xx2=0;xx2<CW;xx2++){var fx=((xx2/CW)*lines)%1;profX[xx2]=0.35+0.65*Math.pow(Math.sin(Math.PI*fx),1.4);}}
for(var y2=0;y2<CH;y2++){var bottom=(y2>=SEAM),py=profY[y2];
  for(var x2=0;x2<CW;x2++){var idx=(y2*CW+x2)*3,di=(y2*CW+x2)*4,prof=raster?(horiz?py:profX[x2]):1;var r,g,b;
    if(bottom){r=refl[idx]*rb;g=refl[idx+1]*rb;b=refl[idx+2]*rb;}else{r=acc[idx];g=acc[idx+1];b=acc[idx+2];}
    data[di]=255*(1-Math.exp(-r*exp))*prof;data[di+1]=255*(1-Math.exp(-g*exp))*prof;data[di+2]=255*(1-Math.exp(-b*exp))*prof;data[di+3]=255;}}
c.putImageData(img,0,0);
c.drawImage(dcv,0,0);                                             // reticule overlay
c.globalAlpha=Math.min(1,CFG.mirrorAxisOpacity*0.6);c.strokeStyle=MUT;c.lineWidth=1;c.beginPath();c.moveTo(0,SEAM+.5);c.lineTo(CW,SEAM+.5);c.stroke();c.globalAlpha=1;   // datum
var deg=Math.round(th*60-30);out.textContent='θ = '+(deg>0?'+':'')+deg+'° · '+(th<.3?'the grammar · document':(th>.7?'the mirror grammar':'the weave'));
}
requestAnimationFrame(tf);

// ---------------- persistence: the LIVE floor auto-saves + auto-restores (a refresh keeps your settings) ----------------
var DOC_PARAMS=['axisAsymA','axisAsymW','axisSymA','axisSymW','seam'];
var LSK_STATE='met3or_workbench_state';
(function restoreState(){try{var st=JSON.parse(localStorage.getItem(LSK_STATE)||'null');if(st&&st.cfg)Object.keys(DEFAULTS).forEach(function(k){if(st.cfg[k]!==undefined)CFG[k]=st.cfg[k];});}catch(e){}})();
drawDoc();
var _saveT=null;
function autosave(){if(_saveT)return;_saveT=setTimeout(function(){_saveT=null;try{localStorage.setItem(LSK_STATE,JSON.stringify({cfg:CFG}));}catch(e){}},350);}

// ---------------- the panel: composed from the EXACT kit devices, imported from the kit ----------------
// unified on createSmartParam (operator 162712/162722): the value rides [0,1] mapped to the real
// range; the operator sets min/max/default via the name's right-drag PROPERTIES menu (the kit's own
// config). wavelength = the kit selector, rev = the kit field, toggle = the kit toggle. No wrappers -
// pure composition, so when a device changes in the kit it changes here.
var dialsEl=document.getElementById('dials'),ctrls={};
Promise.all([
  import('../kit/src/smartparam.js'),import('../kit/src/selector.js'),
  import('../kit/src/field.js'),import('../kit/src/toggle.js')
]).then(function(m){
  var createSmartParam=m[0].createSmartParam,createSelector=m[1].createSelector,createField=m[2].createField,createToggle=m[3].createToggle;
  var WL=[['#f0a94a','amber +'],['#4ade80','green 0'],['#5aa7e8','blue −'],['#e6edf3','white']];
  GROUPS.forEach(function(G){
    var det=document.createElement('details');if(G.open)det.open=true;
    var sum=document.createElement('summary');sum.textContent=G.name;det.appendChild(sum);
    var body=document.createElement('div');body.style.cssText='padding:9px 12px 11px;display:flex;flex-direction:column;gap:9px';det.appendChild(body);
    G.dials.forEach(function(D){
      if(D.type==='wavelength'){
        var cur=WL.filter(function(w){return w[0]===CFG[D.k];})[0];
        var sel=createSelector({options:WL.map(function(w){return w[1];}),value:cur?cur[1]:WL[0][1],onChange:function(v,i){CFG[D.k]=WL[i][0];drawDoc();autosave();}});
        var lab=document.createElement('div');lab.style.cssText='color:var(--mut);font-size:10px';lab.textContent=D.label;
        body.append(lab,sel.el);ctrls[D.k]=sel;
      } else if(D.type==='text'){
        var fld=createField({label:D.label,value:CFG[D.k],onInput:function(s){CFG[D.k]=s;drawDoc();autosave();}});
        ctrls[D.k]=fld;body.appendChild(fld.el);
      } else if(D.type==='check'){
        var tg=createToggle({label:D.label,value:!!CFG[D.k],onChange:function(v){CFG[D.k]=v;drawDoc();autosave();}});
        ctrls[D.k]=tg;body.appendChild(tg.el);
      } else if(D.type==='select'){
        var curName=CFG[D.k];if(D.map)Object.keys(D.map).forEach(function(nm){if(D.map[nm]===CFG[D.k])curName=nm;});
        var ssel=createSelector({options:D.options,value:curName,onChange:function(v){CFG[D.k]=D.map?D.map[v]:v;autosave();}});
        var slab=document.createElement('div');slab.style.cssText='color:var(--mut);font-size:10px';slab.textContent=D.label;
        body.append(slab,ssel.el);ctrls[D.k]=ssel;
      } else {
        var lo=D.min,hi=D.max,sig=(hi>lo)?(CFG[D.k]-lo)/(hi-lo):0;
        var sp=createSmartParam({label:D.label,value:sig,default:sig,outMin:lo,outMax:hi,step:D.step/((hi-lo)||1),showMapped:true,
          format:function(v){return (Math.abs(v)>=100||Number.isInteger(v))?v.toFixed(0):v.toFixed(2);},
          onOutput:function(v){CFG[D.k]=v;if(D.rebuild)buildSignals();if(DOC_PARAMS.indexOf(D.k)>=0)drawDoc();autosave();}});
        sp.el.style.width='100%';ctrls[D.k]=sp;body.appendChild(sp.el);
      }
    });
    dialsEl.appendChild(det);
  });
}).catch(function(e){dialsEl.textContent='kit failed to load: '+((e&&e.message)||e);});

// ---------------- named presets (on top of the live auto-restore floor) ----------------
// applying a preset writes CFG + reloads: the kit devices rebuild from the restored floor
// (simple + correct, and the page hot-reloads anyway).
var LSK='met3or_workbench_presets';
function presets(){try{return JSON.parse(localStorage.getItem(LSK)||'{}');}catch(e){return {};}}
function refreshLoad(){var sel=document.getElementById('preset-load');sel.innerHTML='<option value="">load…</option>';var P=presets();Object.keys(P).forEach(function(nme){var o=document.createElement('option');o.value=nme;o.textContent=nme;sel.appendChild(o);});}
function applyCFG(src){var next=Object.assign({},CFG);Object.keys(DEFAULTS).forEach(function(k){if(src[k]!==undefined)next[k]=src[k];});try{localStorage.setItem(LSK_STATE,JSON.stringify({cfg:next}));}catch(e){}location.reload();}
document.getElementById('preset-save').addEventListener('click',function(){var nme=(document.getElementById('preset-name').value||'').trim();if(!nme){alert('name the preset first');return;}var P=presets();P[nme]={};Object.keys(DEFAULTS).forEach(function(k){P[nme][k]=CFG[k];});localStorage.setItem(LSK,JSON.stringify(P));refreshLoad();document.getElementById('preset-load').value=nme;});
document.getElementById('preset-load').addEventListener('change',function(){var nme=this.value;if(!nme)return;var P=presets();if(P[nme])applyCFG(P[nme]);});
document.getElementById('preset-reset').addEventListener('click',function(){applyCFG(DEFAULTS);});
document.getElementById('preset-export').addEventListener('click',function(){var blob=new Blob([JSON.stringify(CFG,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='met3or-preset.json';a.click();});
document.getElementById('preset-import').addEventListener('click',function(){document.getElementById('preset-file').click();});
document.getElementById('preset-file').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{applyCFG(JSON.parse(rd.result));}catch(err){alert('not a valid preset');}};rd.readAsText(f);});
refreshLoad();
})();
</script>
<script>
// dev hot-reload (operator 154906: "it hot reloads, that's the kit"): poll this file + the kit
// devices; reload on change. Safe because the live floor auto-restores on reload. Inert off localhost.
(function(){
  if(location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return;
  var files=['workbench.html','../kit/src/smartparam.js','../kit/src/scrub.js','../kit/src/menu.js','../kit/src/selector.js','../kit/src/field.js','../kit/src/toggle.js'];
  var seen={};
  setInterval(function(){files.forEach(function(f){fetch(f,{method:'HEAD',cache:'no-store'}).then(function(r){var tag=r.headers.get('Last-Modified')||r.headers.get('ETag')||'';if(seen[f]===undefined){seen[f]=tag;return;}if(tag!==seen[f])location.reload();}).catch(function(){});});},1000);
})();
</script>
</body>
