<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lattice</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c11; --panel: #13161d; --cell-bg: #15191f;
  --ink: #e8ebf0; --dim: #6f7785; --faint: #454d5c; --line: #232834;
  --b0: #4488cc; --b1: #44cc66; --b2: #cc8844;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: 'DM Mono', ui-monospace, monospace;
  line-height: 1.4; height: 100vh;
  display: flex; flex-direction: column;
}
/* ---- HUD: single band ---- */
.hud {
  display: flex; align-items: center;
  padding: 12px 24px; flex-shrink: 0;
  border-bottom: 1px solid var(--line);
  position: relative;
}
/* left cluster: title, tabs, triad, utils */
.hud-left {
  display: flex; flex-direction: column; gap: 4px;
  flex-shrink: 0;
}
.hud-left-row {
  display: flex; gap: 4px; align-items: baseline;
}
.hud-left h1 {
  font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500;
  color: var(--dim); margin-right: 12px; letter-spacing: .02em;
}
.view-tab {
  font: 500 11px 'DM Mono', monospace;
  background: transparent; border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 12px; cursor: pointer;
  color: var(--faint); transition: all .15s; letter-spacing: .03em;
}
.view-tab:hover { border-color: var(--faint); color: var(--dim); }
.view-tab.active { color: var(--ink); }
.view-tab[data-v="0"].active { border-color: var(--b0); background: #0d1520; }
.view-tab[data-v="1"].active { border-color: var(--b1); background: #0d1a10; }
.view-tab[data-v="2"].active { border-color: var(--b2); background: #1a150d; }
.tab-utils {
  display: flex; gap: 4px; align-items: center; margin-left: 4px;
}
.refresh-btn {
  background: transparent; border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 7px; cursor: pointer; color: var(--faint);
  font-size: 11px; line-height: 1; transition: all .15s;
}
.refresh-btn:hover { color: var(--dim); border-color: var(--faint); }
/* center cluster: shortcuts above counter, true center via absolute positioning */
.hud-center {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
}

/* ---- views ---- */
.view { display: none; }
.view.active { display: block; }

/* ======== VIEW 0: SPECIFICATION ======== */
#view-0.active {
  display: flex; flex-direction: row;
  flex: 1; min-height: 0;
}
/* sidebar: file browser */
.v0-sidebar {
  width: 220px; min-width: 180px; flex-shrink: 0;
  border-right: 1px solid var(--line);
  overflow-y: auto; padding: 12px 0;
  display: flex; flex-direction: column;
}
/* editor pane */
.v0-editor {
  flex: 1; min-width: 0; overflow-y: auto;
  display: flex; flex-direction: column;
}
/* selector */
.v0-selector {
  display: flex; flex-direction: column; gap: 3px;
  padding: 8px 24px 0;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.v0-selector.v0-collapsed .v0-sel-row { display: none; }
.v0-sel-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 0 4px;
}
.v0-sel-modes {
  display: flex; gap: 2px;
}
.v0-sel-mode {
  font: 500 9px 'DM Mono', monospace; padding: 2px 8px;
  border: 1px solid var(--line); border-radius: 4px;
  background: transparent; color: var(--faint); cursor: pointer;
}
.v0-sel-mode:hover { color: var(--dim); border-color: var(--faint); }
.v0-sel-mode.on { color: var(--ink); border-color: var(--dim); background: #1a1e27; }
.v0-sel-toggle {
  font-size: 8px; color: var(--faint); cursor: pointer; user-select: none;
  padding: 4px 7px; border: 1px solid var(--line); border-radius: 3px;
  background: transparent; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; min-height: 16px; gap: 4px;
}
.v0-sel-toggle:hover { color: var(--dim); background: #1e2230; border-color: var(--faint); }
.v0-sel-row {
  display: flex; gap: 4px;
}
/* branch group: branch label on top, leaves below */
.v0-sel-group {
  flex: 1; min-width: 0; container-type: inline-size;
  display: flex; flex-direction: column; gap: 2px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); padding: 3px 4px;
  transition: all .12s;
}
.v0-sel-group[data-b="0"] { border-color: var(--b0); }
.v0-sel-group[data-b="1"] { border-color: var(--b1); }
.v0-sel-group[data-b="2"] { border-color: var(--b2); }
/* branch bar: label + fold arrow, clickable for selection */
.v0-sel-branchbar {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  cursor: pointer; user-select: none;
  padding: 1px 4px; border-radius: 3px; transition: background .1s;
  font-size: clamp(8px, 3cqi, 11px);
}
.v0-sel-branchbar:hover { background: #1e2230; }
.v0-sel-branchbar.sel { background: #1a1e27; }
.v0-sel-branchbar.sel[data-b="0"] { box-shadow: 0 0 6px -2px var(--b0); }
.v0-sel-branchbar.sel[data-b="1"] { box-shadow: 0 0 6px -2px var(--b1); }
.v0-sel-branchbar.sel[data-b="2"] { box-shadow: 0 0 6px -2px var(--b2); }
/* leaf items below branch label */
.v0-sel-leaves { display: flex; gap: 2px; }
.v0-sel-item {
  flex: 1; min-width: 0;
  border: 1px solid var(--line); border-radius: 4px;
  background: transparent; overflow: hidden;
  padding: 2px 5px;
  display: flex; align-items: baseline; gap: 4px;
  cursor: pointer; user-select: none; transition: all .12s;
}
.v0-sel-item:hover { background: #161a22; }
.v0-sel-item.sel { border-width: 2px; }
.v0-sel-item.sel[data-b="0"] { border-color: var(--b0); box-shadow: 0 0 6px -3px var(--b0); }
.v0-sel-item.sel[data-b="1"] { border-color: var(--b1); box-shadow: 0 0 6px -3px var(--b1); }
.v0-sel-item.sel[data-b="2"] { border-color: var(--b2); box-shadow: 0 0 6px -3px var(--b2); }
.v0-sel-d { font-size: clamp(8px, 3cqi, 11px); font-weight: 700; flex-shrink: 0; }
.v0-sel-label { font-size: clamp(7px, 2.5cqi, 10px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.v0-sel-label .vb { font-weight: 600; }
.v0-sel-fold {
  font-size: 7px; color: var(--faint); flex-shrink: 0; margin-left: auto;
  padding: 4px 7px; border: 1px solid var(--line); border-radius: 3px;
  cursor: pointer; background: transparent; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  min-width: 18px; min-height: 16px;
}
.v0-sel-fold:hover { color: var(--dim); background: #1e2230; border-color: var(--faint); }
/* leaf wrapper: leaf item + cells stacked */
.v0-sel-leafwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
/* cells inside leaf */
.v0-sel-cellrow {
  display: flex; gap: 2px;
  border: 1px solid var(--line); border-radius: 5px;
  padding: 3px; background: var(--panel);
}
.v0-sel-cellrow[data-l="0"] { border-color: var(--b0); }
.v0-sel-cellrow[data-l="1"] { border-color: var(--b1); }
.v0-sel-cellrow[data-l="2"] { border-color: var(--b2); }
.v0-sel-cell {
  flex: 1; min-width: 0; padding: 2px 4px;
  border: 1px solid transparent; border-radius: 3px;
  background: transparent; cursor: pointer; text-align: center;
  overflow: hidden; transition: all .12s;
}
.v0-sel-cell:hover { background: #1a1e27; }
.v0-sel-cell.sel[data-l="0"] { border-color: var(--b0); background: #1a1e27; box-shadow: 0 0 6px -3px var(--b0); }
.v0-sel-cell.sel[data-l="1"] { border-color: var(--b1); background: #1a1e27; box-shadow: 0 0 6px -3px var(--b1); }
.v0-sel-cell.sel[data-l="2"] { border-color: var(--b2); background: #1a1e27; box-shadow: 0 0 6px -3px var(--b2); }
.v0-sel-cd { font-size: clamp(7px, 2.5cqi, 9px); font-weight: 500; }
.v0-sel-cv { font-size: clamp(7px, 2.5cqi, 10px); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* microscope — legacy class, kept for sub-element styles */
.v0-scope {
  flex: 1; overflow-y: auto; padding: 20px 24px;
}
/* sidebar file list */
.v0-sidebar-title {
  font: 500 9px 'DM Mono', monospace; color: var(--faint);
  letter-spacing: .1em; text-transform: uppercase;
  padding: 0 14px 8px; border-bottom: 1px solid var(--line);
  flex-shrink: 0; display: flex; align-items: baseline; gap: 4px;
}
.v0-new-btn {
  margin-left: auto; font-size: 11px; font-weight: 700;
  color: var(--faint); cursor: pointer; padding: 0 4px;
  border: 1px solid var(--line); border-radius: 3px;
  line-height: 1.3; transition: all .12s; text-transform: none;
}
.v0-new-btn:hover { color: var(--b1); border-color: var(--b1); background: #0d1a10; }
.v0-sidebar .v0-scope-filelist {
  padding: 6px 10px 0; margin: 0;
}
.v0-sidebar .v0-scope-filelist li {
  padding: 2px 4px; border-radius: 3px;
}
/* B10: press-drag on file rows must not sweep-select the whole list.
   user-select:all = one click grabs exactly one whole filename (copy-ready),
   no character sweep across rows. Covers both V0 sidebar and V2 (same markup). */
.v0-scope-filelist li, .v2-file-item { user-select: all; }
.v0-sidebar .v0-scope-filelist li.loadable:hover { background: #1a1e27; }
.v0-sidebar .v0-scope-filelist li.loaded { background: #0d1a10; }
.v0-scope-addr {
  font: 700 16px 'DM Mono', monospace; letter-spacing: .1em; margin-bottom: 14px;
}
.v0-scope-grid {
  display: grid; grid-template-columns: auto 1fr;
  gap: 3px 14px; font-size: 11px; color: var(--dim); line-height: 1.7;
  margin-bottom: 16px;
}
.v0-scope-grid .l { color: var(--faint); text-align: right; font-size: 10px; }
.v0-scope-triad-title {
  font-size: 9px; color: var(--faint); letter-spacing: .1em;
  text-transform: uppercase; margin-bottom: 5px;
}
.v0-scope-triad {
  display: flex; gap: 8px; align-items: baseline; font-size: 16px; margin-bottom: 14px;
}
.v0-scope-triad .sep { color: var(--faint); font-size: 11px; }
.v0-scope-triad .n, .v0-scope-triad .m { color: #8a93a3; }
.v0-scope-triad .v { font-weight: 700; }
.v0-scope-pos {
  font-size: 10px; color: var(--dim); line-height: 1.8;
  padding: 10px 0; border-top: 1px solid var(--line); margin-bottom: 12px;
}
.v0-scope-pos .l { color: var(--faint); }
.v0-scope-regs { display: flex; gap: 6px; margin-bottom: 16px; }
.v0-scope-reg {
  font-size: 9px; padding: 3px 10px; border-radius: 10px;
  border: 1px solid var(--line); color: var(--dim);
}
.v0-scope-reg.on { font-weight: 700; }
.v0-scope-reg.r0.on { border-color: var(--b0); color: var(--b0); background: #0d1520; }
.v0-scope-reg.r1.on { border-color: var(--b1); color: var(--b1); background: #0d1a10; }
.v0-scope-reg.r2.on { border-color: var(--b2); color: var(--b2); background: #1a150d; }
.v0-scope-label {
  font-size: 11px; color: var(--dim); padding: 8px 0;
  border-top: 1px solid var(--line); margin-bottom: 10px;
}
/* file count badges in selector */
.v0-sel-fc {
  font-size: 8px; color: var(--dim); background: #1e2230; border-radius: 8px;
  padding: 1px 5px; flex-shrink: 0; font-weight: 600; letter-spacing: .02em;
}
/* file list */
.v0-scope-files {
  padding-top: 8px;
}
.v0-scope-files-title {
  font-size: 9px; color: var(--faint); letter-spacing: .1em; text-transform: uppercase;
}
.v0-scope-filelist {
  list-style: none; padding: 6px 0 0 0; margin: 0;
  font-size: 10px; color: var(--dim); line-height: 1.8;
}
.v0-scope-filelist li { cursor: default; }
.v0-scope-filelist li::before { content: '\203A '; color: var(--faint); }
.v0-scope-filelist li.loadable { cursor: pointer; }
.v0-scope-filelist li.loadable:hover { color: var(--ink); }
.v0-scope-filelist li.loaded { color: var(--b1); }
/* document group badges */
.v0-fold-badge {
  font-size: 7px; color: var(--dim); background: #1a1e27;
  border-radius: 3px; padding: 1px 4px; margin-left: 6px;
  font-weight: 600; letter-spacing: .03em; vertical-align: 1px;
  cursor: pointer; transition: all .12s;
}
.v0-fold-badge:hover { color: var(--ink); background: #252a35; }
.v0-fold-count {
  font-size: 7px; color: var(--faint); margin-left: 2px;
  vertical-align: 1px;
}
/* fold history sub-list */
.v0-fold-history {
  list-style: none; padding: 0 0 0 10px; margin: 0;
  font-size: 9px; line-height: 1.7; color: var(--faint);
  border-left: 1px solid var(--line); margin-left: 6px;
}
.v0-fold-history li { cursor: pointer; padding: 1px 4px; border-radius: 2px; }
.v0-fold-history li::before { content: ''; }
.v0-fold-history li:hover { color: var(--dim); background: #161a22; }
.v0-fold-history li.loaded { color: var(--b1); }
.v0-fold-history li.current { color: var(--dim); font-weight: 600; }
/* file reader/editor panel — fills the editor pane */
.v0-reader {
  flex: 1; display: flex; flex-direction: column;
  border-left: 0; background: var(--panel); overflow: hidden;
}
.v0-reader-body { flex: 1; overflow-y: auto; }
.v0-reader-editor { flex: 1; min-height: 0; resize: none; }
.v0-reader-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; border-bottom: 1px solid var(--line);
  font-size: 9px; color: var(--faint); letter-spacing: .05em;
}
.v0-reader-close, .v0-reader-edit, .v0-reader-save, .v0-reader-cancel, .v0-reader-fold, .v0-reader-del {
  cursor: pointer; padding: 2px 6px; border-radius: 3px;
}
.v0-reader-close:hover, .v0-reader-edit:hover, .v0-reader-cancel:hover { background: #1e2230; color: var(--dim); }
.v0-reader-edit { color: var(--faint); margin-left: auto; margin-right: 4px; }
.v0-reader-fold { color: var(--b2); margin-right: 4px; }
.v0-reader-fold:hover { background: #1a150d; color: var(--b2); }
.v0-reader-del { color: var(--faint); margin-right: 4px; }
.v0-reader-del:hover { background: #1a0d0d; color: #cc4444; }
.v0-reader-save { color: var(--b1); margin-left: auto; margin-right: 4px; }
.v0-reader-save:hover { background: #0d1a10; color: var(--b1); }
.v0-reader-cancel { color: var(--faint); margin-right: 4px; }
.v0-reader-body {
  padding: 12px 16px; font: 11px/1.7 'DM Mono', monospace; color: var(--dim);
  white-space: pre-wrap; word-wrap: break-word;
}
.v0-reader-editor {
  width: 100%; min-height: 300px; padding: 12px 16px;
  background: var(--bg); color: var(--ink); border: none; outline: none; resize: vertical;
  font: 11px/1.7 'DM Mono', monospace; tab-size: 2;
}
.tray-popup-editor {
  width: 100%; min-height: 200px; padding: 12px 16px;
  background: var(--bg); color: var(--ink); border: none; outline: none; resize: vertical;
  font: 11px/1.7 'DM Mono', monospace; tab-size: 2;
}
.v0-reader-body h1 { font-size: 14px; color: var(--ink); margin: 16px 0 8px; font-weight: 700; }
.v0-reader-body h2 { font-size: 12px; color: var(--ink); margin: 14px 0 6px; font-weight: 700; }
.v0-reader-body h3 { font-size: 11px; color: var(--ink); margin: 12px 0 4px; font-weight: 700; }
.v0-reader-body h4 { font-size: 11px; color: var(--dim); margin: 10px 0 4px; font-weight: 600; }
.v0-reader-body strong { color: var(--ink); }
.v0-reader-body em { font-style: italic; color: #8a93a3; }
.v0-reader-body code { background: #111118; padding: 1px 4px; border-radius: 3px; font-size: 10px; }
.v0-reader-body pre { background: #111118; padding: 8px 10px; border-radius: 5px; margin: 8px 0; overflow-x: auto; }
.v0-reader-body table { border-collapse: collapse; margin: 8px 0; font-size: 10px; }
.v0-reader-body th, .v0-reader-body td { border: 1px solid var(--line); padding: 3px 8px; }
.v0-reader-body th { background: #111118; color: var(--ink); font-weight: 600; }

/* ======== VIEW 1: OPERATION ======== */
#view-1 { display: none; }
#view-1.active {
  display: flex; flex-direction: column;
  flex: 1; min-height: 0;
}

/* address counter */
.w-addr-bar {
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.nav-addr { display: flex; gap: 4px; align-items: center; }
.nav-digit {
  font: 700 28px 'DM Mono', monospace; cursor: pointer;
  width: 40px; height: 48px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 8px; background: var(--cell-bg);
  color: var(--ink); transition: all .15s; user-select: none; position: relative;
}
.nav-digit:hover { border-color: var(--faint); background: #1a1e27; }
.nav-digit.d0 { color: var(--b0); border-color: color-mix(in srgb, var(--b0) 40%, transparent); }
.nav-digit.d1 { color: var(--b1); border-color: color-mix(in srgb, var(--b1) 40%, transparent); }
.nav-digit.d2 { color: var(--b2); border-color: color-mix(in srgb, var(--b2) 40%, transparent); }
.nav-digit.off { opacity: .15; pointer-events: none; }
.nav-depth-btn {
  font: 500 14px 'DM Mono', monospace; width: 28px; height: 28px;
  background: transparent; border: 1px solid var(--line); border-radius: 6px;
  color: var(--faint); cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.nav-depth-btn:hover { color: var(--dim); border-color: var(--faint); }
.nav-depth-btn:disabled { opacity: .15; cursor: default; }

/* HUD triad — in the tab row, right side */
.hud-triad {
  display: flex; align-items: baseline; gap: 2px;
  font: 500 12px 'DM Mono', monospace; color: var(--dim);
  white-space: nowrap;
}
.hud-triad .ht-n, .hud-triad .ht-m { color: var(--faint); font-size: 10px; }
.hud-triad .ht-v { font-weight: 700; font-size: 14px; }
.hud-triad .ht-sep { color: var(--faint); font-size: 9px; margin: 0 1px; }

/* shortcuts row */
.hud-shortcuts {
  display: flex; align-items: center; justify-content: center; gap: 3px;
}
.hud-sc {
  font: 500 10px 'DM Mono', monospace; padding: 2px 7px;
  background: transparent; border: 1px solid var(--line); border-radius: 4px;
  color: var(--faint); cursor: pointer; transition: all .12s;
  letter-spacing: .04em;
}
.hud-sc:hover { color: var(--dim); border-color: var(--faint); }
.hud-sc.active { color: var(--ink); border-color: var(--dim); background: #1a1e27; }
.hud-sc-sep { width: 8px; }

/* sticky tray — top right */
.hud-tray {
  position: fixed; top: 10px; right: 60px;
  display: flex; gap: 4px; z-index: 90;
}
.tray-slot {
  width: 80px; height: 28px;
  border: 1px dashed var(--line); border-radius: 4px;
  background: var(--bg); color: var(--faint);
  font: 500 8px 'DM Mono', monospace;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 0 4px; cursor: default; transition: all .12s;
}
.tray-slot.filled {
  border-style: solid; border-color: var(--faint); color: var(--dim);
  cursor: pointer;
}
.tray-slot.filled:hover { border-color: var(--ink); color: var(--ink); }
/* tray clear-all button */
.tray-clear {
  width: 20px; height: 28px;
  border: 1px solid var(--line); border-radius: 4px;
  background: transparent; color: var(--faint);
  font: 500 11px 'DM Mono', monospace;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.tray-clear:hover { color: #cc4444; border-color: #cc4444; }
/* tray popup reader */
.tray-popup {
  position: fixed; top: 50px; right: 60px;
  width: 480px; max-height: 70vh;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; z-index: 95; display: flex; flex-direction: column;
  box-shadow: 0 12px 40px -10px #000;
}
.tray-popup-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  font: 500 10px 'DM Mono', monospace; color: var(--dim);
}
.tray-popup-bar .addr { color: var(--faint); margin-right: 6px; }
.tray-popup-close {
  cursor: pointer; padding: 2px 6px; border-radius: 3px;
  color: var(--faint); font-size: 13px;
}
.tray-popup-close:hover { background: #1e2230; color: var(--ink); }
.tray-popup-body {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  font: 11px/1.7 'DM Mono', monospace; color: var(--dim);
  white-space: pre-wrap; word-wrap: break-word;
}
.tray-popup-body h1 { font-size: 14px; color: var(--ink); margin: 16px 0 8px; font-weight: 700; }
.tray-popup-body h2 { font-size: 12px; color: var(--ink); margin: 14px 0 6px; font-weight: 700; }
.tray-popup-body h3 { font-size: 11px; color: var(--ink); margin: 12px 0 4px; font-weight: 700; }
.tray-popup-body h4 { font-size: 11px; color: var(--dim); margin: 10px 0 4px; font-weight: 600; }
.tray-popup-body strong { color: var(--ink); }
.tray-popup-body em { font-style: italic; color: #8a93a3; }
.tray-popup-body code { background: #111118; padding: 1px 4px; border-radius: 3px; font-size: 10px; }
.tray-popup-body pre { background: #111118; padding: 8px 10px; border-radius: 5px; margin: 8px 0; overflow-x: auto; }
.tray-popup-body table { border-collapse: collapse; margin: 8px 0; font-size: 10px; }
.tray-popup-body th, .tray-popup-body td { border: 1px solid var(--line); padding: 3px 8px; }
.tray-popup-body th { background: #111118; color: var(--ink); font-weight: 600; }
.tray-popup-img { max-width: 100%; height: auto; border-radius: 4px; }

/* status pulse */
.hud-pulse {
  position: fixed; top: 12px; right: 24px;
  font: 500 10px 'DM Mono', monospace; color: var(--b1);
  opacity: 0; transition: opacity .15s;
  pointer-events: none; z-index: 100;
  letter-spacing: .03em;
}
.hud-pulse.show { opacity: 1; }
.hud-pulse.fade { opacity: 0; transition: opacity .8s; }

/* three-column stage */
.w-stage {
  flex: 2; display: flex; align-items: stretch;
  width: 100%; padding: 16px 20px; gap: 0;
  min-height: 200px;
}
.w-col {
  display: flex; align-items: center; justify-content: center;
  min-width: 0;
}

/* left column: identity */
.w-col-id {
  flex: 1; flex-direction: column; justify-content: center; align-items: center;
  padding: 0 16px;
}
.w-id-full {
  font: 700 13px 'DM Mono', monospace; letter-spacing: .1em; margin-bottom: 12px;
  text-align: center;
}
.w-id-grid {
  display: grid; grid-template-columns: auto 1fr;
  gap: 2px 12px; font-size: 10px; color: var(--dim); line-height: 1.7;
}
.w-id-grid .l { color: var(--faint); text-align: right; font-size: 9px; }
.w-id-regs {
  display: flex; gap: 6px; margin-top: 10px; justify-content: center;
}
.w-id-reg {
  font-size: 9px; padding: 2px 8px; border-radius: 10px;
  border: 1px solid var(--line); color: var(--dim);
}
.w-id-reg.on { font-weight: 700; }
.w-id-reg.r0.on { border-color: var(--b0); color: var(--b0); }
.w-id-reg.r1.on { border-color: var(--b1); color: var(--b1); }
.w-id-reg.r2.on { border-color: var(--b2); color: var(--b2); }
.w-id-files { font-size: 10px; color: var(--faint); margin-top: 10px; }

/* ratio line */
.w-ratio-line {
  width: 100%; margin-top: 14px; position: relative; height: 24px;
}
.w-ratio-track {
  position: absolute; top: 11px; left: 0; right: 0; height: 1px;
  background: var(--line);
}
.w-ratio-tick {
  position: absolute; top: 7px; width: 1px; height: 9px;
  background: var(--faint); opacity: .25;
}
.w-ratio-tick.on {
  opacity: 1; width: 3px; margin-left: -1px; height: 13px; top: 5px;
  border-radius: 1px;
}
.w-ratio-center {
  position: absolute; top: 4px; width: 1px; height: 15px;
  background: var(--faint); opacity: .12; left: 50%;
}
.w-ratio-bound {
  position: absolute; top: 8px; width: 1px; height: 7px;
  background: var(--faint); opacity: .08;
}
/* C4: the ratio is [0,1) — 0 is reachable (origin, exact), 1 is approached, never reached */
.w-ratio-bound.reach { opacity: .4; }
.w-ratio-bound.open {
  background: none; border-left: 1px dashed var(--faint); opacity: .5;
}
.w-ratio-labels {
  display: flex; justify-content: space-between;
  font-size: 7px; color: var(--faint); opacity: .5;
  position: absolute; top: 20px; left: 0; right: 0;
}
/* server-unreachable banner — a dead server otherwise renders a confident empty lattice */
.net-banner {
  display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
  background: #2a1416; color: #ff9b9b; border-bottom: 1px solid #cc4444;
  font: 500 10px 'DM Mono', monospace; text-align: center; padding: 4px 8px;
  letter-spacing: .03em;
}
.net-banner.show { display: block; }

/* center column: card */
.w-col-card { flex: 1; justify-content: center; align-items: center; }
.w-card {
  border: 1px solid var(--line); border-radius: 18px;
  background: var(--panel); display: flex; flex-direction: column;
  justify-content: center; align-items: center; text-align: center;
  position: relative; transition: width .4s cubic-bezier(.4,.1,.25,1), max-width .4s cubic-bezier(.4,.1,.25,1), height .4s cubic-bezier(.4,.1,.25,1), max-height .4s cubic-bezier(.4,.1,.25,1), border-color .2s, box-shadow .2s;
  box-shadow: 0 18px 50px -28px #000; padding: 16px 24px;
}
.w-card.b0 { border-left: 4px solid var(--b0); box-shadow: 0 18px 50px -28px #000, inset 0 0 0 1px color-mix(in srgb, var(--b0) 18%, transparent); }
.w-card.b1 { border-left: 4px solid var(--b1); box-shadow: 0 18px 50px -28px #000, inset 0 0 0 1px color-mix(in srgb, var(--b1) 18%, transparent); }
.w-card.b2 { border-left: 4px solid var(--b2); box-shadow: 0 18px 50px -28px #000, inset 0 0 0 1px color-mix(in srgb, var(--b2) 18%, transparent); }
.w-noun, .w-mod { color: #8a93a3; transition: font-size .25s; }
.w-verb { font-weight: 700; transition: font-size .25s; }

/* right column: rings + map stacked, even spacing */
.w-col-pos {
  flex: 1; flex-direction: column; justify-content: space-evenly; align-items: center;
}
.nav-rings { display: flex; align-items: center; justify-content: center; }
.nav-rings svg { display: block; }
.ring-seg { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; transition: all .2s; }
.ring-seg.on { stroke-width: 2.5; }
.ring-seg.b0.on { stroke: var(--b0); }
.ring-seg.b1.on { stroke: var(--b1); }
.ring-seg.b2.on { stroke: var(--b2); }
.ring-seg.inactive { opacity: .15; }

.w-minimap { display: flex; gap: 32px; justify-content: center; align-items: flex-start; }
.w-tree { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.w-tree-label { font-size: 8px; color: var(--faint); letter-spacing: .06em; }
.w-map-row { display: flex; justify-content: center; }
.w-leaf-row { gap: 16px; }
.w-cell-row { gap: 10px; }
.w-cell-group { display: flex; gap: 5px; }
.w-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; opacity: .14; cursor: pointer; transition: all .18s;
}
.w-dot.sm { width: 10px; height: 10px; }
.w-dot:hover { opacity: .4; }
.w-dot.on { opacity: 1; transform: scale(1.3); }
.w-dot.dim { opacity: .5; }
.w-tree.b0 .w-dot.on, .w-tree.b0 .w-dot.dim { background: var(--b0); }
.w-tree.b1 .w-dot.on, .w-tree.b1 .w-dot.dim { background: var(--b1); }
.w-tree.b2 .w-dot.on, .w-tree.b2 .w-dot.dim { background: var(--b2); }

/* lower panel: verb grid + sierpinski */
.w-lower {
  flex: 1; min-height: 120px;
  display: flex; gap: 20px; align-items: stretch;
  padding: 0 20px 12px; overflow: hidden;
}
/* verb grid: 3 branches side by side */
.w-verb-grid {
  flex: 3; display: flex; gap: 6px; min-width: 0;
}
.w-verb-branch {
  flex: 1; display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 2px; align-content: start;
}
.w-verb-branch-label {
  grid-column: 1 / -1; font-size: 8px; color: var(--faint);
  letter-spacing: .06em; text-align: center; padding: 2px 0 4px;
  text-transform: uppercase;
}
.w-verb-cell {
  padding: 4px 2px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--cell-bg);
  text-align: center; cursor: pointer; transition: all .15s;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  min-width: 0; overflow: hidden;
}
.w-verb-cell:hover { background: #1a1e27; border-color: var(--faint); }
.w-verb-cell.current { background: #1a1e27; }
.w-vc-digits { font-size: 7px; color: var(--faint); font-weight: 600; letter-spacing: .05em; }
.w-vc-verb { font-size: 9px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.w-vc-noun { font-size: 7px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
/* sierpinski triangle */
.w-sierpinski {
  flex: 0 0 220px;
  display: flex; align-items: center; justify-content: center;
}
.w-sierpinski svg { display: block; }

/* ======== VIEW 2: WAREHOUSE ======== */
#view-2 { flex: 1; min-height: 0; overflow: hidden; }
#view-2.active { display: flex; flex-direction: column; }
.v2-layout { flex: 1; display: flex; gap: 0; min-height: 0; overflow: hidden; }

/* files panel (left) — mirrors V0 sidebar with V2 color accent */
.v2-files-col { width: 240px; flex-shrink: 0; border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 0; }
.v2-files-col .v0-sidebar-title { color: var(--b2); }
.v2-files-col .v0-scope-filelist li.loaded { background: #1a150d; }
.v2-files-col .v0-fold-badge { color: var(--b2); }
.v2-section { padding: 10px 0; }
.v2-section + .v2-section { border-top: 1px solid var(--line); }
.v2-section-title {
  font: 500 9px 'DM Mono', monospace; color: var(--faint);
  letter-spacing: .1em; text-transform: uppercase; padding: 0 14px 6px;
}
.v2-file-item {
  padding: 3px 14px; font-size: 10px; color: var(--dim);
  cursor: pointer; transition: all .12s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.v2-file-item::before { content: '\203A '; color: var(--faint); }
.v2-file-item:hover { background: #1a1e27; color: var(--ink); }
.v2-file-item.selected { background: #1a150d; color: var(--b2); border-right: 2px solid var(--b2); }
.v2-file-item.selected::before { color: var(--b2); }
.v2-empty { padding: 6px 14px; font-size: 10px; color: var(--faint); font-style: italic; }

/* the spinor — a loading spinner that is actually a spinor: it takes 720deg, not
   360deg, to return to itself. the ring rotates two full turns per cycle while its
   phase (brightness+hue) completes only ONE turn — half the angular rate, the 1/2
   of spin-1/2. so after one geometric turn (360deg, mid-cycle) it is NOT home: the
   phase is inverted (the -1). only after the second turn (720deg) does it return.
   the SU(2) double cover, made visible. (purely cosmetic; the period is imperceptible
   on a sub-second load — it is here because it is true, not because it is felt.) */
.spinor-box { display: inline-flex; align-items: center; gap: 7px; }
.spinor-label { font-size: 10px; color: var(--faint); font-style: italic; }
.spinor {
  width: 13px; height: 13px; border-radius: 50%; flex: none;
  border: 2px solid var(--line); border-top-color: var(--b2);
  animation: spinor-turn 1.4s linear infinite, spinor-phase 1.4s linear infinite;
}
@keyframes spinor-turn { from { transform: rotate(0deg); } to { transform: rotate(720deg); } }
@keyframes spinor-phase {       /* one phase cycle per two geometric turns — the 1/2 */
  0%   { filter: hue-rotate(0deg)   brightness(1); }
  50%  { filter: hue-rotate(180deg) brightness(0.5); }   /* 360deg spun, phase = -1: not home */
  100% { filter: hue-rotate(360deg) brightness(1); }      /* 720deg spun, phase = +1: home */
}
@media (prefers-reduced-motion: reduce) { .spinor { animation-duration: 4.2s, 4.2s; } }
.spinor-mini { width: 8px; height: 8px; border-width: 1.5px; }   /* count-badge slot on the grid */

/* destination panel (center) */
.v2-dest-col {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px 24px;
  overflow-y: auto; min-width: 0; gap: 14px;
}
.v2-sel-display {
  text-align: center; display: flex; align-items: center;
  justify-content: center; gap: 8px; flex-shrink: 0;
  padding: 4px 12px; font-size: 10px;
  border-bottom: 1px solid var(--line); min-height: 24px;
}
.v2-sel-file { color: var(--b2); font-weight: 600; }
.v2-sel-from { color: var(--faint); font-size: 9px; }
.v2-sel-hint { color: var(--faint); font-style: italic; }
.v2-sel-arrow { color: var(--b2); opacity: .6; margin: 0 2px; }

.v2-dest-grid-wrap {
  flex: 1; display: flex; gap: 6px; width: 100%;
  padding: 10px; min-height: 0;
}
.v2-dest-branch { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.v2-dest-blabel { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; text-align: center; }
.v2-dest-cells { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; align-content: stretch; }
.v2-dest-cell {
  border-radius: 6px;
  border: 1px solid var(--line); background: var(--cell-bg);
  text-align: center; cursor: pointer; transition: all .12s;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-width: 0; min-height: 0;
}
.v2-dest-cell:hover { background: #1a1e27; border-color: var(--faint); }
.v2-dest-cell.dest-sel { border-color: var(--b2); background: #1a150d; box-shadow: 0 0 10px -2px var(--b2); }
.v2-dest-cell.dest-src { border-color: var(--faint); opacity: .4; }
.v2-dest-cell.dest-cur { border-color: color-mix(in srgb, var(--b1) 30%, transparent); }
.v2-dc-digits { font-size: 11px; font-weight: 600; letter-spacing: .06em; }
.v2-dc-verb { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.v2-dc-count { font-size: 9px; color: var(--dim); background: #1e2230; border-radius: 8px; padding: 1px 6px; }

.v2-dest-footer {
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  gap: 12px; padding: 8px 12px; border-top: 1px solid var(--line); min-height: 36px;
}
.v2-dest-info { font-size: 10px; color: var(--dim); }
.v2-move-btn {
  font: 600 12px 'DM Mono', monospace;
  background: #1a150d; color: var(--b2);
  border: 1px solid var(--b2); border-radius: 6px;
  padding: 6px 20px; cursor: pointer; transition: all .15s;
}
.v2-move-btn:hover { background: #2a200d; box-shadow: 0 0 14px -4px var(--b2); }
.v2-move-hint { font-size: 10px; color: var(--faint); font-style: italic; }

/* trail panel (right) */
.v2-trail-col { width: 300px; flex-shrink: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
.v2-manifest { flex: 1; overflow-y: auto; padding: 10px 12px; }
.v2-manifest-list { display: flex; flex-direction: column; }
.v2-manifest-entry {
  display: flex; gap: 6px; padding: 3px 0;
  font-size: 9px; color: var(--dim);
  border-bottom: 1px solid #111118; align-items: baseline;
}
.v2-me-op { font-weight: 600; flex-shrink: 0; min-width: 38px; }
.v2-me-file { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v2-me-route { font-size: 8px; color: var(--faint); flex-shrink: 0; }
.v2-me-ts { font-size: 8px; color: var(--faint); flex-shrink: 0; }

/* health indicator */
.v2-health {
  padding: 8px 12px; font-size: 10px; cursor: pointer;
  border-bottom: 1px solid var(--line); transition: all .15s;
}
.v2-health.clean { color: var(--b1); }
.v2-health.drift { color: var(--b2); }
.v2-health .v2-health-summary { font-weight: 600; letter-spacing: .03em; }
.v2-health-details {
  display: none; margin-top: 6px; font-size: 9px; color: var(--dim);
  max-height: 200px; overflow-y: auto;
}
.v2-health.expanded .v2-health-details { display: block; }
.v2-health-item { padding: 2px 0; border-bottom: 1px solid #111118; }
.v2-health-item .hi-type { color: var(--faint); font-size: 8px; margin-right: 4px; }

/* intake + drop zone (right column) */
#v2-intake { flex-shrink: 0; border-bottom: 1px solid var(--line); max-height: 200px; overflow-y: auto; }
.v2-dropzone {
  padding: 10px 12px; text-align: center;
  border: 1px dashed var(--faint); border-radius: 6px;
  margin: 8px 10px; font-size: 9px; color: var(--faint);
  transition: all .2s; letter-spacing: .03em;
}
.v2-dropzone.dragover {
  border-color: var(--b2); color: var(--b2); background: #1a150d;
}

/* log */
.v2-log { flex: 1; overflow-y: auto; padding: 10px 12px; border-top: 1px solid var(--line); max-height: 280px; }
.v2-log-title { font: 500 9px 'DM Mono', monospace; color: var(--faint); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
.log-entry { padding: 2px 0; font-size: 10px; color: var(--dim); border-bottom: 1px solid #111118; }
.log-entry.action { color: var(--b1); }
.log-entry.fold { color: var(--b2); }
.log-entry.cycle { color: #aa44cc; }

/* responsive */
@media (max-width: 900px) {
  .v0-selector { padding: 6px 12px 0; }
  .v0-sidebar { width: 160px; min-width: 120px; }
  .v2-files-col { width: 180px; }
  .v2-trail-col { width: 240px; }
  .v2-dest-cell { min-width: 38px; }
  .tabs { padding: 12px 12px 0; }
  .w-lower { gap: 10px; padding: 0 12px 8px; }
  .w-sierpinski { flex: 0 0 160px; }
  .w-sierpinski svg { width: 160px; height: 160px; }
}
@media (max-width: 600px) {
  .w-card { max-width: 92vw !important; }
  .w-lower { flex-direction: column; }
  .w-sierpinski { flex: 0 0 auto; }
}

/* ======== DEBUG OVERLAY ======== */
.debug-btn {
  font: 500 11px 'DM Mono', monospace; padding: 6px 10px;
  background: transparent; border: 1px solid var(--line); border-radius: 6px;
  color: var(--faint); cursor: pointer; margin-left: auto;
}
.debug-btn:hover { color: var(--dim); border-color: var(--faint); }
.debug-btn.on { color: #cc4444; border-color: #cc4444; }
.seat-btn {
  font: 500 11px 'DM Mono', monospace; padding: 6px 10px;
  background: transparent; border: 1px solid var(--line); border-radius: 6px;
  color: var(--faint); cursor: pointer;
}
.seat-btn:hover { color: var(--dim); border-color: var(--faint); }
.refresh-btn.fresh { color: #6ab06a; border-color: #2a4a2a; animation: estop-pulse 2s ease-in-out infinite; }
.estop-btn { color: #cc4444; border-color: #663333; font-weight: 700; position: relative; z-index: 400; }
.estop-btn:hover { color: #ff5555; border-color: #cc4444; }
.estop-btn.pulled {
  background: #cc4444; color: #fff; border-color: #cc4444;
  animation: estop-pulse 1.2s ease-in-out infinite;
}
.estop-btn.pulled:hover { background: #aa3333; color: #fff; }
@keyframes estop-pulse { 50% { opacity: 0.55; } }
#debug-overlay {
  display: none; position: fixed; top: 0; right: 0; bottom: 0;
  width: 380px; background: #0a0c11ee; border-left: 1px solid var(--line);
  z-index: 9999; font: 400 10px 'DM Mono', monospace; color: var(--dim);
  flex-direction: column; overflow: hidden;
}
#debug-overlay.open { display: flex; }
.debug-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  font-weight: 700; color: var(--ink); font-size: 11px;
}
.debug-close { cursor: pointer; color: var(--faint); font-size: 14px; }
.debug-close:hover { color: var(--ink); }
.debug-section {
  padding: 6px 12px; border-bottom: 1px solid var(--line);
}
.debug-section-title {
  font-weight: 700; color: var(--faint); font-size: 9px;
  text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px;
}
.debug-state-grid {
  display: grid; grid-template-columns: auto 1fr; gap: 1px 10px;
}
.debug-state-grid .l { color: var(--faint); }
.debug-state-grid .v { color: var(--ink); }
.debug-log {
  flex: 1; overflow-y: auto; padding: 6px 12px;
  display: flex; flex-direction: column-reverse;
}
.debug-entry {
  padding: 3px 0; border-bottom: 1px solid #1a1e2744;
  font-size: 10px; line-height: 1.4;
}
.debug-entry .action { color: #44cc66; }
.debug-entry .unhandled { color: #cc8844; }
.debug-entry .error { color: #cc4444; }
.debug-entry .key { color: var(--ink); font-weight: 700; }
.debug-entry .mods { color: #4488cc; }
.debug-eval {
  display: flex; border-top: 1px solid var(--line);
  padding: 4px 8px;
}
.debug-eval input {
  flex: 1; background: transparent; border: 1px solid var(--line);
  border-radius: 4px; padding: 4px 8px; color: var(--ink);
  font: 400 10px 'DM Mono', monospace; outline: none;
}
.debug-eval input:focus { border-color: var(--faint); }
/* W4 comms — the memo board surface */
#memos-overlay {
  display: none; position: fixed; top: 0; right: 0; bottom: 0;
  width: 420px; background: #0a0c11f2; border-left: 1px solid var(--line);
  z-index: 9999; font: 400 11px 'DM Mono', monospace; color: var(--dim);
  flex-direction: column; overflow: hidden;
}
#memos-overlay.open { display: flex; }
#memos-overlay.compose-only .memos-thread { display: none; }
#memos-overlay.compose-only { top: auto; height: auto; }
/* drag the header up to reveal the thread, half-screen max (operator word) */
#memos-overlay.compose-only .memos-header { cursor: ns-resize; user-select: none; }
#memos-overlay.compose-only.expanded .memos-thread {
  display: block; height: var(--memos-h, 40vh); max-height: 50vh; overflow-y: auto;
}
.memos-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  font-weight: 700; color: var(--ink); font-size: 11px;
}
.memos-close { cursor: pointer; color: var(--faint); font-size: 14px; }
.memos-close:hover { color: var(--ink); }
.memos-thread { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; }
.memo-row { padding: 6px 0; border-bottom: 1px solid #1a1e2744; line-height: 1.5; }
.memo-meta { font-size: 9px; color: var(--faint); margin-bottom: 2px; }
.memo-from { color: var(--ink); font-weight: 700; }
.memo-body { color: var(--dim); white-space: pre-wrap; word-break: break-word; }
.memo-body .at { color: #4488cc; font-weight: 700; }
.memo-body .memo-link { color: var(--accent, #6aa9e0); border-bottom: 1px dotted currentColor; cursor: pointer; }
.memo-body .memo-link:hover { color: var(--ink); background: #6aa9e022; }
/* dispatch S3 — the window (frame.dispatch at 210) */
#view-3.active { display: flex; flex: 1; min-height: 0; flex-direction: column; }
#d-approvals:empty { display: none; }
#d-approvals { flex-shrink: 0; border-bottom: 1px solid #4a4022; }
.d-appr-row {
  display: flex; align-items: center; gap: 12px; padding: 7px 16px;
  background: #17130a; border-bottom: 1px solid #2a2415;
  font: 11px 'DM Mono', monospace;
}
.d-appr-seat { color: #c9a227; font-weight: 700; }
.d-appr-tool { color: var(--faint); font-size: 9px; text-transform: uppercase; }
.d-appr-preview { flex: 1; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-appr-btn {
  font: 700 10px 'DM Mono', monospace; padding: 3px 12px; border-radius: 4px;
  cursor: pointer; border: 1px solid;
}
.d-appr-allow { background: #16281a; color: #6ab06a; border-color: #2a4a2a; }
.d-appr-allow:hover { background: #1e3524; }
.d-appr-deny { background: #281616; color: #cc6666; border-color: #4a2a2a; }
.d-appr-deny:hover { background: #351e1e; }
.d-appr-always { background: #16222e; color: #6aa9e0; border-color: #23405c; }
.d-appr-always:hover { background: #1c2c3c; }
.d-grid {
  flex: 1; display: grid; min-height: 0; width: 100%;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: 3fr 2fr;
  gap: 1px; background: var(--line);
}
.d-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); }
.d-pane.selected { box-shadow: inset 0 0 0 1px #23405c; }
.d-seat-card.selected { box-shadow: inset 0 0 0 1px #23405c; }
.d-compose {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  padding: 7px 12px; border-top: 1px solid var(--line); background: var(--bg);
}
.d-compose-target { color: #6aa9e0; font: 700 10px 'DM Mono', monospace; white-space: nowrap; }
.d-compose input {
  flex: 1; background: #0d1016; color: var(--ink); border: 1px solid var(--line);
  border-radius: 5px; font: 400 11px 'DM Mono', monospace; padding: 6px 10px; outline: none;
}
.d-compose input:focus { border-color: #23405c; }
.d-compose input:disabled { opacity: 0.4; }
.d-compose button {
  background: transparent; color: var(--dim); border: 1px solid var(--line);
  border-radius: 5px; font: 700 10px 'DM Mono', monospace; padding: 5px 14px; cursor: pointer;
}
.d-compose button:hover { color: #6aa9e0; border-color: #23405c; }
.d-pane-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 5px 10px; border-bottom: 1px solid var(--line);
  font-size: 9px; color: var(--faint); flex-shrink: 0;
}
.d-pane-bar select {
  background: transparent; color: var(--dim); border: 1px solid var(--line);
  border-radius: 4px; font: 500 10px 'DM Mono', monospace; padding: 2px 4px;
  max-width: 60%;
}
.d-pane-file { font-size: 8px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-pane-body {
  flex: 1; overflow-y: auto; padding: 10px 14px;
  font: 11px/1.7 'DM Mono', monospace; color: var(--ink);
  word-wrap: break-word;
}
.d-pane-body table { border-collapse: collapse; margin: 6px 0; font-size: 10px; }
.d-pane-body th, .d-pane-body td { border: 1px solid #1a1e27; padding: 2px 7px; text-align: left; }
.d-pane-body h1 { font-size: 13px; color: var(--ink); margin: 10px 0 6px; }
.d-pane-body pre { background: #0d1016; padding: 8px 10px; border-radius: 4px; overflow-x: auto; font-size: 10px; }
details.md-sec { margin: 4px 0; }
details.md-sec > summary {
  cursor: pointer; color: var(--ink); font-weight: 700; font-size: 12px;
  padding: 3px 0; list-style: none; user-select: none;
}
details.md-sec > summary::before { content: '\25be '; color: var(--faint); }
details.md-sec:not([open]) > summary::before { content: '\25b8 '; }
details.md-sec > summary:hover { color: #6aa9e0; }
select.d-status {
  background: #0d1016; border: 1px solid var(--line); border-radius: 4px;
  font: 700 9px 'DM Mono', monospace; padding: 1px 3px; cursor: pointer;
}
select.d-status.s-done, select.d-status.s-built { color: #6ab06a; border-color: #2a4a2a; }
select.d-status.s-doing, select.d-status.s-next { color: #6aa9e0; border-color: #23405c; }
select.d-status.s-blocked { color: #cc4444; border-color: #663333; }
select.d-status.s-parked { color: #c9a227; border-color: #4a4022; }
select.d-status.s-tbd { color: var(--faint); }
.d-flag-row {
  display: flex; align-items: center; gap: 10px; margin: 5px 0;
  padding: 5px 10px; background: #0d1016; border: 1px solid var(--line); border-radius: 5px;
}
.d-flag-label { color: var(--ink); font-size: 10px; flex: 1; }
.d-flag-sel {
  background: transparent; color: #6aa9e0; border: 1px solid #23405c;
  border-radius: 4px; font: 700 10px 'DM Mono', monospace; padding: 2px 6px; cursor: pointer;
}
.d-flag-custom {
  background: #0d1016; color: var(--ink); border: 1px solid #23405c;
  border-radius: 4px; font: 400 10px 'DM Mono', monospace; padding: 3px 8px;
  min-width: 180px; outline: none;
}
.d-sign-btn {
  background: #16281a; color: #6ab06a; border: 1px solid #2a4a2a; border-radius: 5px;
  font: 700 11px 'DM Mono', monospace; padding: 5px 14px; cursor: pointer;
}
.d-sign-btn:hover { background: #1e3524; color: #8fd08f; }
.d-board-row { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid #1a1e2733; font-size: 10px; }
.d-board-ts { color: var(--faint); font-size: 8px; white-space: nowrap; padding-top: 2px; }
.d-board-from { color: #6aa9e0; font-weight: 700; white-space: nowrap; }
.d-board-memo { color: var(--ink); word-break: break-word; }
.d-board-memo .at { color: #4488cc; font-weight: 700; }
.d-seat-card { padding: 12px 14px; overflow-y: auto; }
.d-seat-name { color: var(--ink); font-weight: 700; font-size: 13px; }
.d-seat-gait {
  display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 8px;
  font-size: 9px; border: 1px solid var(--line); color: var(--dim);
}
.d-seat-gait.work { color: #6ab06a; border-color: #2a4a2a; }
.d-seat-gait.hold { color: #c9a227; border-color: #4a4022; }
.d-seat-halted {
  display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 8px;
  font-size: 9px; background: #cc4444; color: #fff; font-weight: 700;
  animation: estop-pulse 1.2s ease-in-out infinite;
}
.d-pane-chan { color: #6aa9e0; font: 700 10px 'DM Mono', monospace; }
.d-doc {
  display: none; position: fixed; bottom: 64px; width: calc(33.333% - 16px);
  max-height: 62vh; background: #0d1016f6; border: 1px solid #23405c;
  border-radius: 8px; z-index: 240; flex-direction: column;
  box-shadow: 0 8px 40px #00000088;
}
.d-doc.open { display: flex; }
.d-doc-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 12px; border-bottom: 1px solid #16222e;
  color: #6aa9e0; font: 700 10px 'DM Mono', monospace;
}
.d-doc-body {
  flex: 1; overflow-y: auto; padding: 10px 14px;
  font: 11px/1.7 'DM Mono', monospace; color: var(--ink); word-wrap: break-word;
}
.d-doc-title { display: flex; align-items: center; gap: 8px; overflow: hidden; }
.d-doc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-fold-pill {
  flex-shrink: 0; padding: 1px 8px; border-radius: 8px; cursor: pointer;
  background: #16222e; color: #6aa9e0; border: 1px solid #23405c;
  font: 700 10px 'DM Mono', monospace; user-select: none; touch-action: none;
}
.d-fold-pill:not(.solo):hover { background: #1c2c3c; }
.d-fold-pill:not(.solo):active { background: #2a3f55; transform: scale(1.08); }
.d-fold-pill.solo { cursor: default; opacity: 0.6; background: transparent; border-color: var(--line); color: var(--faint); }
.d-fold-count { color: var(--faint); font-weight: 400; }
.d-chip {
  display: inline-block; margin: 2px 4px 2px 0; padding: 1px 8px;
  border: 1px solid #23405c; border-radius: 8px; cursor: pointer;
  color: #6aa9e0; font-size: 9px;
}
.d-chip:hover { background: #16222e; }
.d-seat-status { color: var(--ink); }
.d-seat-status.stale { color: var(--faint); }
.d-status-age { color: var(--faint); font-size: 8px; margin-left: 6px; }
#d-proposal {
  display: none; position: fixed; right: 24px; bottom: 64px; width: 540px;
  max-height: 68vh; background: #0d1016f6; border: 1px solid #4a4022;
  border-radius: 8px; z-index: 250; flex-direction: column;
  box-shadow: 0 8px 40px #00000088;
}
#d-proposal.open { display: flex; }
.d-prop-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; border-bottom: 1px solid #2a2415;
  color: #c9a227; font: 700 11px 'DM Mono', monospace;
}
.d-prop-dismiss { cursor: pointer; color: var(--faint); font-size: 14px; }
.d-prop-dismiss:hover { color: var(--ink); }
.d-prop-body {
  flex: 1; overflow-y: auto; padding: 10px 16px;
  font: 11px/1.7 'DM Mono', monospace; color: var(--ink); word-wrap: break-word;
}
.d-card-appr {
  display: flex; align-items: center; gap: 8px; margin: 6px 0;
  padding: 5px 8px; background: #17130a; border: 1px solid #4a4022;
  border-radius: 5px; font-size: 10px;
}
.d-posture {
  display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 8px;
  font-size: 9px; border: 1px solid var(--line); color: var(--faint);
}
.d-posture.awake { color: #6ab06a; border-color: #2a4a2a; }
.d-posture.asleep { color: var(--faint); border-style: dashed; }
.d-posture.flag { color: #cc4444; border-color: #663333; font-weight: 700; }
.d-posture.quiet { color: var(--faint); }
.d-posture.working { color: #6ab06a; border-color: #2a4a2a; }
.d-typing { display: inline-block; margin-left: 4px; }
.d-typing i {
  display: inline-block; width: 3px; height: 3px; margin: 0 1px 1px 0;
  border-radius: 50%; background: #6ab06a; opacity: 0.25;
  animation: d-typing-blink 1.2s ease-in-out infinite;
}
.d-typing i:nth-child(2) { animation-delay: 0.2s; }
.d-typing i:nth-child(3) { animation-delay: 0.4s; }
@keyframes d-typing-blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
/* W5 breath — loop cadence as a slow pulse on the dark glass; awake bodies only */
.d-seat-card.breathing { animation: d-breath 5s ease-in-out infinite; }
@keyframes d-breath {
  0%, 100% { box-shadow: inset 0 0 0 0 #6ab06a00; }
  50% { box-shadow: inset 0 0 24px 0 #6ab06a14; }
}
/* W5 the raised hand — the amber row is a body asking */
.d-card-appr::before {
  content: '✋'; flex-shrink: 0; font-size: 12px;
  animation: d-hand-raise 2.4s ease-in-out infinite;
}
@keyframes d-hand-raise {
  0%, 100% { transform: translateY(1px); opacity: 0.7; }
  50% { transform: translateY(-1px); opacity: 1; }
}
.d-gn-btn {
  float: right; margin-right: 6px; font: 700 9px 'DM Mono', monospace;
  padding: 2px 10px; border-radius: 4px; cursor: pointer;
  background: transparent; color: var(--faint); border: 1px solid var(--line);
}
.d-gn-btn:hover { color: #c9a227; border-color: #4a4022; }
.d-hold-btn {
  float: right; font: 700 9px 'DM Mono', monospace; padding: 2px 10px;
  border-radius: 4px; cursor: pointer; background: transparent;
  color: #c9a227; border: 1px solid #4a4022;
}
.d-hold-btn:hover { background: #17130a; }
.d-hold-btn.held { color: #6ab06a; border-color: #2a4a2a; }
.d-launch-btn {
  float: right; margin-right: 6px; font: 700 9px 'DM Mono', monospace;
  padding: 2px 10px; border-radius: 4px; cursor: pointer;
  background: transparent; color: var(--dim); border: 1px solid var(--line);
}
.d-launch-btn:hover { color: #6aa9e0; border-color: #23405c; }
.d-seat-row { display: flex; gap: 8px; margin: 6px 0; font-size: 10px; line-height: 1.5; }
.d-seat-label { color: var(--faint); min-width: 52px; font-size: 8px; text-transform: uppercase; padding-top: 2px; }
.d-seat-val { flex: 1; color: var(--ink); word-break: break-word; }
.d-seat-mentions { color: #6aa9e0; }
/* U-5 — the read-only seat board */
#seats-overlay {
  display: none; position: fixed; top: 0; right: 0; bottom: 0;
  width: 440px; background: #0a0c11f2; border-left: 1px solid var(--line);
  z-index: 9999; font: 400 11px 'DM Mono', monospace; color: var(--dim);
  flex-direction: column; overflow: hidden;
}
#seats-overlay.open { display: flex; }
.seats-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  font-weight: 700; color: var(--ink); font-size: 11px;
}
.seats-close { cursor: pointer; color: var(--faint); font-size: 14px; }
.seats-close:hover { color: var(--ink); }
.seats-body { flex: 1; overflow-y: auto; padding: 8px 12px; }
.seat-card { padding: 10px 0; border-bottom: 1px solid #1a1e2744; }
.seat-card-name { color: var(--ink); font-weight: 700; font-size: 12px; }
.seat-card-home { color: var(--faint); font-size: 9px; margin-left: 6px; }
.seat-card-wake { color: #6aa9e0; font-size: 10px; margin: 3px 0; }
.seat-row { display: flex; gap: 8px; margin: 2px 0; line-height: 1.4; }
.seat-row-label { color: var(--faint); min-width: 38px; font-size: 9px; text-transform: uppercase; padding-top: 1px; }
.seat-row-val { flex: 1; word-break: break-word; }
.seat-can { color: #6ab06a; }
.seat-ask { color: #c0a24f; }
.seat-cant { color: #c06a6a; }
.seat-card-hooks { color: var(--faint); font-size: 9px; margin-top: 4px; }
.memos-empty { color: var(--faint); padding: 14px; text-align: center; font-size: 10px; }
.memos-compose { display: flex; gap: 6px; border-top: 1px solid var(--line); padding: 8px; }
.memos-compose input {
  flex: 1; background: transparent; border: 1px solid var(--line); border-radius: 4px;
  padding: 6px 8px; color: var(--ink); font: 400 11px 'DM Mono', monospace; outline: none;
}
.memos-compose input:focus { border-color: var(--faint); }
.memos-compose button {
  background: transparent; border: 1px solid var(--line); border-radius: 4px;
  color: var(--dim); padding: 6px 12px; cursor: pointer; font: 500 11px 'DM Mono', monospace;
}
.memos-compose button:hover { color: var(--ink); border-color: var(--faint); }
.memos-btn { position: relative; }
.memos-btn .badge {
  position: absolute; top: -3px; right: -3px; width: 7px; height: 7px;
  background: #cc4444; border-radius: 50%; display: none;
}
.memos-btn.has-new .badge { display: block; }
</style>

<body>

<div class="hud">
  <div class="hud-left">
    <div class="hud-left-row">
      <h1>lattice</h1>
      <button class="view-tab" data-v="0" onclick="switchView(0)">0 library</button>
      <button class="view-tab active" data-v="1" onclick="switchView(1)">1 observatory</button>
      <button class="view-tab" data-v="2" onclick="switchView(2)">2 warehouse</button>
      <button class="view-tab" data-v="3" onclick="switchView(3)">dispatch</button>
    </div>
    <div class="hud-left-row">
      <div class="hud-triad" id="hud-triad"></div>
      <div class="tab-utils">
        <button class="refresh-btn" onclick="location.reload()" title="reload">&#x21bb;</button>
        <button class="refresh-btn" onclick="revealFolder()" title="open this address's folder on disk">&#x1f4c1;</button>
        <button class="debug-btn" id="debug-toggle" onclick="toggleDebug()" title="console">con</button>
        <button class="seat-btn memos-btn" id="memos-toggle" onclick="toggleMemos()" title="open the comms board">memos<span class="badge"></span></button>
        <button class="seat-btn estop-btn" id="estop-btn" onclick="toggleEstop()" title="E-STOP — halt every seat's tool use instantly; click again to clear">e-stop</button>
      </div>
    </div>
  </div>
  <div class="hud-center">
    <div class="w-addr-bar" id="w-addr-bar"></div>
  </div>
</div>
<div class="v0-selector" id="v0-selector"></div>
<div class="hud-tray" id="hud-tray"></div>
<div id="tray-popup"></div>
<div class="hud-pulse" id="hud-pulse"></div>
<div class="net-banner" id="net-banner">server unreachable — showing last-known state, edits won't save. retrying…</div>

<div id="debug-overlay">
  <div class="debug-header">
    <span>console</span>
    <span class="debug-close" onclick="toggleDebug()">&times;</span>
  </div>
  <div class="debug-section" id="debug-state"></div>
  <div class="debug-section">
    <div class="debug-section-title">log</div>
  </div>
  <div class="debug-log" id="debug-log"></div>
  <div class="debug-eval">
    <input id="debug-input" placeholder="list, read, move, fold, create, go, help..." onkeydown="if(event.key==='Enter'){consoleExec(this.value);this.value='';event.stopPropagation();}event.stopPropagation();">
  </div>
</div>

<div id="memos-overlay">
  <div class="memos-header">
    <span>memos &middot; board</span>
    <span class="memos-close" onclick="toggleMemos()">&times;</span>
  </div>
  <div class="memos-thread" id="memos-thread"></div>
  <div class="memos-compose">
    <input id="memos-input" placeholder="post as hedawn&hellip; (@mention to aim)" autocomplete="off" name="memos-nofill" oninput="localStorage.setItem('memosDraft', this.value)" onkeydown="if(event.key==='Enter'){postMemo();event.stopPropagation();}event.stopPropagation();">
    <button onclick="postMemo()">post</button>
  </div>
</div>

<div id="seats-overlay">
  <div class="seats-header">
    <span>seats &middot; the board</span>
    <span class="seats-close" onclick="toggleSeats()">&times;</span>

  <div class="seats-body" id="seats-body"></div>
</div>

  <div class="v0-sidebar" id="v0-sidebar"></div>
  <div class="v0-editor" id="v0-editor-pane"></div>
</div>

    <div class="w-col w-col-id" id="col-id"></div>
    <div class="w-col w-col-card" id="col-card"><div class="w-card" id="w-card"></div></div>
    <div class="w-col w-col-pos" id="col-pos"></div>
  </div>
  <div class="w-lower" id="w-lower"></div>
</div>

<div id="view-2" class="view">
  <div class="v2-layout">
    <div class="v2-files-col" id="v2-files"></div>
    <div class="v2-dest-col" id="v2-dest"></div>
    <div class="v2-trail-col">
      <div id="v2-intake"></div>
      <div class="v2-manifest" id="v2-manifest"></div>
      <div class="v2-log" id="v2-log">
        <div class="v2-log-title">log</div>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>

<div id="view-3" class="view">
  <div class="d-grid">
    <div class="d-pane" id="d-pane-0" onclick="dSelect(0)">
      <div class="d-pane-bar" id="d-bar-0"></div>
      <div class="d-pane-body" id="d-body-0"></div>
