<script>
// ============================================================
// DATA
// ============================================================

const ROLE_MAP = { 0:'n', 1:'v', 2:'m' };
const MODE_MAP = { 0:'i', 1:'d', 2:'g' };
const REG_MAP  = { 0:'s', 1:'o', 2:'c' };

function buildAddr(digits) {
  const d = String(digits);
  const role = d.split('').map(c => ROLE_MAP[c]).join('');
  const mode = d.split('').map(c => MODE_MAP[c]).join('');
  const reg  = d.split('').map(c => REG_MAP[c]).join('');
  const ratio = d.split('').reduce((v, c, i) => v + parseInt(c) * Math.pow(3, -(i+1)), 0);
  const ratioStr = Math.round(ratio * 1000).toString().padStart(4, '0');
  return { digits: d, role, mode, register: reg, ratio: ratioStr };
}

const BRANCHES = [
  { digit: 0, name: 'specification', leaves: [
    { digit: '00', name: 'spec of spec' }, { digit: '01', name: 'ops of spec' }, { digit: '02', name: 'config of spec' }
  ]},
  { digit: 1, name: 'operation', leaves: [
    { digit: '10', name: 'spec of ops' }, { digit: '11', name: 'ops of ops' }, { digit: '12', name: 'config of ops' }
  ]},
  { digit: 2, name: 'configuration', leaves: [
    { digit: '20', name: 'spec of config' }, { digit: '21', name: 'ops of config' }, { digit: '22', name: 'config of config' }
  ]}
];

const LABELS = {
  '0':'specification','1':'operation','2':'configuration',
  '00':'spec of spec','01':'ops of spec','02':'config of spec',
  '10':'spec of ops','11':'ops of ops','12':'config of ops',
  '20':'spec of config','21':'ops of config','22':'config of config',
  '000':'what spec of spec is','001':'how spec of spec operates','002':'how spec of spec is maintained',
  '010':'what ops of spec is','011':'how ops of spec operates','012':'how ops of spec is maintained',
  '020':'what config of spec is','021':'how config of spec operates','022':'how config of spec is maintained',
  '100':'what spec of ops is','101':'how spec of ops operates','102':'how spec of ops is maintained',
  '110':'what ops of ops is','111':'how ops of ops operates','112':'how ops of ops is maintained',
  '120':'what config of ops is','121':'how config of ops operates','122':'how config of ops is maintained',
  '200':'what spec of config is','201':'how spec of config operates','202':'how spec of config is maintained',
  '210':'what ops of config is','211':'how ops of config operates','212':'how ops of config is maintained',
  '220':'what config of config is','221':'how config of config operates','222':'how config of config is maintained'
};

// triads mapped from lattice_full.html: old I=0, D=1, G=2
const T = {
  '000':{n:'unit',       v:'holds',        m:'one'},
  '001':{n:'ratio',      v:'reciprocates', m:'scale'},
  '002':{n:'interval',   v:'spans',        m:'continuum'},
  '010':{n:'standard',   v:'sets',         m:'zero'},
  '011':{n:'comparison', v:'analyzes',     m:'deviation'},
  '012':{n:'adjustment', v:'corrects',     m:'range'},
  '020':{n:'sample',     v:'captures',     m:'grain'},
  '021':{n:'rate',       v:'cycles',       m:'stream'},
  '022':{n:'point',      v:'plots',        m:'graph'},
  '100':{n:'wonder',     v:'bounds',       m:'frame'},
  '101':{n:'lucidity',   v:'reconfigures', m:'scene'},
  '102':{n:'chaos',      v:'untethers',    m:'finality'},
  '110':{n:'attention',  v:'watches',      m:'knot'},
  '111':{n:'view',       v:'connects',     m:'continuity'},
  '112':{n:'break',      v:'lands',        m:'edge'},
  '120':{n:'logic',      v:'describes',    m:'state'},
  '121':{n:'reason',     v:'guides',       m:'decision'},
  '122':{n:'creativity', v:'carries',      m:'potential'},
  '200':{n:'delivery',   v:'receives',     m:'material'},
  '201':{n:'manifest',   v:'confirms',     m:'count'},
  '202':{n:'schedule',   v:'sorts',        m:'inventory'},
  '210':{n:'layout',     v:'positions',    m:'work'},
  '211':{n:'motion',     v:'builds',       m:'form'},
  '212':{n:'coherence',  v:'adapts',       m:'snag'},
  '220':{n:'trim',       v:'cleans',       m:'slack'},
  '221':{n:'trace',      v:'audits',       m:'path'},
  '222':{n:'sign',       v:'hands',        m:'record'},
  '00':{n:'constant',  v:'references', m:'flux'},
  '01':{n:'gauge',     v:'calibrates', m:'accuracy'},
  '02':{n:'magnitude', v:'measures',   m:'number'},
  '10':{n:'gaze',      v:'beholds',    m:'totality'},
  '11':{n:'focus',     v:'discerns',   m:'difference'},
  '12':{n:'thought',   v:'grasps',     m:'sense'},
  '20':{n:'intake',    v:'stages',     m:'priority'},
  '21':{n:'labor',     v:'installs',   m:'practice'},
  '22':{n:'thread',    v:'dresses',    m:'weave'},
  '0':{n:'relation',  v:'grounds',    m:'measure'},
  '1':{n:'presence',  v:'minds',      m:'awareness'},
  '2':{n:'structure', v:'maintains',  m:'order'}
};
function tri(d) { return T[d] || {n:'',v:'',m:''}; }

const BCOLORS = ['var(--b0)','var(--b1)','var(--b2)'];
function bcolor(digits) { return BCOLORS[parseInt(String(digits)[0])]; }
function dcolor(digitVal) { return BCOLORS[parseInt(digitVal)]; }
function lastcolor(digits) { return BCOLORS[parseInt(String(digits).slice(-1))]; }
function colorSpan(text, digitVal) { return `<span style="color:${dcolor(digitVal)}">${text}</span>`; }
// all 27 cell ratios for tick marks
function ratioOf(digits) {
  return String(digits).split('').reduce((v,c,i) => v + parseInt(c) * Math.pow(3,-(i+1)), 0);
}
const ALL_CELLS = [];
for (let a=0;a<3;a++) for (let b=0;b<3;b++) for (let c=0;c<3;c++) ALL_CELLS.push(''+a+b+c);

// FILE INVENTORY — server-backed via /list API
const _fileCache = {};    // digits → [filenames]  (null = pending, [] = empty/404)
const _filePending = {};  // digits → true while fetch in flight
const _docCache = {};     // digits → {base: [versions]}
const _folderCache = {};  // digits → [subfolder names at the cell top]
const _unitCache = {};    // digits → [folders that are project units] (subset of _folderCache; invisible to /scan/files)
const _shelfCache = {};   // digits → [folders that are reference-library shelves] (subset of _folderCache; invisible to /scan/files, like units)
const _browseCache = {};  // "digits|sub" → {files, folders, documents}
let _browse = { addr: null, sub: '' };  // current subfolder browse within a cell

function fileCount(digits) {
  return (_fileCache[digits] || []).length;
}
function fileList(digits) {
  return _fileCache[digits] || [];
}
function docGroups(digits) {
  return _docCache[digits] || {};
}
// loading indicator — the spinor (see .spinor css). empty-while-loading otherwise
// reads as empty-because-broken; this says "working, not broken."
function spinorHTML(label) {
  return `<span class="spinor-box"><span class="spinor"></span>${label ? `<span class="spinor-label">${label}</span>` : ''}</span>`;
}
// selector count badge: mini spinor while the cell's count is still loading (undefined),
// the number once loaded (>0), nothing when loaded-and-empty. (tag: span for branch/leaf, div for cell.)
function countBadge(d, tag) {
  const t = tag || 'span';
  if (_fileCache[d] === undefined) return `<${t} class="v0-sel-fc"><span class="spinor spinor-mini"></span></${t}>`;
  const n = fileCount(d);
  return n > 0 ? `<${t} class="v0-sel-fc">${n}</${t}>` : '';
}

function loadFiles(digits) {
  if (_fileCache[digits] !== undefined || _filePending[digits]) return;
  _filePending[digits] = true;
  fetch(`/list/${digits}`, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      _fileCache[digits] = data.files || [];
      _docCache[digits] = data.documents || {};
      _folderCache[digits] = data.folders || [];
      _unitCache[digits] = data.units || [];
      _shelfCache[digits] = data.shelves || [];
      delete _filePending[digits];
      render();
    })
    .catch(() => {
      _fileCache[digits] = [];
      _docCache[digits] = {};
      _folderCache[digits] = [];
      _unitCache[digits] = [];
      delete _filePending[digits];
    });
}

function refreshFiles(digits) {
  delete _fileCache[digits];
  delete _docCache[digits];
  delete _folderCache[digits];
  delete _unitCache[digits];
  delete _filePending[digits];
  // drop any browse-cache entries for this cell so they re-fetch
  for (const k of Object.keys(_browseCache)) { if (k.split('|')[0] === digits) delete _browseCache[k]; }
  loadFiles(digits);
}

// ----- subfolder browsing (folder-visibility) -----
function loadBrowse(digits, sub) {
  const key = digits + '|' + sub;
  if (_browseCache[key] !== undefined) return;
  const url = `/list/${digits}/` + sub.split('/').map(encodeURIComponent).join('/');
  fetch(url, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => { _browseCache[key] = { files: data.files || [], folders: data.folders || [], documents: data.documents || {} }; render(); })
    .catch(() => { _browseCache[key] = { files: [], folders: [], documents: {} }; });
}
function v0EnterFolder(name) {
  _browse.sub = _browse.sub ? _browse.sub + '/' + name : name;
  loadBrowse(currentAddr, _browse.sub);
  renderScope();
}
function v0UpFolder() {
  const parts = _browse.sub.split('/'); parts.pop();
  _browse.sub = parts.join('/');
  renderScope();
}
function v0BrowseTo(sub) {
  _browse.sub = sub;
  if (sub) loadBrowse(currentAddr, sub);
  renderScope();
}
function v0PickSub(file) {
  const full = _browse.sub + '/' + file;
  v0LoadedFile = full;
  v2Selected = { file: full, addr: currentAddr };
  loadContent(currentAddr, full, full);
}
function v0OpenSub(file) {
  window.open(addrPath(currentAddr) + '/' + _browse.sub + '/' + file, '_blank');
}
function renderBrowseView(d) {
  const key = d + '|' + _browse.sub;
  loadBrowse(d, _browse.sub);
  const data = _browseCache[key] || { files: [], folders: [], documents: {} };
  const segs = _browse.sub.split('/');
  let h = `<div class="v0-sidebar-title"><span style="cursor:pointer" onclick="v0UpFolder()" title="up">⬆</span> `;
  h += `<span style="cursor:pointer" onclick="v0BrowseTo('')">${d}</span>`;
  let acc = '';
  segs.forEach((s, i) => {
    acc = acc ? acc + '/' + s : s;
    const last = i === segs.length - 1;
    h += ` / ` + (last ? `<span>${s}</span>` : `<span style="cursor:pointer" onclick="v0BrowseTo('${acc.replace(/'/g, "\\'")}')">${s}</span>`);
  });
  h += `</div><ul class="v0-scope-filelist">`;
  for (const fld of (data.folders || [])) {
    const fe = fld.replace(/'/g, "\\'");
    h += `<li class="loadable" style="cursor:pointer" onclick="v0EnterFolder('${fe}')" title="${fld}/">📁 ${fld}</li>`;
  }
  // fold the browse view: group files into documents (latest + history), same as
  // the address-level render. The server already returns `documents` for subpaths.
  const docEntries = Object.entries(data.documents || {});
  for (const [base, versions] of docEntries) {
    const parsed = versions.map(v => {
      const mm = v.match(/\.f(\d+)\./);
      return { file: v, fold: mm ? parseInt(mm[1]) : -1 };
    }).sort((a, b) => a.fold - b.fold);
    const latest = parsed[parsed.length - 1];
    const hasFolds = latest.fold >= 0;
    const ekey = _browse.sub + '|' + base;   // sub-prefixed so bases don't collide across folders
    const expanded = hasFolds && versions.length > 1 && v0ExpandedDocs[ekey];
    const f = latest.file;
    const fe = f.replace(/'/g, "\\'");
    const isLoadable = f.endsWith('.md') || f.endsWith('.txt');
    const isOpenable = /\.(html?|png|jpe?g|gif|svg)$/i.test(f);
    const cls = (v0LoadedFile === _browse.sub + '/' + f) ? 'loaded' : (isLoadable || isOpenable) ? 'loadable' : '';
    const action = isLoadable ? ` onclick="v0PickSub('${fe}')"` : isOpenable ? ` onclick="v0OpenSub('${fe}')"` : '';
    const displayName = hasFolds ? base : f;
    let badges = '';
    if (hasFolds && versions.length > 1) {
      const arrow = expanded ? '▾' : '▸';
      badges = `<span class="v0-fold-badge" onclick="event.stopPropagation();v0ToggleFolds('${ekey.replace(/'/g, "\\'")}')">${arrow}f${latest.fold}</span>`;
    } else if (hasFolds) {
      badges = `<span class="v0-fold-badge">f${latest.fold}</span>`;
    }
    h += `<li class="${cls}"${action} title="${f}">${displayName}${badges}</li>`;
    if (expanded) {
      h += `<ul class="v0-fold-history">`;
      for (const p of parsed) {
        const isCur = p.file === latest.file;
        const pfe = p.file.replace(/'/g, "\\'");
        const isOldLoaded = v0LoadedFile === _browse.sub + '/' + p.file;
        const oldLoadable = p.file.endsWith('.md') || p.file.endsWith('.txt');
        const oldOpenable = /\.(html?|png|jpe?g|gif|svg)$/i.test(p.file);
        const oldCls = isOldLoaded ? 'loaded' : isCur ? 'current' : '';
        const oldAction = oldLoadable ? ` onclick="v0PickSub('${pfe}')"` : oldOpenable ? ` onclick="v0OpenSub('${pfe}')"` : '';
        const ts = p.file.match(/(\d{6,8}-\d{6})/);
        const label = p.fold >= 0 ? `f${p.fold}` : p.file;
        const timeHint = ts ? ` <span style="color:var(--faint)">${ts[1]}</span>` : '';
        h += `<li class="${oldCls}"${oldAction} title="${p.file}">${label}${timeHint}${isCur ? ' ←' : ''}</li>`;
      }
      h += `</ul>`;
    }
  }
  if (_browseCache[key] === undefined) h += `<li style="padding:8px">${spinorHTML('loading…')}</li>`;
  else if (!(data.folders || []).length && !docEntries.length) h += `<li style="color:var(--faint);font-style:italic;padding:8px">empty folder</li>`;
  h += `</ul>`;
  return h;
}

// ============================================================
// LATTICE API — server verbs
// ============================================================

function apiPost(route, body) {
  return fetch(route, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(r => r.json());
}

function launchSeat(seat) {
  apiPost('/launch', { seat }).then(r => {
    if (r.error) { logMsg(`launch error: ${r.error}`, ''); hudPulse(r.error); return; }
    logMsg(`launched seat: ${r.launched}`, 'action');
    hudPulse(`${r.launched} launched`);
  }).catch(() => hudPulse('launch failed — server reachable?'));
}

function revealFolder() {
  // U-1: open the current address's folder on disk
  apiPost('/reveal', { addr: currentAddr }).then(r => {
    if (r.error) { hudPulse(r.error); return; }
    hudPulse(`opened ${currentAddr} folder`);
  }).catch(() => hudPulse('reveal failed — server reachable?'));
}

// ============================================================
// W4 COMMS — the memo board surface (chunk 2)
// ============================================================
let memosOpen = false;
let _boardCount = 0;
let _boardSeen = parseInt(localStorage.getItem('boardSeen') || '0', 10);
let _memosPoll = null;

function toggleMemos() {
  memosOpen = !memosOpen;
  document.getElementById('memos-overlay').classList.toggle('open', memosOpen);
  // dispatch view carries the thread as a pane - the overlay there is compose-only
  document.getElementById('memos-overlay').classList.toggle('compose-only', activeView === 3);
  if (memosOpen) {
    loadBoard(true);
    if (!_memosPoll) _memosPoll = setInterval(() => loadBoard(true), 3000);
    setTimeout(() => {
      const i = document.getElementById('memos-input');
      if (i) { i.value = i.value || localStorage.getItem('memosDraft') || ''; i.focus(); }
    }, 50);
  } else if (_memosPoll) {
    clearInterval(_memosPoll); _memosPoll = null;
  }
}

// drag the memos header up (compose-only mode) to reveal the thread - snaps
// closed under 60px, caps at half the screen (operator thread-word 20260703)
(function () {
  const overlay = document.getElementById('memos-overlay');
  const header = overlay ? overlay.querySelector('.memos-header') : null;
  if (!header) return;
  let startY = 0, startH = 0, dragging = false;
  header.addEventListener('pointerdown', (e) => {
    if (!overlay.classList.contains('compose-only')) return;
    if (e.target.closest('.memos-close')) return;
    dragging = true; startY = e.clientY;
    const thread = overlay.querySelector('.memos-thread');
    startH = overlay.classList.contains('expanded') ? thread.offsetHeight : 0;
    header.setPointerCapture(e.pointerId);
  });
  header.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const h = Math.min(Math.max(startH + (startY - e.clientY), 0), window.innerHeight * 0.5);
    overlay.style.setProperty('--memos-h', h + 'px');
    const wasExpanded = overlay.classList.contains('expanded');
    overlay.classList.toggle('expanded', h > 40);
    if (!wasExpanded && h > 40) loadBoard(true);
  });
  header.addEventListener('pointerup', (e) => {
    if (!dragging) return;
    dragging = false;
    header.releasePointerCapture(e.pointerId);
    const thread = overlay.querySelector('.memos-thread');
    if (overlay.classList.contains('expanded') && thread.offsetHeight < 60) {
      overlay.classList.remove('expanded');
    }
  });
})();

function loadBoard(markSeen) {
  return fetch('/board').then(r => r.json()).then(d => {
    _boardCount = d.count || 0;
    renderBoard(d.entries || []);
    if (markSeen) { _boardSeen = _boardCount; localStorage.setItem('boardSeen', String(_boardSeen)); }
    updateMemosBadge();
  }).catch(() => {});
}

function renderBoard(entries) {
  const el = document.getElementById('memos-thread');
  if (!el) return;
  if (!entries.length) { el.innerHTML = '<div class="memos-empty">no memos yet &mdash; post the first one below.</div>'; return; }
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // w3b deep-link: turn "<addr> <file.ext>" tokens into clickable jumps into the library
  const linkFiles = s => s.replace(
    /(^|[^\w/])(\d{1,3})(\s*[—\-:/]?\s*)([A-Za-z][\w.\-]*\.(?:md|html|txt|png|jpe?g|json|py))/g,
    (m, pre, addr, sep, fname) =>
      `${pre}<span class="memo-link" onclick="memoOpenFile('${addr}','${fname}')" title="open ${addr} in the library">${addr}${sep}${fname}</span>`
  );
  const atTop = el.scrollHeight - el.scrollTop - el.clientHeight < 40; // stick to bottom if near it
  el.innerHTML = entries.map(e => {
    const body = linkFiles(esc(e.memo)).replace(/@(\w+)/g, '<span class="at">@$1</span>');
    return `<div class="memo-row"><div class="memo-meta"><span class="memo-from">${esc(e.from)}</span> &middot; ${esc(e.ts)}</div><div class="memo-body">${body}</div></div>`;
  }).join('');
  if (atTop) el.scrollTop = el.scrollHeight;
}

function postMemo() {
  const input = document.getElementById('memos-input');
  const body = (input.value || '').trim();
  if (!body) return;
  apiPost('/memo', { handle: 'hedawn', body }).then(r => {
    if (r.error) { hudPulse(r.error); return; }
    input.value = '';
    localStorage.removeItem('memosDraft');   // posted - the draft is spent
    loadBoard(true);
  }).catch(() => hudPulse('memo failed — server reachable?'));
}

function updateMemosBadge() {
  const btn = document.getElementById('memos-toggle');
  if (btn) btn.classList.toggle('has-new', _boardCount > _boardSeen);
}

// w3b deep-link: a memo names a file by address; clicking it brings you to that file in the library
function memoOpenFile(addr, file) {
  if (!TRIADS[addr]) { hudPulse('unknown address: ' + addr); return; }
  if (memosOpen) toggleMemos();      // close the panel so the reader is visible
  go(addr);                          // move the lattice to the address (clears any stale reader)
  v0PickFile(addr + '/' + file);     // open the named file in the reader
  switchView(0);                     // surface the spec view (the reader)
  hudPulse(`opened ${addr} ${file}`);
}

// background poll: keep the unseen-dot fresh even when the panel is closed
setInterval(() => {
  if (memosOpen) return;
  fetch('/board').then(r => r.json()).then(d => { _boardCount = d.count || 0; updateMemosBadge(); }).catch(() => {});
}, 6000);
loadBoard(false); // initial badge state on load

// ============================================================
// dispatch S1 — the E-stop (the cord: frame.dispatch at 210)
// ============================================================
let _haltFlags = [];

function renderEstop() {
  const btn = document.getElementById('estop-btn');
  if (!btn) return;
  const halted = _haltFlags.length > 0;
  btn.classList.toggle('pulled', halted);
  if (halted) {
    btn.textContent = 'HALTED: ' + _haltFlags.map(f => f.scope).join(' ');
    btn.title = _haltFlags.map(f => f.scope + ' — ' + f.reason).join('\n') + '\nclick to clear';
  } else {
    btn.textContent = 'e-stop';
    btn.title = "E-STOP — halt every seat's tool use instantly; click again to clear";
  }
}

function refreshHalt() {
  return fetch('/halt').then(r => r.json()).then(d => {
    _haltFlags = d.flags || [];
    renderEstop();
  }).catch(() => {});
}

function toggleEstop() {
  if (_haltFlags.length === 0) {
    // STOP FIRST — the pull fires the instant the button is pressed, no input
    // between finger and stop. The reason is paperwork; it follows.
    fetch('/halt', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'pull', scope: 'all',
        reason: 'pulled at the button — reason to follow', by: 'hedawn' }) })
      .then(r => r.json())
      .then(d => {
        hudPulse(d.error ? d.error : 'HALT pulled (all) — the floor is stopped');
        refreshHalt();
        const reason = prompt('floor is STOPPED. reason (recorded, shown to every seat):');
        if (reason !== null && reason.trim()) {
          fetch('/halt', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'pull', scope: 'all', reason: reason, by: 'hedawn' }) })
            .then(() => refreshHalt());
        }
      })
      .catch(() => hudPulse('server unreachable — cord not pulled; CLI: python .claude/seats/cord.py pull all'));
  } else {
    const standing = _haltFlags.map(f => f.scope + ' — ' + f.reason).join('\n');
    if (!confirm('clear the halt?\n\nstanding:\n' + standing)) return;
    Promise.all(_haltFlags.map(f =>
      fetch('/halt', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'clear', scope: f.scope, by: 'hedawn' }) })))
      .then(() => { hudPulse('halt cleared — the floor is live'); refreshHalt(); })
      .catch(() => hudPulse('clear failed — check the server'));
  }
}

setInterval(refreshHalt, 6000); // keep the cord's state honest even if pulled from the CLI
refreshHalt();

// ============================================================
// dispatch S3 — the window (frame.dispatch at 210)
// ============================================================
// V4 (operator word 20260703): panes are FIXED as the three seat chats -
// selectors retired; documents open in per-column popups fed by dial chips
const dPanes = ['chan/keeper', 'chan/lantern', 'chan/clerk'];
const D_SEAT_COL = { keeper: 0, lantern: 1, clerk: 2 };
// selection survives reloads (incident.compose-loss f1: the draft persisted
// but the selection reset to pane 0, hiding it - "lost" to the eye)
let dSelected = parseInt(localStorage.getItem('dSelected') || '0', 10);
const _dCache = {};   // per-pane {sig} — repaint only when content changes,
                      // so open/closed section states survive the poll
let _dPoll = null;
let _dChatPoll = null;

function escD(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function dBar(i, fileNote) {
  const chan = (dPanes[i] || '').slice(5);
  return `<span class="d-pane-chan">${escD(chan)}</span>` +
         `<span class="d-pane-file">${escD(fileNote || '')}</span>`;
}

function dLoadPane(i) {
  const key = dPanes[i];
  const bar = document.getElementById('d-bar-' + i);
  const body = document.getElementById('d-body-' + i);
  if (!bar || !body) return;
  if (key.startsWith('chan/')) {
    const chan = key.slice(5);
    fetch('/channel/' + chan).then(r => r.json()).then(d => {
      const sig = key + ':' + d.count;
      if (_dCache[i] && _dCache[i].sig === sig) return;
      _dCache[i] = { sig };
      // scroll is the operator's: stick to the bottom only if he was there
      const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40 || !body.innerHTML;
      const keep = body.scrollTop;
      bar.innerHTML = dBar(i, 'comms/' + chan + '.md · ' + d.count + ' posts');
      body.innerHTML = (d.entries || []).map(e =>
        `<div class="d-board-row"><span class="d-board-ts">${e.ts}</span>` +
        `<span class="d-board-from">${escD(e.from)}</span>` +
        `<span class="d-board-memo">${escD(e.memo).replace(/@(\w+)/g, '<span class="at">@$1</span>')}</span></div>`
      ).join('') || '<div style="color:var(--faint)">no posts yet - this channel is born on its first</div>';
      body.scrollTop = atBottom ? body.scrollHeight : keep;
    }).catch(() => {});
    return;
  }
}

// ---- V4: per-column doc popups - dial chips open documents in the seat's
// own third of the screen; three can stand open at once (operator word)
const _dDocs = [null, null, null];   // per column: {path, addr, file, sig, folds, scrubbing}
function dDocOpen(col, path) {
  const cur = _dDocs[col];
  if (cur && cur.path === path) { dDocClose(col); return; }   // chip toggles
  const slash = path.indexOf('/');
  _dDocs[col] = { path, addr: path.slice(0, slash), file: path.slice(slash + 1),
                  sig: null, folds: [], scrubbing: false };
  dDocReload(col);
}

function dDocClose(col) {
  _dDocs[col] = null;
  const el = document.getElementById('d-doc-' + col);
  if (el) el.classList.remove('open');
}

function dDocReload(col) {
  const doc = _dDocs[col];
  if (!doc || doc.scrubbing) return;   // never fight the operator's hand
  fetch('/read/' + doc.addr + '/' + encodeURIComponent(doc.file))
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .catch(() =>
      // tolerant resolution: a dialed shorthand (no stamp/extension) resolves
      // to the newest matching file - seats dial names, the surface finds them
      fetch('/latest/' + doc.addr + '/' + encodeURIComponent(doc.file))
        .then(r => r.json())
        .then(d => {
          if (!d.file) return Promise.reject('no match');
          doc.file = d.file;
          return fetch('/read/' + doc.addr + '/' + encodeURIComponent(d.file)).then(r => r.json());
        }))
    .then(rd => {
      const content = rd.content || '';
      const sig = doc.file + ':' + content.length;
      if (doc.sig === sig) return;
      doc.sig = sig;
      dDocPaint(col, content);
      // the fold lineage rides in once; prefetch every fold's body so the
      // scrubber is instant (no network per step - it must follow the hand)
      fetch('/folds/' + doc.addr + '/' + encodeURIComponent(doc.file))
        .then(r => r.json()).then(f => {
          doc.folds = f.folds || [];
          dDocPaint(col, content);
          doc.foldBody = doc.foldBody || {};
          (doc.folds || []).forEach(fd => {
            if (doc.foldBody[fd.file] === undefined) {
              fetch('/read/' + doc.addr + '/' + encodeURIComponent(fd.file))
                .then(r => r.json()).then(rd => { doc.foldBody[fd.file] = rd.content || ''; }).catch(() => {});
            }
          });
        }).catch(() => {});
    }).catch(() => {});
}

function dDocPaint(col, content) {
  const doc = _dDocs[col];
  if (!doc) return;
  const el = document.getElementById('d-doc-' + col);
  if (!el) return;
  const cur = _FOLD_N(doc.file);
  const many = (doc.folds || []).length > 1;
  const pill = many
    ? `<span class="d-fold-pill" onpointerdown="dFoldScrubStart(event,${col})" title="press and hold to move through the folds">f${cur}<span class="d-fold-count">/${doc.folds.length}</span></span>`
    : (cur !== null ? `<span class="d-fold-pill solo">f${cur}</span>` : '');
  el.querySelector('.d-doc-title').innerHTML = pill + '<span class="d-doc-name">' + escD(doc.file) + '</span>';
  el.querySelector('.d-doc-body').innerHTML = dWidgetize(content, 10 + col, doc.addr, doc.file);
  el.classList.add('open');
}

function _FOLD_N(name) {
  const m = String(name).match(/\.f(\d+)\./);
  return m ? parseInt(m[1], 10) : null;
}

// the fold scrubber (operator word 20260703: like a scrubber - the value
// follows your HAND, not a timer): press and DRAG the pill horizontally;
// left is older, right is newer; the shown fold tracks the pointer; release
// lands where you stopped. ~34px of travel per fold.
const _FOLD_PX = 34;
function dFoldScrubStart(e, col) {
  e.preventDefault(); e.stopPropagation();
  const doc = _dDocs[col];
  if (!doc || (doc.folds || []).length < 2) return;
  doc.scrubbing = true;
  const startX = e.clientX;
  const startIdx = Math.max(0, doc.folds.findIndex(f => f.file === doc.file));
  let shownIdx = startIdx;
  const move = (ev) => {
    const idx = Math.min(doc.folds.length - 1,
      Math.max(0, startIdx + Math.round((ev.clientX - startX) / _FOLD_PX)));
    if (idx !== shownIdx) { shownIdx = idx; dFoldShow(col, doc.folds[idx].file); }
  };
  const stop = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', stop);
    doc.scrubbing = false;
    dDocReload(col);   // settle on the landed fold, resume live refresh
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', stop);
}

function dFoldShow(col, file) {
  const doc = _dDocs[col];
  if (!doc) return;
  doc.file = file; doc.sig = null;
  // instant from the prefetch cache; fetch only if a fold hasn't cached yet
  if (doc.foldBody && doc.foldBody[file] !== undefined) { dDocPaint(col, doc.foldBody[file]); return; }
  fetch('/read/' + doc.addr + '/' + encodeURIComponent(file))
    .then(r => r.json()).then(rd => dDocPaint(col, rd.content || '')).catch(() => {});
}

// ---- S4: the hands — status dropdowns, flag switches, the signature ----
const D_STATUSES = ['TBD', 'NEXT', 'DOING', 'BUILT', 'DONE', 'BLOCKED', 'PARKED'];
const _dWidgets = {};   // paneIdx -> { lineNo: originalLineText }

function dWidgetize(content, i, addr, file) {
  // scan lines for live tokens BEFORE md render; swap them for control-char
  // placeholders (survive escaping), then replace with widget HTML after.
  const lines = content.split('\n');
  const widgets = [];
  _dWidgets[i] = { addr, file, lines: {} };
  const mk = (html) => { widgets.push(html); return 'W' + (widgets.length - 1) + ''; };
  const out = lines.map((line, n) => {
    // rung status -> dropdown (changeable by any party)
    const sm = line.match(/rung:\s*([A-Z]+)\b/i);
    if (sm && D_STATUSES.includes(sm[1].toUpperCase())) {
      _dWidgets[i].lines[n] = line;
      const cur = sm[1].toUpperCase();
      const sel = `<select class="d-status s-${cur.toLowerCase()}" onchange="dStatusChange(${i},${n},this.value)">` +
        D_STATUSES.map(s => `<option ${s === cur ? 'selected' : ''}>${s}</option>`).join('') + '</select>';
      return line.replace(/rung:\s*[A-Za-z]+/, 'rung: ' + mk(sel));
    }
    // FLAG <label>: a | b | c = current  -> switch row
    const fm = line.match(/^FLAG\s+(.+?):\s*(.+?)\s*=\s*(.+?)\s*$/);
    if (fm) {
      _dWidgets[i].lines[n] = line;
      const opts = fm[2].split('|').map(s => s.trim());
      // a custom current value displays truthfully; every flag offers custom
      if (!opts.includes(fm[3])) opts.unshift(fm[3]);
      const sel = `<select class="d-flag-sel" onchange="dFlagChoose(${i},${n},this)">` +
        opts.map(o => `<option ${o === fm[3] ? 'selected' : ''}>${escD(o)}</option>`).join('') +
        `<option value="__custom__">custom&hellip;</option></select>`;
      return mk(`<div class="d-flag-row"><span class="d-flag-label">${escD(fm[1])}</span>${sel}</div>`);
    }
    // SIGN: -> the signature button (exists only while unsigned — poka-yoke)
    if (/^SIGN:\s*$/.test(line.trim())) {
      _dWidgets[i].lines[n] = line;
      return mk(`<div class="d-flag-row"><button class="d-sign-btn" onclick="dSign(${i},${n})">sign &amp; turn over</button></div>`);
    }
    return line;
  }).join('\n');
  let html = renderMdCollapsible(out);
  widgets.forEach((w, k) => { html = html.replace('W' + k + '', w); });
  return html;
}

function dFlagPost(i, n, newLine, done) {
  const w = _dWidgets[i];
  if (!w || w.lines[n] === undefined) return;
  fetch('/flag', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ addr: w.addr, file: w.file, line: n, old: w.lines[n], new: newLine, by: 'hedawn' }) })
    .then(r => r.json())
    .then(d => {
      if (d.error) hudPulse(d.error);
      else if (done) done(d);
      if (i === 3) { dPropReload(); return; }        // the paperwork popup
      if (i >= 10) { dDocReload(i - 10); return; }   // per-column doc popups
      _dCache[i] = null; dLoadPane(i);
    })
    .catch(() => hudPulse('flag change failed - server unreachable'));
}

function dStatusChange(i, n, value) {
  const old = _dWidgets[i].lines[n];
  dFlagPost(i, n, old.replace(/rung:\s*[A-Za-z]+/, 'rung: ' + value));
}

function dFlagSwitch(i, n, value) {
  const old = _dWidgets[i].lines[n];
  dFlagPost(i, n, old.replace(/=[^=]*$/, '= ' + value));
}

function dWidgetReload(i) {
  if (i === 3) { dPropReload(); return; }
  if (i >= 10) { dDocReload(i - 10); return; }
  _dCache[i] = null; dLoadPane(i);
}

// "custom..." on any flag swaps the dropdown for a text entry - listed
// options are offers, never a cage (operator word 20260703)
function dFlagChoose(i, n, sel) {
  if (sel.value !== '__custom__') { dFlagSwitch(i, n, sel.value); return; }
  const inp = document.createElement('input');
  inp.className = 'd-flag-custom';
  inp.placeholder = 'type the answer - Enter sets it';
  sel.replaceWith(inp);
  inp.focus();
  inp.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter' && inp.value.trim()) dFlagSwitch(i, n, inp.value.trim().replace(/\|/g, '/'));
    else if (e.key === 'Escape') dWidgetReload(i);
  });
  inp.addEventListener('click', (e) => e.stopPropagation());
}

function dSign(i, n) {
  dFlagPost(i, n, '__SIGN__', () => hudPulse('signed - turned over for the seat'));
}

function dGoodnight(seat) {
  fetch('/post', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ channel: seat, handle: 'hedawn', body: 'goodnight' }) })
    .then(r => r.json())
    .then(d => hudPulse(d.error ? d.error : 'goodnight sent to ' + seat + ' - it closes properly (baton, sitting, dark)'))
    .catch(() => hudPulse('goodnight failed - check the server'));
}

function dSeatHold(seat, halted) {
  const body = halted
    ? { action: 'clear', scope: seat, by: 'hedawn' }
    : { action: 'pull', scope: seat, reason: 'held from the window', by: 'hedawn' };
  fetch('/halt', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body) })
    .then(r => r.json())

    .catch(() => hudPulse('hold failed - check the server'));
}

// ---- V5: the paperwork popup - proposal.* on the active dial raises a card
let _dProp = null;          // {seat, path, addr, file} currently shown
function dCheckProposals() {
  fetch('/active').then(r => r.json()).then(a => {
    // sessionStorage: "set aside until next session" means exactly that
    const dismissed = JSON.parse(sessionStorage.getItem('dPropDismissed') || '[]');
    const prop = (a.active || []).find(e =>
      (e.path.split('/').pop() || '').startsWith('proposal.') && !dismissed.includes(e.path));
    const el = document.getElementById('d-proposal');
    if (!prop) { if (el) el.classList.remove('open'); _dProp = null; return; }
    const slash = prop.path.indexOf('/');
    const addr = prop.path.slice(0, slash), file = prop.path.slice(slash + 1);
    fetch('/read/' + addr + '/' + encodeURIComponent(file)).then(r => r.json()).then(rd => {
      const content = rd.content || '';
      const sig = prop.path + ':' + content.length;
      if (_dProp && _dProp.sig === sig) return;
      _dProp = { seat: prop.seat, path: prop.path, addr, file, sig,
                 signed: /^SIGNED:/m.test(content) };
      document.getElementById('d-prop-title').textContent =
        'paperwork from ' + prop.seat + ' · ' + file;
      document.getElementById('d-prop-body').innerHTML = dWidgetize(content, 3, addr, file);
      // the paperwork stands in the PROPOSING seat's third (operator word)
      const col = D_SEAT_COL[prop.seat];
      if (col !== undefined) {
        el.style.left = 'calc(' + (col * 33.333) + '% + 8px)';
        el.style.right = 'auto';
        el.style.width = 'calc(33.333% - 16px)';
      } else {
        el.style.left = ''; el.style.right = '24px'; el.style.width = '540px';
      }
      el.classList.add('open');
    }).catch(() => {});
  }).catch(() => {});
}

function dPropDismiss() {
  if (_dProp) {
    const dismissed = JSON.parse(sessionStorage.getItem('dPropDismissed') || '[]');
    dismissed.push(_dProp.path);
    sessionStorage.setItem('dPropDismissed', JSON.stringify(dismissed));
  }
  document.getElementById('d-proposal').classList.remove('open');
  _dProp = null;
}

function dPropReload() {
  const p = _dProp;
  if (!p) return;
  fetch('/read/' + p.addr + '/' + encodeURIComponent(p.file)).then(r => r.json()).then(rd => {
    const content = rd.content || '';
    const nowSigned = /^SIGNED:/m.test(content);
    document.getElementById('d-prop-body').innerHTML = dWidgetize(content, 3, p.addr, p.file);
    _dProp.sig = p.path + ':' + content.length;
    if (nowSigned && !p.signed) {
      // closing the loop: tell the proposing seat its paperwork came back
      fetch('/post', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channel: p.seat, handle: 'hedawn',
          body: 'signed: ' + p.path + ' - decisions are in the doc, dial it off when read' }) })
        .catch(() => {});
      hudPulse('signed - sent back to ' + p.seat);
      _dProp.signed = true;
    }
  }).catch(() => {});
}

let _dSeatsSig = '';
function dLoadSeats() {
  Promise.all([
    fetch('/presence').then(r => r.json()),
    fetch('/approvals').then(r => r.json()).catch(() => ({ pending: [] })),
  ]).then(([d, a]) => {
    // repaint only on change - steady state must be visually silent; the age
    // is bucketed to the minute so its tick alone never causes a repaint
    const sig = JSON.stringify([(d.seats || []).map(s =>
      ({ ...s, status_age: s.status_age == null ? null : Math.floor(s.status_age / 60) })), a.pending]);
    if (sig === _dSeatsSig) return;
    _dSeatsSig = sig;
    const bySeat = {};
    (a.pending || []).forEach(p => { (bySeat[p.seat] = bySeat[p.seat] || []).push(p); });
    (d.seats || []).forEach(s => {
      const el = document.getElementById('d-seat-' + s.seat);
      if (!el) return;
      const appr = (bySeat[s.seat] || []).map(p =>
        `<div class="d-card-appr"><span class="d-appr-tool">${escD(p.tool)}</span>` +
        `<span class="d-appr-preview">${escD(p.preview)}</span>` +
        `<button class="d-appr-btn d-appr-allow" onclick="dApprove('${escD(p.id)}','allow')">allow</button>` +
        ((p.tool === 'Bash' || p.tool === 'PowerShell')
          ? `<button class="d-appr-btn d-appr-always" onclick="dApprove('${escD(p.id)}','always')">always</button>` : '') +
        `<button class="d-appr-btn d-appr-deny" onclick="dApprove('${escD(p.id)}','deny')">deny</button></div>`
      ).join('');
      const col = D_SEAT_COL[s.seat] ?? 0;
      const freshStatus = s.status && s.status_age !== null && s.status_age !== undefined && s.status_age < 1200;
      const stale = s.status_age !== null && s.status_age !== undefined && s.status_age > 180;
      // the posture chip - W5 vocabulary: the card is a body, its state a
      // stance. AWAKE means the seat is actively reporting (a FRESH status),
      // not merely that its last commit was recent - a seat commits and posts
      // right before closing, so recent-activity gave false-awake to closed
      // seats (operator bug 20260703). A closed seat has no fresh status ->
      // asleep. The status line is the liveness signal; the seats keep it
      // current per act and set it 'asleep' at close.
      let posture = 'asleep', pcls = 'asleep';
      // WORKING rides the same honest signal at a tighter window: a status
      // reported under 2 minutes ago means the seat is mid-act right now
      // (seats report per act). 120s = two of the minute buckets the repaint
      // signature already uses, so the working->awake transition repaints.
      if (s.halted) { posture = 'flag out'; pcls = 'flag'; }
      else if ((s.status || '').trim().toLowerCase() === 'asleep') { posture = 'asleep'; pcls = 'asleep'; }
      else if (freshStatus && s.status_age < 120) { posture = 'working'; pcls = 'working'; }
      else if (freshStatus) { posture = 'awake'; pcls = 'awake'; }
      el.classList.toggle('breathing', pcls === 'awake' || pcls === 'working');
      const statusRow = s.status
        ? `<div class="d-seat-row"><span class="d-seat-label">now</span><span class="d-seat-val d-seat-status ${stale ? 'stale' : ''}">${escD(s.status)}<span class="d-status-age">${s.status_age < 60 ? 'under a minute' : Math.floor(s.status_age / 60) + 'm'} ago${stale ? ' · stale' : ''}</span></span></div>`
        : `<div class="d-seat-row"><span class="d-seat-label">now</span><span class="d-seat-val d-seat-status stale">no status reported</span></div>`;
      const chips = (s.dial || []).length
        ? `<div class="d-seat-row"><span class="d-seat-label">desk</span><span class="d-seat-val">` +
          s.dial.map(p => `<span class="d-chip" onclick="dDocOpen(${col}, '${escD(p)}')" title="${escD(p)}">${escD(p.split('/').pop().split('.').slice(0, 2).join('.'))}</span>`).join('') +
          `</span></div>`
        : '';
      el.innerHTML =
        `<div><span class="d-seat-name">${escD(s.seat)}</span>` +
        `<span class="d-posture ${pcls}" title="${pcls === 'working' ? 'status reported under 2m ago - mid-act' : pcls === 'awake' ? 'actively reporting status' : pcls === 'flag' ? 'stopped - flag pulled' : 'no fresh status'}">${posture}${pcls === 'working' ? '<span class="d-typing"><i></i><i></i><i></i></span>' : ''}</span>` +
        `<button class="d-hold-btn ${s.halted ? 'held' : ''}" onclick="dSeatHold('${escD(s.seat)}', ${s.halted})">${s.halted ? 'release' : 'hold'}</button>` +
        `<button class="d-launch-btn" onclick="launchSeat('${escD(s.seat)}')" title="launch this seat minimized, waking into the board-watch loop">launch</button>` +
        `<button class="d-gn-btn" onclick="dGoodnight('${escD(s.seat)}')" title="send the closing word to this seat's thread - it closes properly (baton, sitting, dark)">goodnight</button>` +
        `</div>` +
        appr +
        statusRow +
        chips +
        `<div class="d-seat-row"><span class="d-seat-label">last act</span><span class="d-seat-val">${escD(s.last_commit || '—')}</span></div>` +

// 2 -> clerk, 1+2 together -> keeper (the 0). Works bare when the box is empty,
// and with Alt anytime so you type, aim, Enter without leaving the keyboard.
// A short window resolves single-vs-chord: press 1 and 2 near-together for 0.
let _aimPend = null;
function dAimResolve(col) {
  if (_aimPend) { clearTimeout(_aimPend.timer); _aimPend = null; }
  dSelect(col);
}
document.getElementById('view-3').addEventListener('keydown', (e) => {
  if (activeView !== 3) return;
  if (e.key !== '1' && e.key !== '2') return;
  const input = document.getElementById('d-compose-input');
  const emptyBox = input && document.activeElement === input && !input.value;
  if (!(e.altKey || emptyBox)) return;
  e.preventDefault(); e.stopPropagation();
  if (_aimPend && _aimPend.key !== e.key) { dAimResolve(0); return; }   // 1+2 -> keeper
  if (_aimPend && _aimPend.key === e.key) return;                       // held repeat
  _aimPend = { key: e.key, timer: setTimeout(() => {
    const col = _aimPend.key === '1' ? 1 : 2;                           // single -> lantern/clerk
    _aimPend = null; dSelect(col);

}, true);

function dCompose() {
  const chan = (dPanes[dSelected] || '').slice(5);
  if (!chan) { hudPulse('no destination - press 0/1/2 or click a seat'); return; }
  const input = document.getElementById('d-compose-input');
  const body = (input.value || '').trim();
  if (!body) return;
  fetch('/post', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ channel: chan, handle: 'hedawn', body: body }) })
    .then(r => r.json())
    .then(d => {
      if (d.error) { hudPulse(d.error); return; }
      input.value = '';
      localStorage.removeItem('dComposeDraft');   // posted - the draft is spent
      input.focus();
      _dCache[dSelected] = null;
      dLoadPane(dSelected);
    })
    .catch(() => hudPulse('post failed - check the server'));

function renderDispatch() {
  for (let i = 0; i < 3; i++) dLoadPane(i);
  dLoadSeats();
  dSelect(dSelected);
  const ci = document.getElementById('d-compose-input');
  if (ci && !ci.value) ci.value = localStorage.getItem('dComposeDraft') || '';   // one draft, restored
  dCheckProposals();
  if (!_dPoll) _dPoll = setInterval(() => {
    if (activeView !== 3) return;
    dLoadSeats();   // cards carry the approvals - they refresh even mid-edit
    dCheckProposals();
    for (let c = 0; c < 3; c++) if (_dDocs[c]) dDocReload(c);   // open docs live-refresh
    const el = document.activeElement;
    // compose is ALWAYS focused by design - it never blocks the refresh;
    // only a select (open dropdown) or a foreign input pauses the panes
    if (el && (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' ||
        (el.tagName === 'INPUT' && el.id !== 'd-compose-input'))) return;
    for (let i = 0; i < 3; i++) dLoadPane(i);
  }, 5000);
  // chats poll fast (latency, operator thread-word 20260703): a channel read
  // is a tiny local JSON - 1.5s keeps the conversation feeling live while
  // docs/presence stay on the 5s cycle
  if (!_dChatPoll) _dChatPoll = setInterval(() => {
    if (activeView !== 3) return;
    for (let i = 0; i < 3; i++) if ((dPanes[i] || '').startsWith('chan/')) dLoadPane(i);
  }, 1500);
}

function seatRuleSummary(rules) {

// COMPACTION ENGINE

const LEVELS = ['year','month','day','hour','minute','second'];
const LLABELS = { year:'Y year', month:'M month', day:'D day', hour:'H hour', minute:'m min', second:'s sec' };

function pad(n) { return String(n).padStart(2,'0'); }
function makeTs(d) {
  return {
    full: `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}.${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}`,
    year: String(d.getUTCFullYear()),
    month: `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}`,
    day: `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}`,
    hour: `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}.${pad(d.getUTCHours())}`,
    minute: `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}.${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}`,
    second: `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}.${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}`
  };
}
const NW = { n:['source','basis','record','ground','datum'], v:['staged','forwarded','aimed','cast','sent'], m:['intact','whole','raw','bare','still'] };
function pk(a) { return a[Math.floor(Math.random()*a.length)]; }
function gn() { return `${pk(NW.n)}-${pk(NW.v)}-${pk(NW.m)}`; }

class CompactionEngine {
  constructor() {
    this.tower = {}; for (const l of LEVELS) this.tower[l] = [null,null,null];
    this.clock = new Date();
    this.totalIn = 0; this.totalFolds = 0; this.totalCycles = 0;
    this.foldCounts = {}; for (const l of LEVELS) this.foldCounts[l] = 0;
  }
  advanceClock(ms) { this.clock = new Date(this.clock.getTime() + ms); }
  makeArchive(addr) {
    this.advanceClock(1000 + Math.random()*2000);
    return { name:gn(), srcAddr:addr, ts:makeTs(this.clock), isCond:false, weight:1, depth:0 };
  }
  makeCondensed(items, fromLevel) {
    this.advanceClock(100);
    const w = items.reduce((s,i) => s+i.weight, 0);
    const d = Math.max(...items.map(i => i.depth));
    return { name:gn(), srcAddr:`${w}x`, ts:makeTs(this.clock), isCond:true, weight:w, depth:d+1, fromLevel };
  }
  pushToLevel(li, item) {
    const level = LEVELS[li], slots = this.tower[level];
    if (slots[0] !== null && slots[1] !== null && slots[2] !== null) {
      const c = this.makeCondensed([slots[0],slots[1],slots[2]], level);
      this.totalFolds++; this.foldCounts[level]++;
      slots[0]=null; slots[1]=null; slots[2]=null;
      if (li > 0) {
        logMsg(`\u2191 fold 3\u00d7${level} \u2192 ${LEVELS[li-1]} (${c.weight}\u00d7 d:${c.depth})`, 'fold');
        this.pushToLevel(li-1, c);
      } else {
        this.totalCycles++;
        logMsg(`\u21bb cycle: year overflow (${c.weight}\u00d7) \u2192 seconds`, 'cycle');
        c.ts = makeTs(this.clock);
        this.pushToLevel(LEVELS.length-1, c);
      }
    }
    slots[2]=slots[0]; slots[0]=slots[1]; slots[1]=item;
  }
  addArchive(addr) {
    this.totalIn++;
    this.pushToLevel(LEVELS.length-1, this.makeArchive(addr));
  }
  weight() { let w=0; for(const l of LEVELS) for(const s of this.tower[l]) if(s) w+=s.weight; return w; }
  slots() { let f=0; for(const l of LEVELS) for(const s of this.tower[l]) if(s) f++; return f; }
  snap() {
    const r={}; for(const l of LEVELS) { r[l]=this.tower[l].map(s => {
      if(!s) return null;
      return { name:s.name, isCond:s.isCond, weight:s.weight, depth:s.depth, srcAddr:s.srcAddr, tsLens:s.ts[l], tsFull:s.ts.full };
    }); } return r;
  }
}

function v0FoldDoc() {

  if (hasFoldPattern) {
    apiFold(f, addr).then(r => {
      if (!r.error) {
        v0LoadedFile = r.file;
        v0LoadedContent = null;
        v0Editing = false;
        v0PickFile(r.file);

    });
  } else {
    // no fold naming — create as type.scope.f0 using the filename as base
    const ext = f.split('.').pop();
    const baseName = f.replace(/\.[^.]+$/, '');
    // use base name split at first dot as type.scope, or whole name as type with 'doc' scope
    const dotIdx = baseName.indexOf('.');
    const type = dotIdx > 0 ? baseName.slice(0, dotIdx) : baseName;
    const scope = dotIdx > 0 ? baseName.slice(dotIdx + 1) : 'doc';
    apiCreate(type, scope, addr, v0LoadedContent || '').then(r => {

function addrPath(digits) {
  // build absolute path from server root to a cell/leaf/branch folder
  const parts = [];
  for (let i = 1; i <= digits.length; i++) {
    const sub = digits.slice(0, i);
    parts.push(`${sub}.${TRIADS[sub]}`);  // {digit}.{triad} — must match server.resolve()
  }
  return '/' + parts.join('/');
}

// load a file into the reader: instant from cache (no spinor), else spinor; ALWAYS revalidate in the
// background and update iff the bytes changed and this file is still open (token) and not being edited.
// `token` is the v0LoadedFile value this load is for — guards against a slow fetch landing after a switch.
function loadContent(addr, fileName, token) {
  const key = addr + '/' + fileName;
  const cached = _contentCache[key];
  v0LoadedContent = cached !== undefined ? cached : 'loading...';
  renderScope();
  fetch(`/read/${addr}/${encodeURIComponent(fileName)}`, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      _contentCache[key] = data.content;
      if (v0LoadedFile === token && !v0Editing && data.content !== v0LoadedContent) { v0LoadedContent = data.content; renderScope(); }
    })
    .catch(e => { if (v0LoadedFile === token && cached === undefined) { v0LoadedContent = 'could not load: ' + e.message; renderScope(); } });
}

function v0PickFile(name) {
  // name may be prefixed with cell digits for aggregated views (e.g. "201/manifest.session.md")
  // or just a filename for direct cell view
  let addr, fileName;
  const slashIdx = name.indexOf('/');
  if (slashIdx !== -1) {
    addr = name.slice(0, slashIdx);
    fileName = name.slice(slashIdx + 1);
  } else {
    addr = currentAddr;
    fileName = name;
  }
  v0LoadedFile = name;
  // persistent selection: sync to V2
  v2Selected = { file: fileName, addr: addr };
  loadContent(addr, fileName, name);
}

function v0OpenFile(name) {

function renderMdCollapsible(text) {
  // md with hide/expand sections (operator pin 20260703): each `## ` heading
  // opens a <details> section, and `### ` chunks nest inside as their own
  // (operator word, same date). Content before the first heading renders as-is.
  return renderMdSections(text.split('\n'), 2);
}

function renderMdSections(lines, level) {
  const escT = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const marker = '#'.repeat(level);
  const re = new RegExp('^' + marker + '\\s+(.*)');
  const pre = [], sections = [];
  let cur = null, inCode = false;
  for (const raw of lines) {
    if (raw.trimStart().startsWith('```')) inCode = !inCode;
    const m = !inCode && raw.match(re);
    if (m) { cur = { title: m[1], body: [] }; sections.push(cur); continue; }
    (cur ? cur.body : pre).push(raw);
  }
  let html = renderMd(pre.join('\n'));
  for (const s of sections) {
    const body = level < 3 ? renderMdSections(s.body, level + 1) : renderMd(s.body.join('\n'));
    html += `<details open class="md-sec lvl${level}"><summary>${inline(escT(s.title))}</summary>${body}</details>`;
  }
  return html;
}

function renderMd(text) {
  // minimal markdown → HTML for reading plans
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = text.split('\n');
  let html = '', inCode = false, inTable = false;
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    // fenced code blocks
    if (raw.trimStart().startsWith('```')) {
      if (inCode) { html += '</pre>'; inCode = false; }
      else { html += '<pre>'; inCode = true; }
      continue;
    }
    if (inCode) { html += esc(raw) + '\n'; continue; }
    // close table if line is not a table row
    if (inTable && !raw.trimStart().startsWith('|')) { html += '</table>'; inTable = false; }
    const trimmed = raw.trim();
    if (!trimmed) { html += '<br>'; continue; }
    // headers
    const hm = trimmed.match(/^(#{1,4})\s+(.*)/);
    if (hm) { const lvl = hm[1].length; html += `<h${lvl}>${inline(esc(hm[2]))}</h${lvl}>`; continue; }
    // table rows
    if (trimmed.startsWith('|')) {
      const cells = trimmed.split('|').slice(1, -1).map(c => c.trim());
      // skip separator rows
      if (cells.every(c => /^[-:]+$/.test(c))) continue;
      if (!inTable) { html += '<table>'; inTable = true; }
      const tag = !inTable || i === 0 || (i > 0 && lines[i-1].trim() === '') ? 'th' : 'td';
      html += '<tr>' + cells.map(c => `<${tag}>${inline(esc(c))}</${tag}>`).join('') + '</tr>';
      continue;
    }
    // list items
    if (trimmed.match(/^[-*]\s/)) { html += inline(esc(trimmed.replace(/^[-*]\s+/, '\u2022 '))); html += '<br>'; continue; }
    // numbered list
    if (trimmed.match(/^\d+\.\s/)) { html += inline(esc(trimmed)); html += '<br>'; continue; }
    // paragraph
    html += inline(esc(trimmed)) + '<br>';
  }
  if (inCode) html += '</pre>';
  if (inTable) html += '</table>';
  return html;
}
function inline(s) {
  // bold, italic, inline code
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
}

// -- ADDRESS BAR (top) --
function renderAddrBar() {
  const el = document.getElementById('w-addr-bar');
  const d = currentAddr, depth = d.length;
  const DCLASS = ['d0','d1','d2'];

  let h = `<button class="nav-depth-btn" onclick="navAddrDepth(-1)" ${depth<=1?'disabled':''}>-</button>`;
  h += '<div class="nav-addr">';
  for (let i = 0; i < 3; i++) {
    const val = i < depth ? d[i] : '';
    const off = i >= depth ? ' off' : '';
    h += `<span class="nav-digit ${val!==''?DCLASS[parseInt(val)]:''}${off}" data-pos="${i}">${val!==''?val:'\u00b7'}</span>`;
  }
  h += '</div>';
  h += `<button class="nav-depth-btn" onclick="navAddrDepth(1)" ${depth>=3?'disabled':''}>+</button>`;
  el.innerHTML = h;

  // triad in tab row
  renderHudTriad();

  // top half = up, bottom half = down, middle 20% dead zone
  el.querySelectorAll('.nav-digit:not(.off)').forEach(digit => {
    digit.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      const rect = digit.getBoundingClientRect();
      const frac = (e.clientY - rect.top) / rect.height;
      const pos = parseInt(digit.dataset.pos);
      if (frac < 0.4) navDigitStep(pos, 1);
      else if (frac > 0.6) navDigitStep(pos, -1);
    });
    digit.addEventListener('contextmenu', e => {
      e.preventDefault();
      const pos = parseInt(digit.dataset.pos);
      currentAddr = currentAddr.slice(0, pos) + '1' + currentAddr.slice(pos + 1);
      render(); saveState();
    });
  });
}

function navDigitStep(pos, delta) {
  if (pos >= currentAddr.length) return;
  const cur = parseInt(currentAddr[pos]);
  const next = ((cur + delta) % 3 + 3) % 3;
  currentAddr = currentAddr.slice(0, pos) + next + currentAddr.slice(pos + 1);
  render(); saveState();
}

function navAddrDepth(delta) {
  if (delta > 0 && currentAddr.length < 3) currentAddr += '1';
  if (delta < 0 && currentAddr.length > 1) currentAddr = currentAddr.slice(0, -1);
  render(); saveState();
}
