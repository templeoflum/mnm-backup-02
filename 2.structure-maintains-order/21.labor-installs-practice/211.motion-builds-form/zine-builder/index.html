<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>editor · composes · zine</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 13px/1.4 system-ui, sans-serif; display: flex; height: 100vh; }
    #controls { width: 200px; padding: 16px; border-right: 1px solid #8884; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; overflow-y: auto; }
    /* never let the column squash a control: kit scrub/selector have overflow:hidden and
       would collapse to their 2px borders under flex-shrink. Keep natural height; scroll instead. */
    #controls > * { flex: 0 0 auto; }
    #controls strong { margin-top: 4px; }
    #layer, #pageOps, #project, #history { display: flex; gap: 6px; flex-wrap: wrap; }
    #presets { display: flex; flex-wrap: wrap; gap: 6px; }
    #pages { display: flex; flex-wrap: wrap; gap: 4px; }
    .pchip { min-width: 22px; text-align: center; padding: 3px 7px; border: 1px solid #8883; border-radius: 5px; cursor: pointer; font: 11px ui-monospace, monospace; }
    .pchip:hover { border-color: #4fb8e8; }
    .pchip.on { border-color: #4fb8e8; background: #4fb8e822; }
    #pile { display: flex; flex-direction: column; gap: 3px; width: 100%; max-height: 160px; overflow: auto; }
    #pile .row { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border: 1px solid #8883; border-radius: 5px; cursor: pointer; font-size: 11px; }
    #pile .row:hover { border-color: #4fb8e8; }
    #pile .row.on { border-color: #4fb8e8; background: #4fb8e822; }
    #pile .row .tag { opacity: .55; font: 10px ui-monospace, monospace; }
    #pile .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pile .row img { width: 22px; height: 22px; object-fit: cover; border-radius: 3px; }
    #readout { opacity: .7; }
    #hint { opacity: .55; font-size: 11px; }
    #stage { flex: 1; display: grid; place-items: center; overflow: auto; background: #8881; padding: 24px; }
    /* imposition preview (read-only view over the reading-order pages) */
    #stage.imposing { place-items: start; }
    .impo { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
    .impo .sheet { display: flex; flex-direction: column; gap: 5px; }
    .impo .lab { font: 11px ui-monospace, monospace; opacity: .6; }
    .impo svg.sheet-svg { box-shadow: 0 2px 12px #0004; background: #fff; }
    .impo .page-bg2 { fill: #fff; }
    .impo .blank { fill: #f3f3f3; stroke: #ccc; stroke-width: .02; stroke-dasharray: .12 .1; vector-effect: non-scaling-stroke; }
    .impo .pnum { fill: #4fb8e8; opacity: .16; font-family: ui-monospace, monospace; text-anchor: middle; dominant-baseline: central; }
    .impo .fold { stroke: #4fb8e8; stroke-width: 1; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; opacity: .7; }
    .impo .sheet-edge { fill: none; stroke: #999; stroke-width: 1; vector-effect: non-scaling-stroke; }
    svg.page { box-shadow: 0 2px 16px #0005; }
    svg.page .page-bg { fill: #fff; cursor: crosshair; }
    svg.page .atom { cursor: move; }
    /* atom-box: fill none EVERYWHERE (else it defaults to black fill in the preview's
       sheet-svg — that was the "black box"). Its guide stroke shows only in the editor. */
    .atom-box { fill: none; }
    /* pointer-events:all so the WHOLE text box catches clicks (select/drag/edit), not just
       the painted glyphs — a fill:none rect otherwise lets clicks fall through to page-bg. */
    svg.page .atom-box { stroke: #88f; stroke-width: .01; vector-effect: non-scaling-stroke; pointer-events: all; }
    /* wrapped text body (slice 11) — pure <text>/<tspan>, styled the same in the editor
       and the imposition preview (NOT scoped to svg.page, so it renders in both). */
    .atom-text-t { fill: #111; font-family: Georgia, 'Times New Roman', serif; }
    /* in-place text editor (slice 12) — a textarea overlaid on the atom while typing */
    .edit-overlay { position: fixed; z-index: 50; box-sizing: border-box; margin: 0;
      padding: 2px 4px; border: 1.5px solid #4fb8e8; background: #fff; color: #111;
      line-height: 1.3; resize: none; overflow: hidden; outline: none; }
    svg.page .sel-box { fill: none; stroke: #4fb8e8; stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
    svg.page .sel-handle { fill: #4fb8e8; stroke: #fff; stroke-width: 1; vector-effect: non-scaling-stroke; }
    svg.page .sel-handle[data-handle=nw], svg.page .sel-handle[data-handle=se] { cursor: nwse-resize; }
    svg.page .sel-handle[data-handle=ne], svg.page .sel-handle[data-handle=sw] { cursor: nesw-resize; }
  </style>
</head>
<body>
  <div id="controls">
    <strong>project</strong>
    <div id="project"><!-- save / open buttons mount here --></div>
    <div id="history"><!-- undo / redo buttons mount here --></div>
    <div id="output"><!-- impose toggle mounts here --></div>
    <hr style="width:100%;border:none;border-top:1px solid #8884;margin:4px 0">
    <strong>page</strong>
    <!-- kit controls (scrub / selector) mount here -->
    <small id="readout"></small>
    <hr style="width:100%;border:none;border-top:1px solid #8884;margin:4px 0">
    <strong>pages</strong>
    <div id="pages"></div>
    <div id="pageOps"><!-- add / move buttons mount here --></div>
    <hr style="width:100%;border:none;border-top:1px solid #8884;margin:4px 0">
    <strong>pile</strong>
    <div id="pileLoad"><!-- load button mounts here --></div>
    <div id="pile"></div>
    <hr style="width:100%;border:none;border-top:1px solid #8884;margin:4px 0">
    <strong>place</strong>
    <!-- kit kind selector mounts here -->
    <small id="hint">click the page to drop · click an atom to select · drag to move · corners resize · double-click text to edit</small>
    <strong>presets</strong>
    <div id="presets"><!-- a button per layout; click to apply (no preset is canon) --></div>
    <strong>layer</strong>
    <div id="layer"><!-- front / back buttons mount here --></div>
  </div>
  <div id="stage"></div>
  <script type="module">
    import { pageSVG, pageGeom } from './src/page.js';
    import { placeAtom, atomInRect, atomSVG, wrapLines } from './src/atom.js';
    import { moveAtom, resizeAtom, restack, moveItem, removeById } from './src/manip.js';
    import { PRESETS, presetRects } from './src/presets.js';
    import { toProject, fromProject } from './src/project.js';
    import { folderKind } from './src/pool.js';
    import { impose } from './src/impose.js';
    import { runProofs as pageProofs } from './src/page.proof.js';
    import { runProofs as atomProofs } from './src/atom.proof.js';
    import { runProofs as manipProofs } from './src/manip.proof.js';
    import { runProofs as presetProofs } from './src/presets.proof.js';
    import { runProofs as projectProofs } from './src/project.proof.js';
    import { runProofs as poolProofs } from './src/pool.proof.js';
    import { runProofs as imposeProofs } from './src/impose.proof.js';
    // kit controls — imported across the floor from the sibling unit (one source of truth).
    import { createScrub } from '../kit/src/scrub.js';
    import { createSelector } from '../kit/src/selector.js';
    import { createButton } from '../kit/src/button.js';

    const $ = (id) => document.getElementById(id);
    const HANDLE_PX = 10;       // resize-handle size, constant on screen

    // U0 net, printed every load — a net, not a gate; the page is the operator's eye.
    for (const [name, run] of [['page', pageProofs], ['atom', atomProofs], ['manip', manipProofs], ['presets', presetProofs], ['project', projectProofs], ['pool', poolProofs], ['impose', imposeProofs]]) {
      const proofs = run();
      console.log(`${name} proofs:`, proofs.every((p) => p.pass) ? 'ALL PASS' : 'FAIL');
      for (const p of proofs) console.log(p.pass ? '✓' : '✗', p.name, '—', p.detail);
    }

    // pages share one size (spec); each carries its own atoms. The current page is edited.
    let pages = [{ id: 'pg1', atoms: [] }];
    let current = 0;
    let pageN = 2;
    const cur = () => pages[current];

    let nextId = 1;
    let selectedId = null;
    let drag = null;            // { mode:'move'|'resize', corner?, lastX, lastY, perUnit }
    let moved = false;          // a drag actually moved → suppress the place-click
    const pile = [];            // loaded files: { id, kind, name, href? | text? }
    let placeFromId = null;     // active pile source, or null → placeholder/blank by kind
    let pileN = 1;
    const undoStack = [], redoStack = [];   // full-state snapshots; one per action / drag gesture
    const HISTORY_CAP = 50;
    let imposing = false;       // imposition preview mode — a read-only view, pages untouched
    let editingId = null, editEl = null;   // in-place text edit: the atom id + its overlay textarea
    let lastClick = { id: null, t: 0 };    // manual double-click detection (mousedown re-renders break native dblclick)

    // ── controls (kit) ──────────────────────────────────────────────
    const ctrl = $('controls');
    const wScrub = createScrub({ label: 'width', value: 5.5, min: 0.1, max: 200, step: 0.25, onInput: render });
    const hScrub = createScrub({ label: 'height', value: 8.5, min: 0.1, max: 200, step: 0.25, onInput: render });
    const unitSel = createSelector({ options: ['in', 'mm', 'px'], value: 'in', onChange: render });
    // choosing a kind in the place section releases any armed pile item — the two
    // place-sources never fight; you can always get back to placing a blank/placeholder.
    const kindSel = createSelector({ options: ['text', 'image'], value: 'text', onChange: () => { if (placeFromId) { placeFromId = null; renderPile(); updateHint(); } } });
    ctrl.insertBefore(wScrub.el, $('readout'));
    ctrl.insertBefore(hScrub.el, $('readout'));
    ctrl.insertBefore(unitSel.el, $('readout'));
    ctrl.insertBefore(kindSel.el, $('hint'));
    const front = createButton({ label: 'front', onClick: () => { if (selectedId) { pushUndo(); cur().atoms = restack(cur().atoms, selectedId, 'front'); render(); } } });
    const back = createButton({ label: 'back', onClick: () => { if (selectedId) { pushUndo(); cur().atoms = restack(cur().atoms, selectedId, 'back'); render(); } } });
    const del = createButton({ label: 'delete', onClick: deleteSelected });
    $('layer').append(back.el, front.el, del.el);

    // presets: a button per layout — click to drop atoms into its slots (no preset is canon).
    for (const p of PRESETS) $('presets').append(createButton({ label: p.name, onClick: () => applyPreset(p) }).el);

    // the current place source: an armed pile item (kind + content) or a blank/placeholder of the chosen kind.
    function placeMode() {
      const item = pile.find((q) => q.id === placeFromId);
      const kind = item ? item.kind : kindSel.get();
      const source = item ? (item.kind === 'image' ? { href: item.href } : { text: item.text }) : undefined;
      return { kind, source };
    }

    /** @param {{ name:string, slots:any[] }} preset */
    function applyPreset(preset) {
      pushUndo();
      const { kind, source } = placeMode();
      for (const rect of presetRects(preset, spec())) cur().atoms.push(atomInRect(kind, rect, 'a' + nextId++, source));
      selectedId = null;
      render();
    }

    // ── project: save (download a timestamped file, never overwrite) · open ──
    const projInput = document.createElement('input');
    projInput.type = 'file'; projInput.accept = '.json,application/json'; projInput.style.display = 'none';
    projInput.addEventListener('change', () => {
      const f = projInput.files && projInput.files[0];
      if (f) { const r = new FileReader(); r.onload = () => openProject(String(r.result)); r.readAsText(f); }
      projInput.value = '';
    });
    const saveBtn = createButton({ label: 'save', onClick: saveProject });
    const openBtn = createButton({ label: 'open', onClick: () => projInput.click() });
    $('project').append(saveBtn.el, openBtn.el, projInput);

    function saveProject() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
      const json = JSON.stringify(toProject({ spec: spec(), pages }), null, 2);
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = `zine.${stamp}.json`; a.click();
      URL.revokeObjectURL(url);
    }

    /** @param {string} text */
    function openProject(text) {
      try {
        const st = fromProject(JSON.parse(text));
        wScrub.set(st.spec.w, true); hScrub.set(st.spec.h, true); unitSel.set(st.spec.unit, true);
        pages = st.pages; current = 0; selectedId = null; placeFromId = null;
        // reseed id counters past anything loaded, so new atoms/pages don't collide.
        let maxA = 0, maxP = 0;
        for (const pg of pages) {
          const mp = /^pg(\d+)$/.exec(pg.id); if (mp) maxP = Math.max(maxP, +mp[1]);
          for (const at of pg.atoms) { const ma = /^a(\d+)$/.exec(at.id); if (ma) maxA = Math.max(maxA, +ma[1]); }
        }
        nextId = maxA + 1; pageN = maxP + 1;
        renderPages(); renderPile(); render();
      } catch (e) { $('readout').textContent = 'open failed: ' + (e && e.message || e); }
    }

    // ── history: undo / redo (full-state snapshots) ──────────────────
    const undoBtn = createButton({ label: 'undo', onClick: undo });
    const redoBtn = createButton({ label: 'redo', onClick: redo });
    $('history').append(undoBtn.el, redoBtn.el);

    // ── output: imposition preview toggle (non-destructive view) ─────
    const imposeBtn = createButton({ label: 'impose', onClick: () => {
      imposing = !imposing;
      imposeBtn.el.textContent = imposing ? '← editing' : 'impose';
      selectedId = null;
      render();
    } });
    $('output').append(imposeBtn.el);

    /** the whole composition, deep-cloned — page size + pages/atoms + view state. */
    function snapshot() {
      return { pw: wScrub.get(), ph: hScrub.get(), unit: unitSel.get(), pages: structuredClone(pages), current, selectedId };
    }
    /** call BEFORE a mutating action: bank the pre-action state, drop the redo branch. */
    function pushUndo() {
      undoStack.push(snapshot());
      if (undoStack.length > HISTORY_CAP) undoStack.shift();
      redoStack.length = 0;
    }
    /** @param {ReturnType<typeof snapshot>} s */
    function applyState(s) {
      wScrub.set(s.pw, true); hScrub.set(s.ph, true); unitSel.set(s.unit, true);
      pages = structuredClone(s.pages);
      current = Math.min(s.current, pages.length - 1);
      selectedId = s.selectedId;
      renderPages(); render();
    }
    function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); applyState(undoStack.pop()); }
    function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); applyState(redoStack.pop()); }

    // ── delete: the selected atom · the current page (keep ≥1) ───────
    function deleteSelected() {
      if (!selectedId) return;
      pushUndo();
      cur().atoms = removeById(cur().atoms, selectedId);
      selectedId = null;
      render();
    }
    function deletePage() {
      if (pages.length <= 1) return;
      pushUndo();
      pages = pages.filter((_, i) => i !== current);
      current = Math.min(current, pages.length - 1);
      selectedId = null;
      renderPages(); render();
    }

    document.addEventListener('keydown', (e) => {
      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) { e.preventDefault(); deleteSelected(); }
      else if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
      else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); redo(); }
    });

    // ── pages: add · navigate · reorder ──────────────────────────────
    const addPage = createButton({ label: '+ page', onClick: () => { pushUndo(); pages.push({ id: 'pg' + pageN++, atoms: [] }); navigate(pages.length - 1); } });
    const movePrev = createButton({ label: '◀ move', onClick: () => { if (current > 0) { pushUndo(); pages = moveItem(pages, current, current - 1); current--; renderPages(); } } });
    const moveNext = createButton({ label: 'move ▶', onClick: () => { if (current < pages.length - 1) { pushUndo(); pages = moveItem(pages, current, current + 1); current++; renderPages(); } } });
    const delPage = createButton({ label: '− page', onClick: deletePage });
    $('pageOps').append(addPage.el, movePrev.el, moveNext.el, delPage.el);

    function navigate(i) { current = Math.max(0, Math.min(pages.length - 1, i)); selectedId = null; renderPages(); render(); }

    function renderPages() {
      const strip = $('pages'); strip.innerHTML = '';
      pages.forEach((pg, i) => {
        const chip = document.createElement('span');
        chip.className = 'pchip' + (i === current ? ' on' : '');
        chip.textContent = String(i + 1);
        chip.addEventListener('click', () => navigate(i));
        strip.appendChild(chip);
      });
    }

    // ── pile: load your own files, place from them ───────────────────
    const fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.multiple = true; fileInput.accept = 'image/*,text/*,.txt,.md';
    fileInput.style.display = 'none';
    fileInput.addEventListener('change', () => { loadFiles(fileInput.files); fileInput.value = ''; });
    const loadBtn = createButton({ label: 'load files', onClick: () => fileInput.click() });
    $('pileLoad').append(loadBtn.el, fileInput);

    // local-folder pool — the same pile, filled from a real folder via the File System
    // Access API (Chromium, secure context). The editor never knows the source; folder
    // entries funnel into `pile` exactly like uploads. Drive later rides this same seam.
    if (window.showDirectoryPicker) {
      const folderBtn = createButton({ label: 'load folder', onClick: loadFolder });
      $('pileLoad').append(folderBtn.el);
    }

    /** Read one file into a pile item (shared by upload + folder). @param {File} file @param {'image'|'text'} kind */
    function addFile(file, kind) {
      const reader = new FileReader();
      const item = { id: 'p' + pileN++, kind, name: file.name, href: '', text: '' };
      reader.onload = () => {
        if (kind === 'image') item.href = String(reader.result);
        else item.text = String(reader.result);
        pile.push(item);
        renderPile();
      };
      if (kind === 'image') reader.readAsDataURL(file); else reader.readAsText(file);
    }

    /** @param {FileList|null} files — upload pool: the input's `accept` already filtered. */
    function loadFiles(files) {
      for (const file of Array.from(files || [])) {
        addFile(file, file.type.startsWith('image/') ? 'image' : 'text');
      }
    }

    /** local-folder pool: pick a folder once, classify each entry by extension, place from it. */
    async function loadFolder() {
      let dir;
      try { dir = await window.showDirectoryPicker(); }
      catch { return; }                       // user cancelled the picker
      for await (const entry of dir.values()) {
        if (entry.kind !== 'file') continue;  // top-level files only (no recursion for v1)
        const kind = folderKind(entry.name);
        if (!kind) continue;                  // skip non-placeable types
        addFile(await entry.getFile(), kind);
      }
    }

    function renderPile() {
      const box = $('pile');
      box.innerHTML = '';
      for (const item of pile) {
        const row = document.createElement('div');
        row.className = 'row' + (item.id === placeFromId ? ' on' : '');
        const thumb = item.kind === 'image' ? `<img src="${item.href}" alt="">` : `<span class="tag">txt</span>`;
        row.innerHTML = `${thumb}<span class="nm">${item.name}</span>`;
        row.addEventListener('click', () => {
          placeFromId = (placeFromId === item.id) ? null : item.id;
          renderPile(); updateHint();
        });
        box.appendChild(row);
      }
    }

    function updateHint() {
      const item = pile.find((p) => p.id === placeFromId);
      $('hint').textContent = item
        ? `click the page to place "${item.name}" · click it again in the pile to release`
        : 'click the page to drop · click an atom to select · drag to move · corners resize · double-click text to edit';
    }

    function spec() { return { w: wScrub.get(), h: hScrub.get(), unit: unitSel.get() }; }

    // wrap text atoms for rendering: pre-measure each into `.lines` that fit its box, using
    // a canvas measurer at a normal font size (dodging canvas small-font quirks at page scale).
    // Returns copies — the stored atoms keep no render state (project save stays clean).
    const DEFAULT_FONT = "Georgia, 'Times New Roman', serif";
    const _measureCtx = document.createElement('canvas').getContext('2d');
    function wrapAtoms(atoms) {
      return atoms.map((a) => {
        if (a.kind !== 'text') return a;
        const pad = a.size * 0.3;
        const avail = Math.max(a.w - pad * 2, a.size);     // never below one glyph wide
        const REF = 64, k = REF / a.size;                  // measure at 64px, scale back to page units
        _measureCtx.font = `${REF}px ${a.font || DEFAULT_FONT}`;
        const measure = (s) => _measureCtx.measureText(s).width / k;
        return { ...a, lines: wrapLines(a.text, avail, measure) };
      });
    }

    // screen px per page unit, from the live svg (viewBox is in page units).
    function perUnitOf(svg) {
      const vb = svg.viewBox.baseVal.width;
      return vb ? svg.getBoundingClientRect().width / vb : 1;
    }

    // ── imposition preview ───────────────────────────────────────────
    // One printed side = a 2×-wide sheet holding two source pages (left|right). Each half
    // is a `<g transform>` + clipPath, NOT a nested <svg>: text (and foreignObject) don't
    // render reliably inside a nested <svg> viewport, but do in a <g> in the top svg. The
    // clipPath keeps each page's content in its half. `key` makes the clip id unique.
    function sheetSideSVG(slots, g, scale, key) {
      const cid = `hc-${key}`;
      const half = (idx, xOff) => {
        const body = idx === null || !pages[idx]
          ? `<rect class="blank" x="0" y="0" width="${g.w}" height="${g.h}"/>`
          : `<rect class="page-bg2" x="0" y="0" width="${g.w}" height="${g.h}"/>`
            // faint page-number watermark so the fold order is legible at a glance (preview aid, not on the artifact).
            + `<text class="pnum" x="${g.w / 2}" y="${g.h / 2}" font-size="${g.h * 0.4}">${idx + 1}</text>`
            + wrapAtoms(pages[idx].atoms).map(atomSVG).join('');
        return `<g transform="translate(${xOff} 0)"><g clip-path="url(#${cid})">${body}</g></g>`;
      };
      return [
        `<svg class="sheet-svg" xmlns="http://www.w3.org/2000/svg"`,
        `width="${g.pxW * 2 * scale}" height="${g.pxH * scale}" viewBox="0 0 ${g.w * 2} ${g.h}">`,
        `<defs><clipPath id="${cid}"><rect x="0" y="0" width="${g.w}" height="${g.h}"/></clipPath></defs>`,
        half(slots[0], 0), half(slots[1], g.w),
        `<line class="fold" x1="${g.w}" y1="0" x2="${g.w}" y2="${g.h}"/>`,
        `<rect class="sheet-edge" x="0" y="0" width="${g.w * 2}" height="${g.h}"/>`,
        `</svg>`,
      ].join(' ');
    }

    function renderImposition() {
      const g = pageGeom(spec());
      const scale = 300 / (g.pxW * 2);     // fit each sheet-side to ~300px wide
      const imp = impose(pages.length, 'saddle-stitch');
      const cards = imp.sheets.map((s, k) => `<div class="sheet">`
        + `<div class="lab">sheet ${k + 1} · front</div>${sheetSideSVG(s.front, g, scale, k + 'f')}`
        + `<div class="lab">sheet ${k + 1} · back</div>${sheetSideSVG(s.back, g, scale, k + 'b')}`
        + `</div>`).join('');
      $('stage').innerHTML = `<div class="impo">${cards}</div>`;
      $('readout').textContent = `saddle-stitch · ${imp.pageCount} page${imp.pageCount === 1 ? '' : 's'} → ${imp.sheetCount} sheet${imp.sheetCount === 1 ? '' : 's'} · print double-sided, stack, fold, staple`;
    }

    function render() {
      $('stage').classList.toggle('imposing', imposing);
      if (imposing) { try { renderImposition(); } catch (e) { $('stage').innerHTML = ''; $('readout').textContent = String(e && e.message || e); } return; }
      try {
        const atoms = cur().atoms;
        $('stage').innerHTML = pageSVG(spec(), 1, wrapAtoms(atoms));
        const g = pageGeom(spec());
        $('readout').textContent = `${g.w}×${g.h} ${g.unit}  →  ${Math.round(g.pxW)}×${Math.round(g.pxH)} px · page ${current + 1}/${pages.length} · ${atoms.length} atom${atoms.length === 1 ? '' : 's'}`;
        drawSelection();
      } catch (e) {
        $('stage').innerHTML = '';
        $('readout').textContent = String(e && e.message || e);
      }
    }

    // selection overlay: an outline + four corner handles, sized constant on screen.
    function drawSelection() {
      const svg = $('stage').querySelector('svg.page');
      if (!svg || !selectedId) return;
      const a = cur().atoms.find((x) => x.id === selectedId);
      if (!a) { selectedId = null; return; }
      const hs = HANDLE_PX / perUnitOf(svg);   // handle size in page units
      const corners = [['nw', a.x, a.y], ['ne', a.x + a.w, a.y], ['sw', a.x, a.y + a.h], ['se', a.x + a.w, a.y + a.h]];
      const handles = corners.map(([c, cx, cy]) =>
        `<rect class="sel-handle" data-handle="${c}" x="${cx - hs / 2}" y="${cy - hs / 2}" width="${hs}" height="${hs}"/>`).join('');
      svg.insertAdjacentHTML('beforeend',
        `<g class="sel-overlay"><rect class="sel-box" x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}"/>${handles}</g>`);
    }

    // ── in-place text editing (slice 12) — a textarea overlaid on the atom ──
    // Type directly into a text box; commit on click-away (blur), cancel on Escape. The
    // tspan render is static, so editing happens in a real <textarea> positioned over the
    // atom (the resolved render fork: smooth typing without foreignObject's render trap).
    function startEditing(atom) {
      finishEditing();                                  // commit any open editor first
      const svg = stage.querySelector('svg.page');
      if (!svg) return;
      const ctm = svg.getScreenCTM();
      const toScreen = (x, y) => { const pt = svg.createSVGPoint(); pt.x = x; pt.y = y; return pt.matrixTransform(ctm); };
      const tl = toScreen(atom.x, atom.y), br = toScreen(atom.x + atom.w, atom.y + atom.h);
      const perUnit = (br.x - tl.x) / atom.w;
      const ta = document.createElement('textarea');
      ta.className = 'edit-overlay';
      ta.value = atom.text;
      Object.assign(ta.style, {
        left: `${tl.x}px`, top: `${tl.y}px`, width: `${br.x - tl.x}px`, height: `${br.y - tl.y}px`,
        fontSize: `${atom.size * perUnit}px`, fontFamily: atom.font || DEFAULT_FONT,
      });
      document.body.appendChild(ta);
      editingId = atom.id; editEl = ta;
      ta.focus(); ta.select();
      ta.addEventListener('blur', finishEditing);
      ta.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); cancelEditing(); } });
    }
    function finishEditing() {                           // commit
      if (!editEl) return;
      const el = editEl, id = editingId, val = editEl.value;
      editEl = null; editingId = null; el.remove();
      const atom = cur().atoms.find((a) => a.id === id);
      if (atom && atom.text !== val) { pushUndo(); atom.text = val; }   // one undo entry per edit, pre-change
      render();
    }
    function cancelEditing() {                           // discard — blur then sees editEl=null, no commit
      if (!editEl) return;
      const el = editEl; editEl = null; editingId = null; el.remove(); render();
    }

    // ── pointer (delegated on #stage, so it survives re-renders) ──────
    const stage = $('stage');
    stage.addEventListener('mousedown', (e) => {
      const svg = stage.querySelector('svg.page');
      if (!svg) return;
      const perUnit = perUnitOf(svg);
      const handle = e.target.closest?.('[data-handle]');
      const atomEl = e.target.closest?.('[data-id]');
      moved = false;
      if (handle && selectedId) {
        drag = { mode: 'resize', corner: handle.dataset.handle, lastX: e.clientX, lastY: e.clientY, perUnit };
        e.preventDefault();
      } else if (atomEl) {
        const id = atomEl.dataset.id;
        const atom = cur().atoms.find((a) => a.id === id);
        const t = Date.now();
        // second mousedown on the same text atom within 350ms → edit in place (not a drag).
        if (atom && atom.kind === 'text' && lastClick.id === id && t - lastClick.t < 350) {
          lastClick = { id: null, t: 0 };
          e.preventDefault();
          startEditing(atom);
          return;
        }
        lastClick = { id, t };
        selectedId = id;
        drag = { mode: 'move', lastX: e.clientX, lastY: e.clientY, perUnit };
        render();              // show handles immediately
        e.preventDefault();
      }
      // mousedown on the bare page → leave it; the click handler places there.
    });

    document.addEventListener('mousemove', (e) => {
      if (!drag) return;
      const dx = (e.clientX - drag.lastX) / drag.perUnit;
      const dy = (e.clientY - drag.lastY) / drag.perUnit;
      if (!dx && !dy) return;
      if (!moved) pushUndo();          // one undo entry per drag gesture (captured pre-move)
      moved = true;
      const atoms = cur().atoms;
      const i = atoms.findIndex((a) => a.id === selectedId);
      if (i < 0) return;
      atoms[i] = drag.mode === 'move' ? moveAtom(atoms[i], dx, dy) : resizeAtom(atoms[i], drag.corner, dx, dy);
      drag.lastX = e.clientX; drag.lastY = e.clientY;
      render();
    });
    document.addEventListener('mouseup', () => { drag = null; });

    // click the bare page → drop the chosen kind, centred, and select it.
    stage.addEventListener('click', (e) => {
      if (moved) { moved = false; return; }          // that was a drag, not a place
      const svg = stage.querySelector('svg.page');
      if (!svg || !e.target.classList.contains('page-bg')) return;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());   // → page units
      pushUndo();
      const { kind, source } = placeMode();
      const a = placeAtom(kind, p.x, p.y, spec(), 'a' + nextId++, source);
      cur().atoms.push(a);
      selectedId = a.id;
      render();
    });

    renderPages();
    render();
  </script>
</body>
</html>
