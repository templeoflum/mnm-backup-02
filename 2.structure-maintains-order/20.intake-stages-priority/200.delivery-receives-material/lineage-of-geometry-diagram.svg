<svg viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#E0B24A"/>
    </marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8A97A0"/>
    </marker>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4D27A"/>
      <stop offset="100%" stop-color="#D49E33"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#2A3A47" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="1200" height="1600" fill="#14202B"/>
  <rect width="1200" height="1600" fill="url(#grid)"/>

  <!-- ===== TITLE ===== -->
  <text x="70" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#E8E4D8" font-weight="bold">The Lineage of Geometry</text>
  <text x="72" y="112" font-family="'Courier New', monospace" font-size="15" fill="#E0B24A" letter-spacing="2">FROM EARTH-MEASUREMENT TO &#8734;-TOPOI</text>
  <line x1="70" y1="132" x2="1130" y2="132" stroke="#2F4150" stroke-width="1"/>

  <!-- ===== TIME ARROW (left) ===== -->
  <line x1="48" y1="250" x2="48" y2="1340" stroke="#8A97A0" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <text x="40" y="250" font-family="'Courier New', monospace" font-size="12" fill="#8A97A0" text-anchor="end">c.300 BC</text>
  <text x="40" y="660" font-family="'Courier New', monospace" font-size="12" fill="#8A97A0" text-anchor="end">19th c.</text>
  <text x="40" y="1325" font-family="'Courier New', monospace" font-size="12" fill="#8A97A0" text-anchor="end">now</text>

  <!-- ===== TRUNK HEADERS ===== -->
  <!-- I synthetic -->
  <rect x="207" y="168" width="11" height="11" fill="#B7C4CE"/>
  <text x="225" y="178" font-size="14" fill="#B7C4CE" font-weight="bold">I · Synthetic</text>
  <!-- II projective -->
  <rect x="372" y="168" width="11" height="11" fill="#7FA8A0"/>
  <text x="390" y="178" font-size="14" fill="#7FA8A0" font-weight="bold">II · Projective</text>
  <!-- V topology -->
  <rect x="472" y="200" width="11" height="11" fill="#6E8FB0"/>
  <text x="490" y="210" font-size="14" fill="#6E8FB0" font-weight="bold">V · Topology</text>
  <!-- III coordinate-algebraic -->
  <rect x="562" y="168" width="11" height="11" fill="#9D8EC4"/>
  <text x="580" y="178" font-size="14" fill="#9D8EC4" font-weight="bold">III · Coordinate&#8211;Algebraic</text>
  <!-- IV differential -->
  <rect x="747" y="168" width="11" height="11" fill="#C98F6B"/>
  <text x="765" y="178" font-size="14" fill="#C98F6B" font-weight="bold">IV · Differential</text>

  <!-- ===== TRUNK LINES ===== -->
  <!-- lead-ins (dotted) + solid stems down to convergence y=1180 -->
  <!-- I x=235 origin 250 -->
  <line x1="235" y1="188" x2="235" y2="250" stroke="#B7C4CE" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>
  <line x1="235" y1="250" x2="235" y2="1180" stroke="#B7C4CE" stroke-width="2"/>
  <!-- II x=400 origin 470 -->
  <line x1="400" y1="188" x2="400" y2="470" stroke="#7FA8A0" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>
  <line x1="400" y1="470" x2="400" y2="1180" stroke="#7FA8A0" stroke-width="2"/>
  <!-- V x=500 origin 520 -->
  <line x1="500" y1="216" x2="500" y2="520" stroke="#6E8FB0" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>
  <line x1="500" y1="520" x2="500" y2="1180" stroke="#6E8FB0" stroke-width="2"/>
  <!-- III x=590 origin 440 -->
  <line x1="590" y1="188" x2="590" y2="440" stroke="#9D8EC4" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>
  <line x1="590" y1="440" x2="590" y2="1180" stroke="#9D8EC4" stroke-width="2"/>
  <!-- IV x=775 origin 560 -->
  <line x1="775" y1="188" x2="775" y2="560" stroke="#C98F6B" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>
  <line x1="775" y1="560" x2="775" y2="1180" stroke="#C98F6B" stroke-width="2"/>

  <!-- convergence to canopy diamond at (560,1300) -->
  <path d="M235,1180 C235,1245 560,1235 560,1295" fill="none" stroke="#B7C4CE" stroke-width="2" opacity="0.85"/>
  <path d="M400,1180 C400,1245 560,1240 560,1295" fill="none" stroke="#7FA8A0" stroke-width="2" opacity="0.85"/>
  <path d="M500,1180 C500,1240 560,1255 560,1295" fill="none" stroke="#6E8FB0" stroke-width="2" opacity="0.85"/>
  <path d="M590,1180 C590,1240 560,1255 560,1295" fill="none" stroke="#9D8EC4" stroke-width="2" opacity="0.85"/>
  <path d="M775,1180 C775,1245 560,1238 560,1295" fill="none" stroke="#C98F6B" stroke-width="2" opacity="0.85"/>

  <!-- ===== NODES (circles) + labels ===== -->
  <!-- helper style: name bold 13, descriptor 11 slate -->

  <!-- I: Euclid -->
  <circle cx="235" cy="250" r="6" fill="#B7C4CE"/>
  <text x="250" y="247" font-size="13" fill="#E8E4D8" font-weight="bold">Euclid · c.300 BC</text>
  <text x="250" y="263" font-size="11" fill="#8A97A0">axioms of flat space</text>
  <!-- I: non-Euclidean branch -->
  <circle cx="235" cy="600" r="6" fill="#B7C4CE"/>
  <text x="250" y="597" font-size="13" fill="#E8E4D8" font-weight="bold">Non-Euclidean · 1820s&#8211;30s</text>
  <text x="250" y="613" font-size="11" fill="#8A97A0">Gauss · Bolyai · Lobachevsky</text>

  <!-- II: Desargues -->
  <circle cx="400" cy="470" r="6" fill="#7FA8A0"/>
  <text x="415" y="467" font-size="13" fill="#E8E4D8" font-weight="bold">Desargues · 1639</text>
  <text x="415" y="483" font-size="11" fill="#8A97A0">perspective &#8594; projection</text>
  <!-- II: Poncelet (small) -->
  <circle cx="400" cy="555" r="4.5" fill="#7FA8A0"/>
  <text x="415" y="559" font-size="11" fill="#8A97A0">Poncelet revives, 1822</text>

  <!-- III: Descartes/Fermat -->
  <circle cx="590" cy="440" r="6" fill="#9D8EC4"/>
  <text x="605" y="437" font-size="13" fill="#E8E4D8" font-weight="bold">Descartes &amp; Fermat · 1637</text>
  <text x="605" y="453" font-size="11" fill="#8A97A0">algebra grafted onto figures</text>

  <!-- IV: Gauss Theorema Egregium (label LEFT) -->
  <circle cx="775" cy="560" r="6" fill="#C98F6B"/>
  <text x="760" y="552" font-size="13" fill="#E8E4D8" font-weight="bold" text-anchor="end">Gauss · 1827</text>
  <text x="760" y="568" font-size="11" fill="#8A97A0" text-anchor="end">Theorema Egregium (curvature)</text>

  <!-- V: Euler -->
  <circle cx="500" cy="520" r="6" fill="#6E8FB0"/>
  <text x="515" y="517" font-size="13" fill="#E8E4D8" font-weight="bold">Euler · 1736</text>
  <text x="515" y="533" font-size="11" fill="#8A97A0">Königsberg bridges</text>
  <!-- V: Poincaré -->
  <circle cx="500" cy="795" r="6" fill="#6E8FB0"/>
  <text x="515" y="792" font-size="13" fill="#E8E4D8" font-weight="bold">Poincaré · 1895</text>
  <text x="515" y="808" font-size="11" fill="#8A97A0">Analysis Situs</text>

  <!-- IV: Riemann (node + opens local-structure) label LEFT -->
  <circle cx="775" cy="660" r="7" fill="#C98F6B" stroke="#E8E4D8" stroke-width="1"/>
  <text x="760" y="652" font-size="13" fill="#E8E4D8" font-weight="bold" text-anchor="end">Riemann · 1854</text>
  <text x="760" y="668" font-size="11" fill="#8A97A0" text-anchor="end">manifolds + local metric (Axis 3 opens)</text>

  <!-- ===== UNIFICATION TIES (gold) ===== -->
  <!-- Klein 1872: ties I, II, (and method into transformation groups) across x235..590 at y=735 -->
  <line x1="235" y1="735" x2="590" y2="735" stroke="#E0B24A" stroke-width="2.5"/>
  <circle cx="235" cy="735" r="5" fill="#E0B24A"/>
  <circle cx="400" cy="735" r="5" fill="#E0B24A"/>
  <rect x="600" y="718" width="300" height="40" rx="4" fill="#1C2C38" stroke="#E0B24A" stroke-width="1"/>
  <text x="612" y="736" font-size="13" fill="#F4D27A" font-weight="bold">KLEIN · 1872 — Erlangen Program</text>
  <text x="612" y="751" font-size="11" fill="#C9B27E">geometry = invariants of a transformation group</text>

  <!-- Cartan 1920s: fuses Klein-tie with Riemann; span x235..775 y=890 -->
  <line x1="235" y1="890" x2="775" y2="890" stroke="#E0B24A" stroke-width="3"/>
  <circle cx="235" cy="890" r="5" fill="#E0B24A"/>
  <circle cx="775" cy="890" r="6" fill="url(#gold)"/>
  <rect x="232" y="908" width="330" height="40" rx="4" fill="#1C2C38" stroke="#E0B24A" stroke-width="1.2"/>
  <text x="244" y="926" font-size="13" fill="#F4D27A" font-weight="bold">CARTAN · ~1920s — the fusion</text>
  <text x="244" y="941" font-size="11" fill="#C9B27E">Klein model G/H curved locally à la Riemann (Axes 1+3)</text>
  <!-- Ehresmann note -->
  <circle cx="500" cy="965" r="4.5" fill="#E0B24A"/>
  <text x="515" y="969" font-size="11" fill="#C9B27E">Ehresmann ~1950 — principal bundles &amp; connections &#8594; gauge theory</text>

  <!-- Grothendieck 1960s: trunk III node + tie (algebra + method) -->
  <circle cx="590" cy="1035" r="7" fill="url(#gold)"/>
  <line x1="590" y1="1035" x2="900" y2="1035" stroke="#E0B24A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="600" y="1017" width="300" height="40" rx="4" fill="#1C2C38" stroke="#E0B24A" stroke-width="1"/>
  <text x="612" y="1035" font-size="13" fill="#F4D27A" font-weight="bold">GROTHENDIECK · 1960s — schemes, topoi</text>
  <text x="612" y="1050" font-size="11" fill="#C9B27E">space as functor; method (Axis 2) begins dissolving</text>

  <!-- Lurie 2009 -->
  <line x1="235" y1="1130" x2="775" y2="1130" stroke="#E0B24A" stroke-width="2.5"/>
  <circle cx="590" cy="1130" r="6" fill="url(#gold)"/>
  <rect x="600" y="1112" width="300" height="40" rx="4" fill="#1C2C38" stroke="#E0B24A" stroke-width="1"/>
  <text x="612" y="1130" font-size="13" fill="#F4D27A" font-weight="bold">LURIE · ~2009 — &#8734;-topoi / derived</text>
  <text x="612" y="1145" font-size="11" fill="#C9B27E">schemes, manifolds, homotopy types as one</text>

  <!-- Scholze–Clausen 2019–24 -->
  <line x1="400" y1="1215" x2="775" y2="1215" stroke="#E0B24A" stroke-width="2.5"/>
  <circle cx="590" cy="1215" r="6" fill="url(#gold)"/>
  <rect x="600" y="1197" width="300" height="40" rx="4" fill="#1C2C38" stroke="#E0B24A" stroke-width="1"/>
  <text x="612" y="1215" font-size="13" fill="#F4D27A" font-weight="bold">CLAUSEN&#8211;SCHOLZE · 2019&#8211;24</text>
  <text x="612" y="1230" font-size="11" fill="#C9B27E">condensed math, analytic stacks — reopening</text>

  <!-- ===== CANOPY DIAMOND ===== -->
  <g transform="translate(560,1300)">
    <rect x="-26" y="-26" width="52" height="52" transform="rotate(45)" fill="url(#gold)" stroke="#E8E4D8" stroke-width="1.5"/>
  </g>
  <text x="560" y="1305" font-size="15" fill="#14202B" font-weight="bold" text-anchor="middle">&#8734;</text>
  <text x="560" y="1360" font-size="14" fill="#F4D27A" font-weight="bold" text-anchor="middle">current canopy</text>
  <text x="560" y="1378" font-size="12" fill="#C9B27E" text-anchor="middle">&#8734;-topos · derived &amp; condensed geometry</text>

  <!-- ===== CYCLE ARROW ===== -->
  <path d="M598,1300 C760,1290 900,1180 900,980 C900,820 870,760 770,735" fill="none" stroke="#E0B24A" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.8" marker-end="url(#arrow)"/>
  <text x="912" y="1010" font-size="12" fill="#C9B27E" transform="rotate(90 912 1010)">the cycle &#8594; each summit becomes the next trunk to subdivide</text>

  <!-- ===== RIGHT PANEL ===== -->
  <line x1="930" y1="200" x2="930" y2="1180" stroke="#2F4150" stroke-width="1"/>

  <!-- Three Axes -->
  <text x="955" y="230" font-family="Georgia, serif" font-size="18" fill="#E8E4D8" font-weight="bold">The Three Axes</text>
  <rect x="955" y="248" width="200" height="64" rx="4" fill="#1C2C38"/>
  <text x="966" y="270" font-size="12" fill="#B7C4CE" font-weight="bold">1 · transformation group</text>
  <text x="966" y="287" font-size="11" fill="#8A97A0">Klein — what may move</text>
  <text x="966" y="304" font-size="10" fill="#E0B24A">unified with 3 ✓</text>

  <rect x="955" y="320" width="200" height="64" rx="4" fill="#1C2C38"/>
  <text x="966" y="342" font-size="12" fill="#9D8EC4" font-weight="bold">2 · method / tool</text>
  <text x="966" y="359" font-size="11" fill="#8A97A0">how you compute &amp; prove</text>
  <text x="966" y="376" font-size="10" fill="#E0B24A">dissolving into topos/HoTT</text>

  <rect x="955" y="392" width="200" height="64" rx="4" fill="#1C2C38"/>
  <text x="966" y="414" font-size="12" fill="#C98F6B" font-weight="bold">3 · local structure</text>
  <text x="966" y="431" font-size="11" fill="#8A97A0">Riemann — patch by patch</text>
  <text x="966" y="448" font-size="10" fill="#E0B24A">unified with 1 ✓ (Cartan)</text>

  <!-- Rigidity spectrum -->
  <text x="955" y="510" font-family="Georgia, serif" font-size="18" fill="#E8E4D8" font-weight="bold">Rigidity Spectrum</text>
  <text x="955" y="528" font-size="11" fill="#8A97A0">stricter group = more invariants</text>

  <!-- nested ladder -->
  <g font-size="12" fill="#E8E4D8">
    <rect x="955" y="542" width="200" height="30" rx="3" fill="#21323F" stroke="#2F4150"/>
    <text x="965" y="561">topological &#8212; holes, dimension</text>
    <rect x="965" y="578" width="180" height="30" rx="3" fill="#26414e" stroke="#2F4150"/>
    <text x="975" y="597">projective &#8212; incidence</text>
    <rect x="975" y="614" width="160" height="30" rx="3" fill="#2c4a59" stroke="#2F4150"/>
    <text x="985" y="633">affine &#8212; parallelism</text>
    <rect x="985" y="650" width="140" height="30" rx="3" fill="#335463" stroke="#2F4150"/>
    <text x="995" y="669">similarity &#8212; angle, ratio</text>
    <rect x="995" y="686" width="120" height="30" rx="3" fill="#3a5d6e" stroke="#2F4150"/>
    <text x="1005" y="705">rigid &#8212; distance</text>
  </g>
  <line x1="945" y1="542" x2="945" y2="716" stroke="#E0B24A" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <text x="922" y="630" font-size="11" fill="#8A97A0" transform="rotate(-90 922 630)">looser &#8594; stricter</text>

  <!-- two definitions box -->
  <rect x="955" y="760" width="200" height="120" rx="4" fill="#1C2C38" stroke="#2F4150"/>
  <text x="966" y="782" font-size="13" fill="#F4D27A" font-weight="bold">Two engines</text>
  <text x="966" y="803" font-size="11" fill="#B7C4CE">Klein (1872): geometry =</text>
  <text x="966" y="818" font-size="11" fill="#8A97A0">invariants of a group action</text>
  <text x="966" y="840" font-size="11" fill="#C98F6B">Riemann (1854): geometry =</text>
  <text x="966" y="855" font-size="11" fill="#8A97A0">a space with local structure</text>
  <text x="966" y="874" font-size="11" fill="#E0B24A">Cartan bridges them.</text>

  <!-- ===== FOOTER ===== -->
  <line x1="70" y1="1430" x2="1130" y2="1430" stroke="#2F4150" stroke-width="1"/>
  <text x="70" y="1455" font-size="12" fill="#8A97A0">Not to scale. The four-trunk / three-axis / unification-cycle framing is one coherent organizing lens, not the only valid division.</text>
  <text x="70" y="1474" font-size="12" fill="#8A97A0">Names and dates mark widely recognized landmarks; frontier nodes reflect work current as of 2024&#8211;2025.</text>
</svg>
