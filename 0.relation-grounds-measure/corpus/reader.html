<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>corpus reader</title>
<style>
  :root { --bg: #14161a; --ink: #d8dce2; --dim: #7d8590; --field: #4fc1ff; --source: #ce9178; --object: #6a9955; --ghost: #8a8f98; --line: #2a2e35; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 Consolas, monospace; overflow: hidden; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 10px 18px; border-bottom: 1px solid var(--line); position: relative; z-index: 3; background: var(--bg); }
  header .name { color: var(--dim); letter-spacing: .08em; }
  .open { padding: 4px 12px; border: 1px solid #3a404a; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .open:hover { border-color: var(--ink); }
  #views { display: flex; border: 1px solid #3a404a; border-radius: 4px; overflow: hidden; }
  #views button { background: none; border: none; border-left: 1px solid #3a404a; color: var(--dim); font: 12px Consolas, monospace; padding: 4px 10px; cursor: pointer; }
  #views button:first-child { border-left: none; }
  #views button:hover { color: var(--ink); }
  #views button.active { background: #2a2e35; color: var(--ink); }
  #tally { font-size: 13px; }
  #tally .f { color: var(--field); } #tally .s { color: var(--source); } #tally .o { color: var(--object); }
  #tally .seen { color: var(--dim); }
  #findwrap { position: relative; margin-left: auto; }
  #find { background: #1b1e24; border: 1px solid #3a404a; border-radius: 4px; color: var(--ink); font: 13px Consolas, monospace; padding: 4px 10px; width: 260px; }
  #find:focus { outline: none; border-color: var(--ink); }
  #findlist { position: absolute; top: 30px; right: 0; width: 340px; background: #1b1e24; border: 1px solid #3a404a; border-radius: 4px; display: none; max-height: 320px; overflow: auto; z-index: 5; }
  #findlist div { padding: 3px 10px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #findlist div:hover, #findlist div.sel { background: #2a2e35; }
  #graph { position: absolute; top: 47px; left: 0; width: 100vw; height: calc(100vh - 47px); cursor: grab; touch-action: none; }
  #graph.panning { cursor: grabbing; }
  #hover { position: fixed; left: 14px; bottom: 10px; color: var(--dim); font-size: 13px; pointer-events: none; z-index: 2; }
  #hover .f { color: var(--field); } #hover .s { color: var(--source); } #hover .o { color: var(--object); } #hover .g { color: var(--ghost); }
  #legend { position: fixed; top: 58px; right: 12px; background: rgba(20,22,26,.92); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; font-size: 12px; color: var(--dim); z-index: 2; }
  #legend .row { display: flex; align-items: center; gap: 8px; line-height: 1.7; }
  #legend .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #legend svg { flex: none; }
  #pane { position: fixed; top: 47px; right: 0; bottom: 0; width: 420px; background: #171a1f; border-left: 1px solid var(--line); display: none; flex-direction: column; z-index: 4; }
  #pane.open { display: flex; }
  #pane .top { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #pane .top .close { float: right; cursor: pointer; color: var(--dim); padding: 0 6px; }
  #pane .top .close:hover { color: var(--ink); }
  #pane .handle { font-weight: bold; }
  #pane .handle.field { color: var(--field); } #pane .handle.source { color: var(--source); } #pane .handle.object { color: var(--object); } #pane .handle.ghost { color: var(--ghost); }
  #pane .meta { color: var(--dim); font-size: 12px; }
  #pane .body { flex: 1; overflow: auto; padding: 12px 16px; white-space: pre-wrap; font-size: 13px; line-height: 1.55; }
  #pane .body a { color: var(--field); text-decoration: none; cursor: pointer; }
  #pane .body a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <span class="name">corpus reader</span>
  <label class="open">open the corpus folder
    <input type="file" id="pick" webkitdirectory multiple hidden>
  </label>
  <span id="views"></span>
  <span id="tally" hidden></span>
  <span id="findwrap"><input id="find" placeholder="find a record…" autocomplete="off"><div id="findlist"></div></span>
</header>
<canvas id="graph"></canvas>
<div id="hover"></div>
<div id="legend"></div>
<div id="pane">
  <div class="top"><span class="close" id="paneClose">✕</span><div id="paneHandle" class="handle"></div><div id="paneMeta" class="meta"></div></div>
  <div class="body" id="paneBody"></div>
</div>
<script src="reader.data.js"></script>
<script>
  const RECORD = /^(field|source|object)\.(.+)\.f(\d+)\.(\d{8}-\d{4,6})\.md$/;
  const REF_KEYS = ['links', 'field', 'source', 'depends-on', 'used-by'];
  const WIKILINK = /\[\[([^\]|#\r\n]+)(?:[|#][^\]]*)?\]\]/g;
  const COLOR = { field: '#4fc1ff', source: '#ce9178', object: '#6a9955', ghost: '#8a8f98' };
  const TYPE_ORDER = { field: 0, source: 1, object: 2, ghost: 3 };
  // edge kinds → draw style (used-by folds into depends-on: exact inverses, one line)
  // solid lines throughout — the color carries the kind (operator, 20260702)
  const EDGE_STYLE = {
    structural: { dash: [], color: '#d8dce2', alpha: 0.30, width: 1.2, label: 'depends-on / used-by' },
    field:      { dash: [], color: '#4fc1ff', alpha: 0.22, width: 1.0, label: 'field (membership)' },
    source:     { dash: [], color: '#ce9178', alpha: 0.18, width: 1.0, label: 'source (citation)' },
    links:      { dash: [], color: '#b18ad8', alpha: 0.24, width: 1.0, label: 'links (kinship)' },
    body:       { dash: [], color: '#7d8590', alpha: 0.07, width: 0.7, label: 'body prose link' },
  };
  const styleKind = (k) => (k === 'depends-on' || k === 'used-by') ? 'structural' : (k === 'body' ? 'body' : k);

  function parseRecord(name, text) {
    const nm = name.match(RECORD);
    const r = {
      file: name, type: nm[1], scope: nm[2], fold: +nm[3], stamp: nm[4],
      handle: nm[1] + '.' + nm[2], text,
      meta: {}, refs: {}, bodyLinks: [],
    };
    const nl = text.includes('\r\n') ? '\r\n' : '\n';
    let body = text;
    if (text.startsWith('---')) {
      const close = text.indexOf(nl + '---' + nl, 3);
      if (close > -1) {
        for (const line of text.slice(0, close).split(nl)) {
          const km = line.match(/^([a-zA-Z-]+):\s*(.*)$/);
          if (!km) continue;
          if (REF_KEYS.includes(km[1])) {
            r.refs[km[1]] = [...km[2].matchAll(/\[\[([^\]]+)\]\]/g)].map((m) => m[1].trim());
          } else {
            r.meta[km[1]] = km[2];
          }
        }
        body = text.slice(close + nl.length * 2 + 3);
      }
    }
    for (const m of body.matchAll(WIKILINK)) r.bodyLinks.push(m[1].trim());
    return r;
  }

  function build(records) {
    const byHandle = new Map();
    for (const r of records) {
      const cur = byHandle.get(r.handle);
      if (!cur || cur.fold < r.fold) byHandle.set(r.handle, r);
    }
    const edges = [];
    const bodyTargets = new Set();
    let refCount = 0, bodyCount = 0;
    for (const r of records) {
      for (const key of REF_KEYS) {
        for (const t of r.refs[key] || []) { edges.push({ from: r.handle, to: t, kind: key }); refCount++; }
      }
      for (const t of r.bodyLinks) { edges.push({ from: r.handle, to: t, kind: 'body' }); bodyCount++; bodyTargets.add(t); }
    }
    const ghosts = [...bodyTargets].filter((t) => !byHandle.has(t));
    // ghost nodes: the unresolved names, hollow — they enter the graph, pulled by their linkers
    const ghostNodes = new Map(ghosts.map((h) => [h, { handle: h, type: 'ghost', fold: null, meta: {}, deg: 0 }]));
    const resolve = (handle) => byHandle.get(handle) || null;
    const anyNode = (handle) => byHandle.get(handle) || ghostNodes.get(handle) || null;
    // adjacency over all nodes incl. ghosts (for focus + ghost linker lists)
    const adj = new Map();
    const touch = (h) => { if (!adj.has(h)) adj.set(h, new Set()); return adj.get(h); };
    for (const e of edges) {
      const a = anyNode(e.from), b = anyNode(e.to);
      if (!a || !b || a === b) continue;
      touch(a.handle).add(b.handle);
      touch(b.handle).add(a.handle);
    }
    return {
      records, byHandle, ghostNodes, edges, resolve, anyNode, adj,
      stats: {
        records: records.length, handles: byHandle.size,
        refs: refCount, bodyLinks: bodyCount,
        bodyTargets: bodyTargets.size, ghosts: ghosts.length,
      },
      ghosts,
    };
  }

  // ---- canvas, view, nodes ----
  const canvas = document.getElementById('graph');
  const ctx = canvas.getContext('2d');
  const view = { x: 0, y: 0, k: 1 };
  window.readerView = view;
  // views: each is a projection over the same corpus, sharing canvas + focus + pane + find.
  // hooks: enter() places nodes / starts what it owns · leave() caches · edges 'full'|'focus'|fn ·
  // drawUnder/drawOver(ctx, sx, sy, w, h, light) chrome · drag(dx, dy, pan) overrides pan ·
  // down(pan) stashes drag-start state · hover(e)/click(e) overrides · legend() rows ·
  // positional:false → go() routes to web
  let curView = 'web';
  const VIEWS = {};
  const V = () => VIEWS[curView];
  window.readerViews = VIEWS;
  window.readerCurView = () => curView;
  let nodes = [];
  let links = [];        // force springs: undirected weighted pairs
  let drawEdges = [];    // per pair per styleKind, deduped

  function layout(corpus) {
    nodes = [...corpus.byHandle.values(), ...corpus.ghostNodes.values()].sort((a, b) =>
      TYPE_ORDER[a.type] - TYPE_ORDER[b.type] || a.handle.localeCompare(b.handle));
    const GA = Math.PI * (3 - Math.sqrt(5));
    nodes.forEach((n, i) => {
      const rad = 16 * Math.sqrt(i);
      n.x = rad * Math.cos(i * GA);
      n.y = rad * Math.sin(i * GA);
      n.vx = 0; n.vy = 0; n.deg = 0;
    });
  }

  function buildLinks(corpus) {
    const pairs = new Map();
    const stylePairs = new Map();
    for (const e of corpus.edges) {
      const a = corpus.anyNode(e.from), b = corpus.anyNode(e.to);
      if (!a || !b || a === b) continue;
      const key = a.handle < b.handle ? a.handle + '|' + b.handle : b.handle + '|' + a.handle;
      pairs.set(key, (pairs.get(key) || 0) + 1);
      const sk = styleKind(e.kind);
      const skey = key + '|' + sk;
      if (!stylePairs.has(skey)) stylePairs.set(skey, { a, b, kind: sk });
    }
    links = [...pairs].map(([k, w]) => {
      const [ha, hb] = k.split('|');
      const a = corpus.anyNode(ha), b = corpus.anyNode(hb);
      a.deg++; b.deg++;
      return { a, b, w };
    });
    drawEdges = [...stylePairs.values()];
  }

  // ---- components (shared ground for matrix / rings / multiples) ----
  let components = [];   // arrays of nodes, size desc; n.comp = index
  function computeComponents() {
    components = [];
    const seen = new Set();
    for (const n of nodes) {
      if (seen.has(n.handle)) continue;
      const comp = [];
      const stack = [n];
      seen.add(n.handle);
      while (stack.length) {
        const c = stack.pop();
        comp.push(c);
        for (const h of (window.corpus.adj.get(c.handle) || [])) {
          if (seen.has(h)) continue;
          seen.add(h);
          const m = window.corpus.anyNode(h);
          if (m) stack.push(m);
        }
      }
      components.push(comp);
    }
    components.sort((a, b) => b.length - a.length);
    components.forEach((c, i) => c.forEach((n) => { n.comp = i; }));
    window.readerComponents = components;
  }

  // ---- view switching ----
  function renderViewBar() {
    document.getElementById('views').innerHTML = Object.entries(VIEWS)
      .sort((a, b) => (a[1].ord || 99) - (b[1].ord || 99))
      .map(([k, v]) => `<button data-v="${k}" class="${k === curView ? 'active' : ''}">${v.label}</button>`).join('');
  }
  function switchView(key) {
    if (key === curView || !VIEWS[key] || !window.corpus) return;
    if (V().leave) V().leave();
    sim.running = false; sim.alpha = 0;
    curView = key;
    focus = null; closePane();
    userMoved = false;
    renderViewBar();
    renderLegend();
    V().enter();
    rebuildGrid();
  }
  window.switchView = switchView;
  document.getElementById('views').addEventListener('click', (e) => {
    if (e.target.dataset && e.target.dataset.v) switchView(e.target.dataset.v);
  });

  VIEWS.web = {
    label: 'web', ord: 1, edges: 'full', cache: null, settled: false,
    enter() {
      if (this.cache) {
        nodes.forEach((n, i) => { n.x = this.cache[i * 2]; n.y = this.cache[i * 2 + 1]; });
        fit(); draw(false);
        if (!this.settled) startSim();
      } else {
        layout(window.corpus);
        fit();
        startSim();
      }
    },
    leave() {
      this.cache = new Float64Array(nodes.length * 2);
      nodes.forEach((n, i) => { this.cache[i * 2] = n.x; this.cache[i * 2 + 1] = n.y; });
    },
  };

  // ternary: barycentric triangle, corners field / source / object; each node placed by
  // its neighborhood's type mix. Same mix → deterministic golden-angle spread. Records
  // with no typed neighbors sit in the unwired strip below.
  VIEWS.ternary = {
    label: 'ternary', ord: 2, edges: 'focus', corners: null, unwiredCount: 0,
    enter() {
      const R = 600;
      const corners = {
        field: { x: 0, y: -R },
        source: { x: -R * Math.sin(Math.PI / 3), y: R * 0.5 },
        object: { x: R * Math.sin(Math.PI / 3), y: R * 0.5 },
      };
      const buckets = new Map();
      const unwired = [];
      for (const n of nodes) {
        const counts = { field: 0, source: 0, object: 0 };
        for (const h of (window.corpus.adj.get(n.handle) || [])) {
          const m = window.corpus.anyNode(h);
          if (m && counts[m.type] !== undefined) counts[m.type]++;
        }
        const total = counts.field + counts.source + counts.object;
        if (!total) { unwired.push(n); continue; }
        const f = counts.field / total, s = counts.source / total, o = counts.object / total;
        n.x = f * corners.field.x + s * corners.source.x + o * corners.object.x;
        n.y = f * corners.field.y + s * corners.source.y + o * corners.object.y;
        const key = f.toFixed(3) + ':' + s.toFixed(3);
        let b = buckets.get(key);
        if (!b) buckets.set(key, b = []);
        b.push(n);
      }
      const GA = Math.PI * (3 - Math.sqrt(5));
      for (const b of buckets.values()) {
        if (b.length === 1) continue;
        b.forEach((n, i) => {
          const r = 3.2 * Math.sqrt(i);
          n.x += r * Math.cos(i * GA);
          n.y += r * Math.sin(i * GA);
        });
      }
      unwired.forEach((n, i) => {
        n.x = -R + (i % 100) * (2 * R / 100);
        n.y = R * 0.78 + Math.floor(i / 100) * 16;
      });
      this.corners = corners;
      this.unwiredCount = unwired.length;
      fit(); draw(false);
    },
    drawOver(ctx, sx, sy) {
      const c = this.corners;
      if (!c) return;
      ctx.strokeStyle = '#3a404a'; ctx.lineWidth = 1; ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(sx(c.field.x), sy(c.field.y));
      ctx.lineTo(sx(c.source.x), sy(c.source.y));
      ctx.lineTo(sx(c.object.x), sy(c.object.y));
      ctx.closePath(); ctx.stroke();
      ctx.font = '12px Consolas, monospace';
      ctx.fillStyle = COLOR.field; ctx.textAlign = 'center';
      ctx.fillText('field', sx(c.field.x), sy(c.field.y) - 34);
      ctx.fillStyle = COLOR.source; ctx.textAlign = 'right';
      ctx.fillText('source', sx(c.source.x) - 26, sy(c.source.y) + 22);
      ctx.fillStyle = COLOR.object; ctx.textAlign = 'left';
      ctx.fillText('object', sx(c.object.x) + 26, sy(c.object.y) + 22);
      if (this.unwiredCount) {
        ctx.fillStyle = '#7d8590';
        ctx.fillText(`unwired (${this.unwiredCount})`, sx(-600), sy(600 * 0.78) - 14);
      }
      ctx.textAlign = 'start';
    },
    legend() {
      return `<div class="row" style="margin-top:4px">placed by neighborhood mix of the three types</div>`;
    },
  };

  // matrix: the adjacency itself — records on the diagonal, every styled pair as two
  // mirrored cells in kind color; ordered component → type → degree so components read
  // as blocks and closed cycles as bands. Cells cached as world-space paths.
  VIEWS.matrix = {
    label: 'matrix', ord: 4, edges: () => {}, C: 4, order: null, cellKinds: null, paths: null, bounds: null, built: false,
    enter() {
      const C = this.C;
      if (!this.built) {
        const order = [...nodes].sort((a, b) =>
          a.comp - b.comp || TYPE_ORDER[a.type] - TYPE_ORDER[b.type] || (b.deg - a.deg) || a.handle.localeCompare(b.handle));
        order.forEach((n, i) => { n.mi = i; });
        this.order = order;
        const paths = {};
        const kinds = new Map();
        for (const e of drawEdges) {
          const p = paths[e.kind] || (paths[e.kind] = new Path2D());
          const i = e.a.mi, j = e.b.mi;
          p.rect(i * C, j * C, C, C);
          p.rect(j * C, i * C, C, C);
          const k1 = i + ':' + j;
          kinds.set(k1, (kinds.get(k1) ? kinds.get(k1) + '+' : '') + e.kind);
          kinds.set(j + ':' + i, kinds.get(k1));
        }
        const bounds = new Path2D();
        const size = nodes.length * C;
        let off = 0;
        for (const comp of components) {
          if (comp.length >= 10) {
            bounds.moveTo(off * C, 0); bounds.lineTo(off * C, size);
            bounds.moveTo(0, off * C); bounds.lineTo(size, off * C);
          }
          off += comp.length;
        }
        this.paths = paths; this.cellKinds = kinds; this.bounds = bounds;
        this.built = true;
      }
      for (const n of nodes) { n.x = n.mi * C + C / 2; n.y = n.mi * C + C / 2; }
      fit(); draw(false);
    },
    drawUnder(ctx) {
      const dpr = window.devicePixelRatio || 1;
      const C = this.C;
      const cellPx = C * view.k;
      if (cellPx < 1.2) {
        // density mode: sub-pixel cells become fixed screen-space points
        const pts = {};
        for (const e of drawEdges) {
          const p = pts[e.kind] || (pts[e.kind] = new Path2D());
          const ax = ((e.a.mi + 0.5) * C + view.x) * view.k, ay = ((e.a.mi + 0.5) * C + view.y) * view.k;
          const bx = ((e.b.mi + 0.5) * C + view.x) * view.k, by = ((e.b.mi + 0.5) * C + view.y) * view.k;
          p.rect(ax - 0.75, by - 0.75, 1.5, 1.5);   // (col a, row b)
          p.rect(bx - 0.75, ay - 0.75, 1.5, 1.5);   // (col b, row a)
        }
        for (const [kind, p] of Object.entries(pts)) {
          ctx.fillStyle = EDGE_STYLE[kind].color;
          ctx.globalAlpha = 0.8;
          ctx.fill(p);
        }
      } else {
        ctx.save();
        ctx.setTransform(dpr * view.k, 0, 0, dpr * view.k, dpr * view.k * view.x, dpr * view.k * view.y);
        for (const [kind, p] of Object.entries(this.paths)) {
          ctx.fillStyle = EDGE_STYLE[kind].color;
          ctx.globalAlpha = 0.85;
          ctx.fill(p);
        }
        ctx.restore();
      }
      ctx.save();
      ctx.setTransform(dpr * view.k, 0, 0, dpr * view.k, dpr * view.k * view.x, dpr * view.k * view.y);
      ctx.strokeStyle = '#2a2e35'; ctx.globalAlpha = 0.35; ctx.lineWidth = 1 / view.k;
      ctx.stroke(this.bounds);
      ctx.restore();
      ctx.globalAlpha = 1;
    },
    cellAt(e) {
      const rect = canvas.getBoundingClientRect();
      const wx = (e.clientX - rect.left) / view.k - view.x;
      const wy = (e.clientY - rect.top) / view.k - view.y;
      const i = Math.floor(wx / this.C), j = Math.floor(wy / this.C);
      if (i < 0 || j < 0 || i >= nodes.length || j >= nodes.length || i === j) return null;
      return { i, j };
    },
    hover(e) {
      const c = this.cellAt(e);
      if (!c) return false;   // diagonal + outside → default node hover
      const el = document.getElementById('hover');
      const ks = this.cellKinds.get(c.i + ':' + c.j);
      if (!ks) { el.innerHTML = ''; return true; }
      const a = this.order[c.i], b = this.order[c.j];
      const cls = (n) => n.type === 'ghost' ? 'g' : n.type[0];
      el.innerHTML = `<span class="${cls(a)}">${a.handle}</span> × <span class="${cls(b)}">${b.handle}</span> · ${ks}`;
      return true;
    },
    click(e) {
      const c = this.cellAt(e);
      if (!c || !this.cellKinds.get(c.i + ':' + c.j)) return false;
      const n = this.order[c.j];
      setFocus(n, 1); openPane(n);
      return true;
    },
    drawNodes(ctx) {
      // diagonal marks stay cell-sized — degree sizing would bloat into a band;
      // in density mode they get the same fixed screen-space minimum as the cells
      const C = this.C;
      const dpr = window.devicePixelRatio || 1;
      const cellPx = C * view.k;
      const lit = { field: new Path2D(), source: new Path2D(), object: new Path2D(), ghost: new Path2D() };
      const dim = new Path2D();
      if (cellPx < 1.2) {
        for (const n of nodes) {
          const p = focus && !focus.set.has(n.handle) ? dim : lit[n.type];
          const x = ((n.mi + 0.5) * C + view.x) * view.k, y = ((n.mi + 0.5) * C + view.y) * view.k;
          p.rect(x - 0.75, y - 0.75, 1.5, 1.5);
        }
        for (const t of ['field', 'source', 'object', 'ghost']) {
          ctx.fillStyle = COLOR[t]; ctx.globalAlpha = 1; ctx.fill(lit[t]);
        }
        ctx.fillStyle = '#7d8590'; ctx.globalAlpha = 0.15; ctx.fill(dim);
      } else {
        for (const n of nodes) {
          const p = focus && !focus.set.has(n.handle) ? dim : lit[n.type];
          p.rect(n.mi * C, n.mi * C, C, C);
        }
        ctx.save();
        ctx.setTransform(dpr * view.k, 0, 0, dpr * view.k, dpr * view.k * view.x, dpr * view.k * view.y);
        for (const t of ['field', 'source', 'object', 'ghost']) {
          ctx.fillStyle = COLOR[t]; ctx.globalAlpha = 1; ctx.fill(lit[t]);
        }
        ctx.fillStyle = '#7d8590'; ctx.globalAlpha = 0.15; ctx.fill(dim);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
    legend() {
      return `<div class="row" style="margin-top:4px">cell = link, colored by kind · diagonal = the records</div>` +
        `<div class="row">ordered component → type → degree</div>`;
    },
  };

  // rings: every component laid as a circle — the closed systems become the wheels they
  // are, the giant becomes a chord diagram. Hubs (linked to ≥60% of the component) sit at
  // center. Order around the circle: number carried in the handle where most members have
  // one (the hexagrams), else name order — the view never fabricates a sequence the data
  // doesn't carry (pilot finding, 20260702).
  VIEWS.rings = {
    label: 'rings', ord: 5, edges: 'full', meta: null,
    enter() {
      if (!this.meta) {
        const SP = 10, MARGIN = 60;
        const metas = [];
        for (const comp of components) {
          const hubs = comp.length >= 6
            ? comp.filter((n) => (window.corpus.adj.get(n.handle) || []).size >= 0.6 * (comp.length - 1))
            : [];
          const hubSet = new Set(hubs.map((n) => n.handle));
          const ring = comp.filter((n) => !hubSet.has(n.handle));
          const num = (n) => { const m = n.handle.match(/(\d+)/); return m ? +m[1] : null; };
          const withNum = ring.filter((n) => num(n) !== null);
          let ordered;
          if (ring.length && withNum.length >= ring.length / 2) {
            ordered = [...ring].sort((a, b) => ((num(a) === null ? 1e9 : num(a)) - (num(b) === null ? 1e9 : num(b))) || a.handle.localeCompare(b.handle));
          } else {
            ordered = [...ring].sort((a, b) => TYPE_ORDER[a.type] - TYPE_ORDER[b.type] || a.handle.localeCompare(b.handle));
          }
          // radius capped: the giant would otherwise dwarf every closed system into dust
          const r = Math.min(480, Math.max(26, ordered.length * SP / (2 * Math.PI)));
          metas.push({ comp, hubs, ordered, r });
        }
        const rowW = Math.max(...metas.map((m) => 2 * m.r + MARGIN)) * 2.6;
        let cy = 0, rowH = 0, x = 0;
        for (const m of metas) {
          const cell = 2 * m.r + MARGIN;
          if (x > 0 && x + cell > rowW) { cy += rowH; x = 0; rowH = 0; }
          m.cx = x + cell / 2; m.cy = cy + cell / 2;
          x += cell; rowH = Math.max(rowH, cell);
        }
        this.meta = metas;
      }
      for (const m of this.meta) {
        m.ordered.forEach((n, i) => {
          const a = -Math.PI / 2 + (i / m.ordered.length) * 2 * Math.PI;
          n.x = m.cx + m.r * Math.cos(a);
          n.y = m.cy + m.r * Math.sin(a);
        });
        m.hubs.forEach((n, i) => {
          if (m.hubs.length === 1) { n.x = m.cx; n.y = m.cy; }
          else {
            const a = -Math.PI / 2 + (i / m.hubs.length) * 2 * Math.PI;
            n.x = m.cx + (m.r * 0.25) * Math.cos(a);
            n.y = m.cy + (m.r * 0.25) * Math.sin(a);
          }
        });
      }
      fit(); draw(false);
    },
    drawOver(ctx, sx, sy, w, h) {
      ctx.font = '11px Consolas, monospace';
      ctx.textAlign = 'center';
      for (const m of this.meta) {
        const sr = m.r * view.k;
        if (sr < 40) continue;
        const x = sx(m.cx), y = sy(m.cy) + sr + 16;
        if (x < -200 || x > w + 200 || y < -20 || y > h + 20) continue;
        const hub = m.hubs[0] || m.ordered[0];
        ctx.fillStyle = '#7d8590';
        ctx.fillText(`${hub.handle} · ${m.comp.length}`, x, y);
      }
      ctx.textAlign = 'start';
    },
    legend() {
      return `<div class="row" style="margin-top:4px">every component as a circle · hubs at center</div>` +
        `<div class="row">order: number in the handle where carried, else name</div>`;
    },
  };

  // ---- force: Barnes-Hut + springs + weak centering; deterministic ----
  const sim = { alpha: 0, running: false, ticks: 0 };
  window.simState = sim;
  const CHARGE = -35, THETA2 = 0.81, DIST2MAX = 360 * 360, LINK_DIST = 34;

  function bhTree() {
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    for (const n of nodes) {
      if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
      if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
    }
    const size = Math.max(maxX - minX, maxY - minY) || 1;
    const root = { x: minX, y: minY, s: size, kids: null, n: null, cx: 0, cy: 0, m: 0 };
    const insert = (q, node) => {
      while (true) {
        q.cx = (q.cx * q.m + node.x) / (q.m + 1);
        q.cy = (q.cy * q.m + node.y) / (q.m + 1);
        q.m++;
        if (q.s < 1e-3) return;
        if (!q.kids && q.n === null && q.m === 1) { q.n = node; return; }
        if (!q.kids) {
          q.kids = [null, null, null, null];
          if (q.n) { const old = q.n; q.n = null; placeKid(q, old); }
        }
        q = placeKid(q, node, true);
        if (!q) return;
      }
    };
    const placeKid = (q, node, ret) => {
      const h = q.s / 2;
      const i = (node.x >= q.x + h ? 1 : 0) + (node.y >= q.y + h ? 2 : 0);
      if (!q.kids[i]) {
        q.kids[i] = { x: q.x + (i & 1 ? h : 0), y: q.y + (i & 2 ? h : 0), s: h, kids: null, n: node, cx: node.x, cy: node.y, m: 1 };
        return ret ? null : q.kids[i];
      }
      if (ret) return q.kids[i];
      insert(q.kids[i], node);
    };
    for (const n of nodes) insert(root, n);
    return root;
  }

  function repel(node, q, alpha) {
    const stack = [q];
    while (stack.length) {
      const t = stack.pop();
      if (!t || t.m === 0 || t.n === node && t.m === 1) continue;
      const dx = t.cx - node.x, dy = t.cy - node.y;
      let d2 = dx * dx + dy * dy;
      if (d2 > DIST2MAX) continue;
      if (t.s * t.s < THETA2 * d2 || (!t.kids && t.m === 1)) {
        if (d2 < 1) d2 = 1;
        const f = CHARGE * t.m * alpha / d2;
        const d = Math.sqrt(d2);
        node.vx += (dx / d) * f;
        node.vy += (dy / d) * f;
      } else if (t.kids) {
        for (const k of t.kids) if (k) stack.push(k);
      }
    }
  }

  function tick() {
    const alpha = sim.alpha;
    const tree = bhTree();
    for (const n of nodes) repel(n, tree, alpha);
    for (const L of links) {
      const dx = L.b.x - L.a.x, dy = L.b.y - L.a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const strength = Math.min(1, L.w * 0.7) / Math.min(L.a.deg, L.b.deg);
      const f = (d - LINK_DIST) / d * alpha * strength;
      const bias = L.a.deg / (L.a.deg + L.b.deg);
      L.b.vx -= dx * f * bias; L.b.vy -= dy * f * bias;
      L.a.vx += dx * f * (1 - bias); L.a.vy += dy * f * (1 - bias);
    }
    for (const n of nodes) {
      n.vx -= n.x * 0.0035 * alpha;
      n.vy -= n.y * 0.0035 * alpha;
      n.vx *= 0.6; n.vy *= 0.6;
      n.x += n.vx; n.y += n.vy;
    }
    sim.ticks++;
    sim.alpha += (0 - sim.alpha) * 0.012;
  }

  // ---- 3D force: the same Barnes-Hut engine generalized to an octree ----
  function octree() {
    let minX = 1e9, minY = 1e9, minZ = 1e9, maxX = -1e9, maxY = -1e9, maxZ = -1e9;
    for (const n of nodes) {
      if (n.X < minX) minX = n.X; if (n.X > maxX) maxX = n.X;
      if (n.Y < minY) minY = n.Y; if (n.Y > maxY) maxY = n.Y;
      if (n.Z < minZ) minZ = n.Z; if (n.Z > maxZ) maxZ = n.Z;
    }
    const size = Math.max(maxX - minX, maxY - minY, maxZ - minZ) || 1;
    const root = { x: minX, y: minY, z: minZ, s: size, kids: null, n: null, cx: 0, cy: 0, cz: 0, m: 0 };
    const place = (q, node, ret) => {
      const h = q.s / 2;
      const i = (node.X >= q.x + h ? 1 : 0) + (node.Y >= q.y + h ? 2 : 0) + (node.Z >= q.z + h ? 4 : 0);
      if (!q.kids[i]) {
        q.kids[i] = { x: q.x + (i & 1 ? h : 0), y: q.y + (i & 2 ? h : 0), z: q.z + (i & 4 ? h : 0), s: h, kids: null, n: node, cx: node.X, cy: node.Y, cz: node.Z, m: 1 };
        return ret ? null : q.kids[i];
      }
      if (ret) return q.kids[i];
      insert(q.kids[i], node);
    };
    const insert = (q, node) => {
      while (true) {
        q.cx = (q.cx * q.m + node.X) / (q.m + 1);
        q.cy = (q.cy * q.m + node.Y) / (q.m + 1);
        q.cz = (q.cz * q.m + node.Z) / (q.m + 1);
        q.m++;
        if (q.s < 1e-3) return;
        if (!q.kids && q.n === null && q.m === 1) { q.n = node; return; }
        if (!q.kids) {
          q.kids = [null, null, null, null, null, null, null, null];
          if (q.n) { const old = q.n; q.n = null; place(q, old); }
        }
        q = place(q, node, true);
        if (!q) return;
      }
    };
    for (const n of nodes) insert(root, n);
    return root;
  }

  function repel3(node, q, alpha) {
    const stack = [q];
    while (stack.length) {
      const t = stack.pop();
      if (!t || t.m === 0 || t.n === node && t.m === 1) continue;
      const dx = t.cx - node.X, dy = t.cy - node.Y, dz = t.cz - node.Z;
      let d2 = dx * dx + dy * dy + dz * dz;
      if (d2 > DIST2MAX) continue;
      if (t.s * t.s < THETA2 * d2 || (!t.kids && t.m === 1)) {
        if (d2 < 1) d2 = 1;
        const f = CHARGE * t.m * alpha / d2;
        const d = Math.sqrt(d2);
        node.vX += (dx / d) * f; node.vY += (dy / d) * f; node.vZ += (dz / d) * f;
      } else if (t.kids) {
        for (const k of t.kids) if (k) stack.push(k);
      }
    }
  }

  function tick3() {
    const alpha = sim.alpha;
    const tree = octree();
    for (const n of nodes) repel3(n, tree, alpha);
    for (const L of links) {
      const dx = L.b.X - L.a.X, dy = L.b.Y - L.a.Y, dz = L.b.Z - L.a.Z;
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
      const strength = Math.min(1, L.w * 0.7) / Math.min(L.a.deg, L.b.deg);
      const f = (d - LINK_DIST) / d * alpha * strength;
      const bias = L.a.deg / (L.a.deg + L.b.deg);
      L.b.vX -= dx * f * bias; L.b.vY -= dy * f * bias; L.b.vZ -= dz * f * bias;
      L.a.vX += dx * f * (1 - bias); L.a.vY += dy * f * (1 - bias); L.a.vZ += dz * f * (1 - bias);
    }
    for (const n of nodes) {
      n.vX -= n.X * 0.0035 * alpha; n.vY -= n.Y * 0.0035 * alpha; n.vZ -= n.Z * 0.0035 * alpha;
      n.vX *= 0.6; n.vY *= 0.6; n.vZ *= 0.6;
      n.X += n.vX; n.Y += n.vY; n.Z += n.vZ;
    }
    sim.ticks++;
    sim.alpha += (0 - sim.alpha) * 0.012;
  }

  function startSim3() {
    sim.alpha = 1; sim.ticks = 0; sim.running = true;
    const v3 = VIEWS['3d'];
    const step = () => {
      if (curView !== '3d') { sim.running = false; return; }
      if (sim.alpha < 0.015) {
        sim.running = false;
        v3.settled = true;
        v3.project();
        if (!userMoved) fit();
        draw(false);
        return;
      }
      tick3(); tick3();
      v3.project();
      draw(true);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // 3d: the web with a real z-axis — octree force, orthographic projection, drag orbits,
  // wheel zooms, depth carried by alpha bands (far fades).
  VIEWS['3d'] = {
    label: '3d', ord: 3, edges: 'full', yaw: 0.6, pitch: 0.35, seeded: false, settled: false,
    enter() {
      if (!this.seeded) {
        const GA = Math.PI * (3 - Math.sqrt(5));
        nodes.forEach((n, i) => {
          // Fibonacci-sphere direction, radius by sqrt index — the 2D seed spiral generalized
          const t = nodes.length > 1 ? i / (nodes.length - 1) : 0;
          const phi = Math.acos(1 - 2 * t);
          const theta = i * GA;
          const r = 14 * Math.sqrt(i);
          n.X = r * Math.sin(phi) * Math.cos(theta);
          n.Y = r * Math.sin(phi) * Math.sin(theta);
          n.Z = r * Math.cos(phi);
          n.vX = 0; n.vY = 0; n.vZ = 0;
        });
        this.seeded = true;
      }
      this.project();
      fit();
      if (this.settled) draw(false); else startSim3();
    },
    project() {
      const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);
      const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
      for (const n of nodes) {
        const x1 = n.X * cy + n.Z * sy;
        const z1 = -n.X * sy + n.Z * cy;
        n.x = x1;
        n.y = n.Y * cp - z1 * sp;
        n.depth = n.Y * sp + z1 * cp;   // larger = nearer
      }
    },
    down(pan) { pan.yaw0 = this.yaw; pan.pitch0 = this.pitch; },
    drag(dx, dy, pan) {
      this.yaw = pan.yaw0 + dx * 0.005;
      this.pitch = Math.max(-1.45, Math.min(1.45, pan.pitch0 + dy * 0.005));
      this.project();
    },
    drawNodes(ctx, sx, sy, w, h) {
      let minD = 1e9, maxD = -1e9;
      for (const n of nodes) { if (n.depth < minD) minD = n.depth; if (n.depth > maxD) maxD = n.depth; }
      const span = (maxD - minD) || 1;
      const B = 12;
      const bands = [];
      for (let b = 0; b < B; b++) bands.push({ field: new Path2D(), source: new Path2D(), object: new Path2D(), ghost: new Path2D(), dim: new Path2D() });
      for (const n of nodes) {
        const x = sx(n.x), y = sy(n.y);
        if (x < -10 || y < -10 || x > w + 10 || y > h + 10) continue;
        const b = Math.min(B - 1, Math.floor(((n.depth - minD) / span) * B));
        const r = nodeR(n);
        const dimmed = focus && !focus.set.has(n.handle);
        const p = dimmed ? bands[b].dim : bands[b][n.type];
        p.moveTo(x + r, y);
        p.arc(x, y, r, 0, 7);
      }
      for (let b = 0; b < B; b++) {   // far first, faded → near last, full
        const a = 0.25 + 0.75 * (b + 0.5) / B;
        for (const t of ['field', 'source', 'object']) {
          ctx.fillStyle = COLOR[t]; ctx.globalAlpha = a; ctx.fill(bands[b][t]);
        }
        ctx.strokeStyle = COLOR.ghost; ctx.lineWidth = 1.1; ctx.globalAlpha = a; ctx.stroke(bands[b].ghost);
        ctx.fillStyle = '#7d8590'; ctx.globalAlpha = 0.07; ctx.fill(bands[b].dim);
      }
      ctx.globalAlpha = 1;
    },
    legend() {
      return `<div class="row" style="margin-top:4px">drag orbits · wheel zooms · far fades</div>`;
    },
  };

  let userMoved = false;
  function startSim() {
    sim.alpha = 1; sim.ticks = 0; sim.running = true;
    const step = () => {
      if (curView !== 'web') { sim.running = false; return; }
      if (sim.alpha < 0.015) {
        sim.running = false;
        VIEWS.web.settled = true;
        if (!userMoved) fit();
        draw(false);
        return;
      }
      tick(); tick();
      draw(true);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // ---- focus mode ----
  let focus = null;   // { center, set:Set(handles), depth }
  window.readerFocus = () => focus;
  function setFocus(node, depth) {
    const set = new Set([node.handle]);
    let ring = [node.handle];
    for (let d = 0; d < depth; d++) {
      const next = [];
      for (const h of ring) for (const m of (window.corpus.adj.get(h) || [])) {
        if (!set.has(m)) { set.add(m); next.push(m); }
      }
      ring = next;
    }
    focus = { center: node.handle, set, depth };
    draw();
  }
  function clearFocus() { focus = null; draw(); }

  // ---- drawing ----
  function nodeR(n) {
    return Math.max(1.4, Math.min(9, 2.2 + Math.sqrt(n.deg || 0) * 0.55));
  }

  function fit() {
    if (!nodes.length) return;
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    for (const n of nodes) {
      if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
      if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
    }
    const w = canvas.clientWidth, h = canvas.clientHeight;
    view.k = Math.min(w / (maxX - minX + 120), h / (maxY - minY + 120));
    view.x = w / 2 / view.k - (minX + maxX) / 2;
    view.y = h / 2 / view.k - (minY + maxY) / 2;
  }

  function size() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // two-speed drawing: light frames while the hand moves / sim runs (batched nodes,
  // edges only when a small focus set is active), full fidelity at rest.
  let fullTimer = null;
  function scheduleFull(ms = 140) {
    clearTimeout(fullTimer);
    fullTimer = setTimeout(() => draw(false), ms);
  }

  // spatial grid for hover/click hit-tests — rebuilt at rest, linear fallback mid-sim
  let hitGrid = null;
  const GRID = 30;
  function rebuildGrid() {
    hitGrid = new Map();
    for (const n of nodes) {
      const k = Math.floor(n.x / GRID) + ':' + Math.floor(n.y / GRID);
      let cell = hitGrid.get(k);
      if (!cell) hitGrid.set(k, cell = []);
      cell.push(n);
    }
  }

  window.drawStats = { fullMs: 0, lightMs: 0 };
  function draw(light = false) {
    const t0 = performance.now();
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const sx = (x) => (x + view.x) * view.k;
    const sy = (y) => (y + view.y) * view.k;

    if (V().drawUnder) V().drawUnder(ctx, sx, sy, w, h, light);

    // edges — 'full': always at rest, focused few in light frames; 'focus': only when
    // a focus set is active; fn: the view draws its own
    const em = V().edges;
    if (typeof em === 'function') { em(ctx, sx, sy, w, h, light); }
    else if ((em === 'full' && (!light || focus)) || (em === 'focus' && focus)) {
      const byKind = {};
      for (const e of drawEdges) {
        if ((focus || em === 'focus') && !(focus && focus.set.has(e.a.handle) && focus.set.has(e.b.handle))) continue;
        const ax = sx(e.a.x), ay = sy(e.a.y), bx = sx(e.b.x), by = sy(e.b.y);
        if ((ax < 0 && bx < 0) || (ay < 0 && by < 0) || (ax > w && bx > w) || (ay > h && by > h)) continue;
        (byKind[e.kind] = byKind[e.kind] || []).push(ax, ay, bx, by);
      }
      for (const [kind, pts] of Object.entries(byKind)) {
        const st = EDGE_STYLE[kind];
        ctx.strokeStyle = st.color;
        ctx.globalAlpha = focus ? Math.min(0.85, st.alpha * 2.6) : st.alpha;
        ctx.lineWidth = st.width;
        ctx.setLineDash(st.dash);
        ctx.beginPath();
        for (let i = 0; i < pts.length; i += 4) { ctx.moveTo(pts[i], pts[i + 1]); ctx.lineTo(pts[i + 2], pts[i + 3]); }
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    // nodes — batched: one Path2D per (type × lit/dim), 8 draw calls total
    if (V().drawNodes) {
      V().drawNodes(ctx, sx, sy, w, h);
    } else {
    const lit = { field: new Path2D(), source: new Path2D(), object: new Path2D() };
    const dim = { field: new Path2D(), source: new Path2D(), object: new Path2D() };
    const ghostLit = new Path2D(), ghostDim = new Path2D();
    for (const n of nodes) {
      const x = sx(n.x), y = sy(n.y);
      if (x < -10 || y < -10 || x > w + 10 || y > h + 10) continue;
      const r = nodeR(n);
      const dimmed = focus && !focus.set.has(n.handle);
      const p = n.type === 'ghost' ? (dimmed ? ghostDim : ghostLit) : (dimmed ? dim[n.type] : lit[n.type]);
      p.moveTo(x + r, y);
      p.arc(x, y, r, 0, 7);
    }
    for (const t of ['field', 'source', 'object']) {
      ctx.fillStyle = COLOR[t];
      ctx.globalAlpha = 1; ctx.fill(lit[t]);
      ctx.globalAlpha = 0.07; ctx.fill(dim[t]);
    }
    ctx.strokeStyle = COLOR.ghost; ctx.lineWidth = 1.1;
    ctx.globalAlpha = 1; ctx.stroke(ghostLit);
    ctx.globalAlpha = 0.07; ctx.stroke(ghostDim);
    ctx.globalAlpha = 1;
    }

    // focus ring + labels (small sets only)
    if (focus) {
      const c = window.corpus.anyNode(focus.center);
      if (c) {
        const x = sx(c.x), y = sy(c.y);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(x, y, nodeR(c) + 3, 0, 7); ctx.stroke();
      }
      if (focus.set.size <= 48) {
        ctx.globalAlpha = 0.95;
        ctx.font = '11px Consolas, monospace';
        for (const h2 of focus.set) {
          const n = window.corpus.anyNode(h2);
          if (!n) continue;
          const x = sx(n.x), y = sy(n.y);
          if (x < 0 || y < 0 || x > w || y > h) continue;
          ctx.fillStyle = n.type === 'ghost' ? COLOR.ghost : COLOR[n.type];
          ctx.fillText(n.handle, x + nodeR(n) + 4, y + 3.5);
        }
        ctx.globalAlpha = 1;
      }
    }

    if (V().drawOver) V().drawOver(ctx, sx, sy, w, h, light);

    const ms = performance.now() - t0;
    if (light) window.drawStats.lightMs = ms; else { window.drawStats.fullMs = ms; if (!sim.running) rebuildGrid(); }
  }

  // ---- interaction ----
  let pan = null, downAt = null;
  canvas.addEventListener('pointerdown', (e) => {
    pan = { px: e.clientX, py: e.clientY, vx: view.x, vy: view.y };
    if (V().down) V().down(pan);
    downAt = { x: e.clientX, y: e.clientY };
    canvas.classList.add('panning');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (pan) {
      if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 4) userMoved = true;
      if (V().drag) {
        V().drag(e.clientX - pan.px, e.clientY - pan.py, pan);
      } else {
        view.x = pan.vx + (e.clientX - pan.px) / view.k;
        view.y = pan.vy + (e.clientY - pan.py) / view.k;
      }
      draw(true);
      scheduleFull();
    } else {
      hover(e);
    }
  });
  canvas.addEventListener('pointerup', (e) => {
    canvas.classList.remove('panning');
    pan = null;
    if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) <= 4) {
      if (V().click && V().click(e)) { downAt = null; return; }
      const n = hitTest(e);
      if (n) { setFocus(n, e.shiftKey ? 2 : 1); openPane(n); }
      else { clearFocus(); closePane(); }
    }
    downAt = null;
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    userMoved = true;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const wx = mx / view.k - view.x, wy = my / view.k - view.y;
    view.k *= e.deltaY < 0 ? 1.15 : 1 / 1.15;
    view.k = Math.max(0.05, Math.min(40, view.k));
    view.x = mx / view.k - wx;
    view.y = my / view.k - wy;
    draw(true);
    scheduleFull();
  }, { passive: false });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { clearFocus(); closePane(); } });

  function hitTest(e) {
    if (!nodes.length) return null;
    const rect = canvas.getBoundingClientRect();
    const wx = (e.clientX - rect.left) / view.k - view.x;
    const wy = (e.clientY - rect.top) / view.k - view.y;
    const hitR = 8 / view.k;
    let best = null, bd = hitR * hitR;
    if (hitGrid && !sim.running) {
      const span = Math.max(1, Math.ceil(hitR / GRID));
      const cx = Math.floor(wx / GRID), cy = Math.floor(wy / GRID);
      for (let gx = cx - span; gx <= cx + span; gx++) {
        for (let gy = cy - span; gy <= cy + span; gy++) {
          const cell = hitGrid.get(gx + ':' + gy);
          if (!cell) continue;
          for (const n of cell) {
            const d = (n.x - wx) ** 2 + (n.y - wy) ** 2;
            if (d < bd) { bd = d; best = n; }
          }
        }
      }
      return best;
    }
    for (const n of nodes) {
      const d = (n.x - wx) ** 2 + (n.y - wy) ** 2;
      if (d < bd) { bd = d; best = n; }
    }
    return best;
  }

  function hover(e) {
    if (V().hover && V().hover(e)) return;
    const n = hitTest(e);
    const el = document.getElementById('hover');
    el.innerHTML = n
      ? (n.type === 'ghost'
        ? `<span class="g">${n.handle}</span> · ghost — not yet a record · linked by ${(window.corpus.adj.get(n.handle) || []).size}`
        : `<span class="${n.type[0]}">${n.handle}</span> · f${n.fold} · ${n.meta.state || ''} · ${n.deg} links`)
      : '';
  }

  // ---- reading pane ----
  function openPane(n) {
    const pane = document.getElementById('pane');
    const hEl = document.getElementById('paneHandle');
    const mEl = document.getElementById('paneMeta');
    const bEl = document.getElementById('paneBody');
    hEl.textContent = n.handle;
    hEl.className = 'handle ' + n.type;
    if (n.type === 'ghost') {
      mEl.textContent = 'ghost — not yet a record';
      const linkers = [...(window.corpus.adj.get(n.handle) || [])];
      bEl.innerHTML = 'linked by ' + linkers.length + ' record' + (linkers.length === 1 ? '' : 's') + ':\n\n' +
        linkers.slice(0, 40).map((h) => `<a data-h="${h}">${h}</a>`).join('\n');
    } else {
      mEl.textContent = `${n.file} · state: ${n.meta.state || '—'} · ${n.deg} links`;
      bEl.innerHTML = n.text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/\[\[([^\]|#\r\n]+)(?:[|#][^\]]*)?\]\]/g, (m, h) => `[[<a data-h="${h.trim()}">${h.trim()}</a>]]`);
    }
    pane.classList.add('open');
  }
  function closePane() { document.getElementById('pane').classList.remove('open'); }
  document.getElementById('paneClose').addEventListener('click', () => { closePane(); clearFocus(); });
  document.getElementById('paneBody').addEventListener('click', (e) => {
    const h = e.target.dataset && e.target.dataset.h;
    if (h) go(h);
  });

  // ---- find ----
  function go(handle) {
    const n = window.corpus.anyNode(handle);
    if (!n) return;
    if (V().positional === false) switchView('web');
    userMoved = true;
    view.k = Math.max(view.k, 1.6);
    view.x = canvas.clientWidth / 2 / view.k - n.x;
    view.y = canvas.clientHeight / 2 / view.k - n.y;
    setFocus(n, 1);
    openPane(n);
  }
  window.readerGo = go;
  const findEl = document.getElementById('find');
  const listEl = document.getElementById('findlist');
  let findSel = 0, findMatches = [];
  function renderFind() {
    listEl.innerHTML = findMatches.map((h, i) => `<div class="${i === findSel ? 'sel' : ''}" data-h="${h}">${h}</div>`).join('');
    listEl.style.display = findMatches.length ? 'block' : 'none';
  }
  findEl.addEventListener('input', () => {
    const q = findEl.value.trim().toLowerCase();
    if (!q || !window.corpus) { findMatches = []; renderFind(); return; }
    const all = [...window.corpus.byHandle.keys(), ...window.corpus.ghostNodes.keys()];
    const starts = [], contains = [];
    for (const h of all) {
      const l = h.toLowerCase();
      if (l.startsWith(q)) starts.push(h);
      else if (l.includes(q)) contains.push(h);
      if (starts.length > 12) break;
    }
    findMatches = [...starts, ...contains].slice(0, 12);
    findSel = 0;
    renderFind();
  });
  findEl.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { findSel = Math.min(findSel + 1, findMatches.length - 1); renderFind(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { findSel = Math.max(findSel - 1, 0); renderFind(); e.preventDefault(); }
    else if (e.key === 'Enter' && findMatches.length) { go(findMatches[findSel]); listEl.style.display = 'none'; findEl.blur(); }
    else if (e.key === 'Escape') { listEl.style.display = 'none'; findEl.blur(); }
  });
  listEl.addEventListener('pointerdown', (e) => {
    const h = e.target.dataset && e.target.dataset.h;
    if (h) { go(h); listEl.style.display = 'none'; }
  });

  // ---- legend ----
  function renderLegend() {
    const dot = (c, hollow) => `<span class="swatch" style="${hollow ? 'border:1.5px solid ' + c : 'background:' + c}"></span>`;
    const line = (st) => `<svg width="34" height="6"><line x1="0" y1="3" x2="34" y2="3" stroke="${st.color}" stroke-width="1.6" stroke-dasharray="${st.dash.join(',')}" opacity="0.9"/></svg>`;
    const typeRows =
      `<div class="row">${dot(COLOR.field)} field</div>` +
      `<div class="row">${dot(COLOR.source)} source</div>` +
      `<div class="row">${dot(COLOR.object)} object</div>` +
      `<div class="row">${dot(COLOR.ghost, true)} ghost (no record yet)</div>`;
    const edgeRows = Object.values(EDGE_STYLE).map((st) => `<div class="row">${line(st)} ${st.label}</div>`).join('');
    const extra = V().legend ? V().legend() : '';
    document.getElementById('legend').innerHTML = typeRows +
      (V().edges === 'full' || focus ? edgeRows : '') + extra +
      `<div class="row" style="margin-top:4px">click: focus ±1 · shift-click: ±2 · esc: clear</div>`;
  }

  // ---- load ----
  function load(entries, sourceLabel) {
    const by = { field: 0, source: 0, object: 0 };
    const records = [];
    for (const e of entries) {
      const r = parseRecord(e.name, e.text);
      by[r.type]++;
      records.push(r);
    }
    window.corpus = build(records);
    const s = window.corpus.stats;
    const tally = document.getElementById('tally');
    tally.innerHTML =
      `<strong>${s.records}</strong> <span class="seen">records —</span> ` +
      `<span class="f">${by.field}</span> · <span class="s">${by.source}</span> · <span class="o">${by.object}</span>` +
      `<span class="seen"> — ${s.refs + s.bodyLinks} edges · ${s.ghosts} ghosts · ${sourceLabel}</span>`;
    tally.hidden = false;
    focus = null; closePane();
    size();
    layout(window.corpus);
    buildLinks(window.corpus);
    computeComponents();
    VIEWS.web.cache = null; VIEWS.web.settled = false;
    VIEWS['3d'].seeded = false; VIEWS['3d'].settled = false;
    VIEWS.matrix.built = false;
    VIEWS.rings.meta = null;
    curView = 'web';
    fit();
    renderLegend();
    renderViewBar();
    draw();
    startSim();
  }

  document.getElementById('pick').addEventListener('change', async (e) => {
    const recordFiles = [...e.target.files].filter((f) => RECORD.test(f.name));
    const entries = await Promise.all(recordFiles.map(async (f) => ({ name: f.name, text: await f.text() })));
    load(entries, 'live');
  });

  window.addEventListener('resize', () => { size(); draw(); });
  size();
  if (window.CORPUS_DATA) load(window.CORPUS_DATA.files, 'snapshot ' + window.CORPUS_DATA.generated);
</script>
</body>
</html>
